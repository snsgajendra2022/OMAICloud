name: Python regression tests

on:
  push:
    branches:
      - feature/gpt5-production-runtime
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run chat runtime regression tests
        run: |
          python -m pytest -q \
            tests/test_chat_empty_generation.py \
            tests/test_chat_backend.py
