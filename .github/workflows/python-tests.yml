name: Python regression tests

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

on:
  push:
    branches:
      - feature/gpt5-production-runtime
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-tests:
    name: Native chat and capability regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run native chat and capability tests
        run: |
          python -m pytest -q \
            tests/test_chat_empty_generation.py \
            tests/test_chat_backend.py \
            tests/test_om_capability_evaluation.py \
            tests/test_chat_verification_truthfulness.py \
            tests/test_hinglish_intent_understanding.py \
            tests/test_conversation_memory_isolation.py \
            tests/test_conversation_store_thread_safety.py \
            tests/test_evolution_matrix.py \
            tests/test_om_module_runtime_manifest.py

  full-python-suite:
    name: Full Python regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run full test suite
        run: python -m pytest -q
      - name: Upload regression test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-regression-results-${{ github.run_id }}
          path: |
            .pytest_cache/**
          if-no-files-found: ignore
          retention-days: 14
