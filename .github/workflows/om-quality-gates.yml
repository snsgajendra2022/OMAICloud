name: OM AI quality gates

on:
  push:
    branches:
      - main
      - feature/gpt5-production-runtime
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile Python packages and scripts
        run: python -m compileall -q om_ai scripts
      - name: Audit architecture inventory
        run: python scripts/audit_om_architecture.py
      - name: Run test suite
        run: python -m pytest -q
