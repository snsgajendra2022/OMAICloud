apiVersion: apps/v1
kind: Deployment
metadata:
  name: om-ai-gateway
  labels:
    app: om-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: om-ai
  template:
    metadata:
      labels:
        app: om-ai
    spec:
      containers:
        - name: om-api
          image: om-ai-platform:1.0
          ports:
            - containerPort: 8080
          env:
            - name: OM_MODEL_PROVIDER
              value: om_native
---
apiVersion: v1
kind: Service
metadata:
  name: om-ai-gateway
spec:
  selector:
    app: om-ai
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
