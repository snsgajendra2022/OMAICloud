[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "om-ai-operating-brain"
version = "0.3.0"
description = "Self-owned private AI operating brain foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.8.0",
  "numpy>=1.26.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
  "tokenizers>=0.19.0",
  "beautifulsoup4>=4.12.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
deepSpeed = ["deepspeed>=0.15"]
vision = ["pillow>=10.0"]
voice = [
  "soundfile>=0.12",
  "sounddevice>=0.4.6",
  "faster-whisper>=1.0.0",
]
hf = [
  "transformers>=4.45.0",
  "accelerate>=0.34.0",
  "safetensors>=0.4.5",
]
hf-quant = [
  "transformers>=4.45.0",
  "accelerate>=0.34.0",
  "safetensors>=0.4.5",
  "bitsandbytes>=0.43.3; platform_system=='Linux'",
]
companion = [
  "om-ai-operating-brain[voice]",
  "pywebview>=5.0",
  "pyobjc-framework-Cocoa>=10.0; platform_system=='Darwin'",
]

[project.scripts]
om-ai = "om_ai.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["om_ai*", "services*", "ai_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
