<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>OM · Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#FFFFFF;--side:#F7F7F8;--border:#E5E7EB;--text:#111827;
  --muted:#6B7280;--primary:#111827;--accent:#2563EB;--danger:#DC2626;
  --success:#059669;--soft:#F1F5F9;--sans:"Plus Jakarta Sans",system-ui,sans-serif;--sw:260px;
}
body.dark{
  --bg:#111827;--side:#1F2937;--border:#374151;--text:#F9FAFB;
  --muted:#9CA3AF;--primary:#F9FAFB;--accent:#3B82F6;--danger:#F87171;
  --success:#34D399;--soft:#1E293B;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{font-family:var(--sans);color:var(--text);background:var(--bg);display:flex;overflow:hidden;}
button,input,textarea,select{font:inherit;color:inherit;}
button{cursor:pointer;}
a{color:inherit;text-decoration:none;}
.hidden{display:none!important;}
svg.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}

/* ── SIDEBAR ── */
.sidebar{width:var(--sw);flex-shrink:0;background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100%;z-index:40;transition:width .22s ease,transform .22s ease;position:relative;padding-bottom:60px;}
body.collapsed .sidebar{width:64px;}
body.collapsed .side-label,body.collapsed .nav-label,body.collapsed .user-meta,
body.collapsed .brand-text,body.collapsed .ws-switcher{display:none!important;}
body.collapsed .btn-new{justify-content:center;padding:10px;}
body.collapsed .nav-btn{justify-content:center;padding:10px;}
body.collapsed .conv-panel-wrap{display:none;}
body.collapsed .side-nav-wrap{flex:1 1 0%;}
body.collapsed .side-bottom{justify-content:center;}

.side-top{padding:14px 12px 8px;display:flex;flex-direction:column;gap:8px;flex-shrink:0;}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;}
.logo{width:32px;height:32px;border-radius:9px;flex-shrink:0;background:linear-gradient(145deg,#1f2937,#111827);display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;letter-spacing:-.02em;}
body.dark .logo{background:linear-gradient(145deg,#2563EB,#1D4ED8);}
.brand-text{min-width:0;}
.brand-text strong{display:block;font-size:15px;letter-spacing:-.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.brand-text span{font-size:11px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ws-switcher{display:flex;gap:4px;margin-top:2px;}
.ws-switcher button{border:1px solid var(--border);background:var(--bg);border-radius:8px;padding:4px 8px;font-size:11px;font-weight:600;color:var(--muted);}
.ws-switcher button:hover{color:var(--text);border-color:#94A3B8;}
.collapse-btn,.icon-btn,.ghost-btn{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:8px;padding:6px;line-height:0;display:inline-flex;align-items:center;justify-content:center;}
.collapse-btn:hover,.icon-btn:hover,.ghost-btn:hover{background:rgba(0,0,0,.06);color:var(--text);}
body.dark .collapse-btn:hover,body.dark .icon-btn:hover,body.dark .ghost-btn:hover{background:rgba(255,255,255,.08);}
.icon-btn.danger:hover{color:var(--danger);background:rgba(220,38,38,.1);}
.btn-new{width:100%;border:1px solid var(--border);background:var(--bg);border-radius:10px;padding:10px 12px;font-weight:600;font-size:13.5px;text-align:left;display:flex;align-items:center;gap:8px;}
.btn-new:hover{border-color:#94A3B8;box-shadow:0 2px 8px rgba(17,24,39,.06);}

.side-nav-wrap{flex:1 1 0%;min-height:0;overflow-y:auto;padding:0 0 8px;display:flex;flex-direction:column;}
.nav{display:flex;flex-direction:column;gap:1px;padding:0 8px;overflow:visible;max-height:none;}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;border-radius:10px;padding:8px 10px;color:var(--muted);font-size:13px;font-weight:550;text-align:left;}
.nav-btn:hover{background:rgba(0,0,0,.05);color:var(--text);}
body.dark .nav-btn:hover{background:rgba(255,255,255,.06);}
.nav-btn.active{background:#E8EEF7;color:var(--accent);font-weight:650;}
body.dark .nav-btn.active{background:rgba(59,130,246,.15);color:#93C5FD;}

.conv-panel-wrap{flex:1 1 0%;min-height:0;display:none;flex-direction:column;overflow:hidden;border-top:1px solid var(--border);}
body.chat-mode .side-nav-wrap{flex:0 1 auto;max-height:42vh;}
body.chat-mode .conv-panel-wrap{display:flex;flex:1 1 0%;}
body:not(.chat-mode) .side-nav-wrap{flex:1 1 0%;max-height:none;}
.conv-filter-bar{padding:6px 8px 2px;display:flex;gap:4px;flex-wrap:wrap;flex-shrink:0;}
.conv-filter-btn{border:1px solid var(--border);background:transparent;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:650;color:var(--muted);cursor:pointer;}
.conv-filter-btn:hover{color:var(--text);}
.conv-filter-btn.active{background:#EFF6FF;border-color:#BFDBFE;color:var(--accent);}
body.dark .conv-filter-btn.active{background:rgba(59,130,246,.15);border-color:rgba(59,130,246,.3);color:#93C5FD;}
.conv-panel{overflow-y:auto;padding:4px 8px 12px;flex:1;min-height:0;}
.group-label{font-size:11px;font-weight:650;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding:10px 10px 4px;}
.conv-item{width:100%;border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:10px;font-size:13px;display:flex;align-items:center;gap:6px;margin-bottom:1px;position:relative;}
.conv-item:hover{background:rgba(0,0,0,.05);}
body.dark .conv-item:hover{background:rgba(255,255,255,.06);}
.conv-item.active{background:#E8EEF7;font-weight:600;}
body.dark .conv-item.active{background:rgba(59,130,246,.12);}
.conv-item .ci-title{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.conv-pin-icon{color:var(--accent);flex-shrink:0;font-size:10px;}
.conv-more-btn{border:0;background:transparent;color:var(--muted);border-radius:6px;padding:3px 4px;line-height:0;display:none;flex-shrink:0;align-items:center;}
.conv-item:hover .conv-more-btn,.conv-item.active .conv-more-btn{display:inline-flex;}
.conv-more-btn:hover{background:var(--soft);color:var(--text);}
.conv-ctx{position:fixed;min-width:200px;background:var(--bg);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px rgba(17,24,39,.15);padding:6px;z-index:200;display:none;}
.conv-ctx.open{display:block;}
.conv-ctx button{width:100%;border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:8px;font-size:13px;font-weight:550;display:flex;align-items:center;gap:8px;}
.conv-ctx button:hover{background:var(--soft);}
.conv-ctx .ctx-sep{height:1px;background:var(--border);margin:4px 8px;}
.conv-ctx button.ctx-danger{color:var(--danger);}
.conv-ctx button.ctx-danger:hover{background:rgba(220,38,38,.08);}

.side-bottom{border-top:1px solid var(--border);padding:12px;display:flex;align-items:center;gap:10px;position:absolute;left:0;right:0;bottom:0;flex-shrink:0;background:var(--side);z-index:6;}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--primary);color:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:700;flex-shrink:0;}
.user-meta{flex:1;min-width:0;}
.user-meta strong{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.menu{position:absolute;bottom:calc(100% + 8px);left:12px;right:12px;background:var(--bg);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px rgba(17,24,39,.12);padding:6px;z-index:50;display:none;}
.menu.open{display:block;}
.menu button,.menu a{width:100%;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:550;display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit;}
.menu button:hover,.menu a:hover{background:var(--soft);}
.drop-menu{position:absolute;top:calc(100% + 8px);right:0;min-width:220px;max-height:340px;overflow-y:auto;background:var(--bg);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px rgba(17,24,39,.12);padding:6px;display:none;z-index:60;}
.drop-menu.open{display:block;}
.drop-menu button,.drop-menu .drop-item{width:100%;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:550;display:flex;align-items:center;gap:8px;}
.drop-menu button:hover,.drop-menu .drop-item:hover{background:#EFF6FF;color:var(--accent);}
body.dark .drop-menu button:hover,body.dark .drop-menu .drop-item:hover{background:rgba(59,130,246,.12);color:#93C5FD;}
.drop-menu button.active{background:#EFF6FF;color:var(--accent);}
body.dark .drop-menu button.active{background:rgba(59,130,246,.15);color:#93C5FD;}
.drop-menu .drop-sep{height:1px;background:var(--border);margin:4px 8px;}
.notif-item{padding:10px 12px;border-radius:8px;font-size:13px;cursor:pointer;}
.notif-item:hover{background:var(--soft);}
.notif-item.unread{background:#EFF6FF;}
body.dark .notif-item.unread{background:rgba(59,130,246,.1);}
.notif-item strong{display:block;font-size:13px;margin-bottom:2px;}
.notif-item span{color:var(--muted);font-size:12px;}

/* ── MAIN ── */
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;background:var(--bg);}
.topbar{height:56px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 16px;flex-shrink:0;position:relative;}
.hamburger{display:none;border:1px solid var(--border);background:var(--bg);border-radius:8px;width:36px;height:36px;place-items:center;flex-shrink:0;}
.hamburger span,.hamburger span::before,.hamburger span::after{display:block;width:16px;height:1.5px;background:var(--text);position:relative;}
.hamburger span::before,.hamburger span::after{content:"";position:absolute;left:0;}
.hamburger span::before{top:-5px;}.hamburger span::after{top:5px;}
.top-title{flex:1;font-size:15px;font-weight:650;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;min-width:0;}
.top-actions{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.model-wrap{position:relative;}
.model-btn{border:1px solid var(--border);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:650;color:var(--accent);display:flex;align-items:center;gap:6px;}
.model-btn:hover{background:#EFF6FF;}
body.dark .model-btn:hover{background:rgba(59,130,246,.1);}
.badge-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);position:absolute;top:4px;right:4px;}

/* ── VIEWS ── */
.view{flex:1;min-height:0;display:none;flex-direction:column;}
.view.active{display:flex;}
.messages{flex:1;overflow-y:auto;padding:24px 16px 12px;display:flex;flex-direction:column;gap:18px;}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:32px 16px;text-align:center;}
.empty-state h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.04em;}
.empty-state p{margin:0;color:var(--muted);font-size:14px;max-width:420px;}
.suggest-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;max-width:640px;width:100%;}
.suggest-card{border:1px solid var(--border);background:var(--side);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;}
.suggest-card:hover{border-color:#94A3B8;background:var(--soft);}
.suggest-card strong{font-size:13px;}
.suggest-card span{font-size:12px;color:var(--muted);line-height:1.4;}
.row{max-width:760px;width:100%;margin:0 auto;display:flex;gap:10px;}
.row.user{flex-direction:row-reverse;}
.om-tag{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin-bottom:4px;}
.bubble{max-width:min(100%,640px);padding:12px 16px;border-radius:16px;font-size:14.5px;line-height:1.6;word-break:break-word;}
.row.user .bubble{background:var(--primary);color:var(--bg);border-bottom-right-radius:6px;}
.row.assistant .bubble{background:var(--side);border:1px solid var(--border);border-bottom-left-radius:6px;}
.bubble pre{background:rgba(0,0,0,.07);border-radius:8px;padding:10px 14px;overflow-x:auto;margin:8px 0;font-size:13px;}
body.dark .bubble pre{background:rgba(255,255,255,.07);}
.bubble code{font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:13px;}
.bubble pre code{background:none;padding:0;}
.bubble :not(pre) > code{background:rgba(0,0,0,.07);border-radius:4px;padding:1px 5px;font-size:.9em;}
body.dark .bubble :not(pre) > code{background:rgba(255,255,255,.1);}
.msg-actions{display:flex;gap:2px;margin-top:6px;flex-wrap:wrap;align-items:center;}
.msg-actions button{border:0;background:transparent;color:var(--muted);font-size:12px;padding:4px 8px;border-radius:6px;font-weight:600;display:inline-flex;align-items:center;gap:4px;}
.msg-actions button:hover{background:var(--soft);color:var(--text);}
.msg-actions button.active{color:var(--accent);}
.tts-btn.speaking{color:var(--danger);}

/* ── COMPOSER ── */
.composer-wrap{padding:10px 16px 18px;flex-shrink:0;}
.composer{max-width:760px;margin:0 auto;border:1px solid var(--border);background:var(--bg);border-radius:18px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;box-shadow:0 8px 24px rgba(17,24,39,.05);}
.composer:focus-within{border-color:#94A3B8;}
.composer-tools{display:flex;gap:4px;flex-wrap:wrap;padding:0 2px;align-items:center;}
.tool-toggle{border:1px solid var(--border);background:var(--side);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:650;color:var(--muted);display:inline-flex;align-items:center;gap:4px;}
.tool-toggle.on{background:#EFF6FF;border-color:#BFDBFE;color:var(--accent);}
body.dark .tool-toggle.on{background:rgba(59,130,246,.15);border-color:rgba(59,130,246,.3);color:#93C5FD;}
.composer-model-chip{border:1px solid var(--border);background:var(--side);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:650;color:var(--muted);display:inline-flex;align-items:center;gap:4px;margin-left:auto;cursor:pointer;}
.composer-model-chip:hover{color:var(--text);border-color:#94A3B8;}
.composer-row{display:flex;gap:8px;align-items:flex-end;}
.composer textarea{flex:1;border:0;outline:none;resize:none;max-height:160px;min-height:24px;padding:6px 0;background:transparent;line-height:1.45;}
.btn-send,.btn-stop{height:36px;border:0;border-radius:10px;padding:0 14px;font-weight:650;font-size:13px;flex-shrink:0;}
.btn-send{background:var(--primary);color:var(--bg);min-width:36px;display:grid;place-items:center;}
.btn-send:disabled{opacity:.4;cursor:not-allowed;}
.btn-send svg{width:16px;height:16px;fill:currentColor;stroke:none;}
.btn-stop{background:#FEE2E2;color:var(--danger);display:none;}
.btn-stop.show{display:inline-flex;align-items:center;gap:6px;}
.hint{text-align:center;font-size:11px;color:var(--muted);margin:8px 0 0;}
.attach-wrap{position:relative;display:inline-flex;}
.attach-drop{position:absolute;bottom:calc(100% + 8px);left:0;min-width:190px;background:var(--bg);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px rgba(17,24,39,.12);padding:6px;z-index:80;display:none;}
.attach-drop.open{display:block;}
.attach-drop button{width:100%;border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:8px;font-size:13px;font-weight:550;display:flex;align-items:center;gap:8px;}
.attach-drop button:hover{background:var(--soft);}
.mic-btn{border:0;background:transparent;color:var(--muted);border-radius:8px;padding:6px;line-height:0;display:inline-flex;align-items:center;}
.mic-btn:hover{background:var(--soft);color:var(--text);}
.mic-btn.listening{color:var(--danger);animation:micPulse 1s infinite;}
@keyframes micPulse{0%,100%{opacity:1;}50%{opacity:.5;}}

/* ── PANEL ── */
.panel{flex:1;overflow-y:auto;padding:24px 20px 40px;}
.panel-inner{max-width:760px;margin:0 auto;}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
.panel h2{margin:0 0 4px;font-size:22px;letter-spacing:-.03em;}
.panel .sub{color:var(--muted);font-size:14px;margin:0;}
.back-btn{border:1px solid var(--border);background:var(--bg);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;}
.back-btn:hover{color:var(--text);}
.card-list{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
.entity{border:1px solid var(--border);border-radius:14px;padding:14px 16px;background:var(--bg);display:flex;gap:12px;align-items:flex-start;}
.entity h3{margin:0 0 4px;font-size:15px;}
.entity p{margin:0;color:var(--muted);font-size:13px;line-height:1.45;white-space:pre-wrap;}
.entity .grow{flex:1;min-width:0;}
.entity-actions{display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0;}

/* ── TABS ── */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:20px;overflow-x:auto;}
.tab{border:0;background:transparent;padding:9px 14px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:0;white-space:nowrap;flex-shrink:0;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}

/* ── FORMS ── */
.form-grid{display:grid;gap:10px;border:1px solid var(--border);border-radius:14px;padding:16px;background:var(--side);margin-top:16px;}
.form-grid label,.settings-section label,.inline-label{display:grid;gap:6px;font-size:12px;font-weight:650;color:var(--muted);}
.form-grid input,.form-grid textarea,.form-grid select,
.settings-section input,.settings-section select,.settings-section textarea{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--bg);outline:none;width:100%;}
.form-grid input:focus,.form-grid textarea:focus,.form-grid select:focus,
.settings-section input:focus,.settings-section select:focus,.settings-section textarea:focus{border-color:#94A3B8;}
.settings-section{border:1px solid var(--border);border-radius:14px;padding:16px;background:var(--side);margin-bottom:14px;}
.settings-section h3{margin:0 0 12px;font-size:14px;font-weight:700;}
.settings-grid{display:grid;gap:10px;}
.btn-primary{border:0;background:var(--primary);color:var(--bg);border-radius:10px;padding:10px 14px;font-weight:650;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;}
.btn-primary:hover{opacity:.9;}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.btn-outline{border:1px solid var(--border);background:var(--bg);border-radius:10px;padding:8px 12px;font-weight:600;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;}
.btn-outline:hover{color:var(--text);border-color:#94A3B8;}
.btn-danger{border:0;background:rgba(220,38,38,.1);color:var(--danger);border-radius:10px;padding:8px 12px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;}
.btn-danger:hover{background:rgba(220,38,38,.18);}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;}
.toggle-label{font-size:13px;font-weight:550;}
.toggle-sub{font-size:12px;color:var(--muted);}
.sw-wrap{position:relative;width:40px;height:22px;flex-shrink:0;}
.sw-wrap input{opacity:0;width:0;height:0;position:absolute;}
.sw-track{position:absolute;inset:0;background:#CBD5E1;border-radius:999px;transition:background .2s;cursor:pointer;}
.sw-wrap input:checked + .sw-track{background:var(--accent);}
.sw-thumb{position:absolute;top:3px;left:3px;width:16px;height:16px;background:#fff;border-radius:50%;pointer-events:none;transition:left .2s;}
.sw-wrap input:checked + .sw-track + .sw-thumb{left:21px;}

/* ── SEARCH ── */
.search-bar{width:100%;border:1px solid var(--border);background:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px;outline:none;margin-bottom:16px;}
.search-bar:focus{border-color:#94A3B8;}
.search-group{margin-bottom:20px;}
.search-group h4{margin:0 0 8px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.search-hit{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;background:var(--bg);}
.search-hit:hover{background:var(--soft);}
.search-hit strong{display:block;font-size:14px;margin-bottom:2px;}
.search-hit span{font-size:12px;color:var(--muted);}
.tag{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:4px;background:var(--soft);color:var(--muted);margin-right:6px;}

/* ── STATUS BADGES ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
.badge.green{background:#DCFCE7;color:#166534;}
.badge.yellow{background:#FEF9C3;color:#854D0E;}
.badge.red{background:#FEE2E2;color:#991B1B;}
.badge.gray{background:var(--soft);color:var(--muted);}
.badge.blue{background:#EFF6FF;color:var(--accent);}
body.dark .badge.green{background:rgba(16,185,129,.15);color:#34D399;}
body.dark .badge.yellow{background:rgba(234,179,8,.15);color:#FCD34D;}
body.dark .badge.red{background:rgba(239,68,68,.15);color:#F87171;}
body.dark .badge.blue{background:rgba(59,130,246,.15);color:#93C5FD;}

/* ── MISC ── */
.skeleton{background:linear-gradient(90deg,var(--soft) 25%,#E2E8F0 50%,var(--soft) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:10px;height:64px;margin-bottom:10px;}
body.dark .skeleton{background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 75%);background-size:200% 100%;}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
.empty-panel{text-align:center;padding:40px 20px;color:var(--muted);}
.empty-panel h3{margin:0 0 8px;color:var(--text);font-size:16px;}
.empty-panel p{margin:0 0 16px;font-size:14px;}
.history-item{border-left:2px solid var(--border);padding:0 0 16px 16px;margin-left:8px;position:relative;}
.history-item::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);position:absolute;left:-5px;top:4px;}
.history-item strong{display:block;font-size:14px;}
.history-item span{font-size:12px;color:var(--muted);}
.profile-card{border:1px solid var(--border);border-radius:14px;padding:20px;display:flex;gap:16px;align-items:center;margin-bottom:20px;background:var(--side);}
.profile-card .avatar{width:56px;height:56px;font-size:20px;}
.profile-card h3{margin:0 0 4px;font-size:18px;}
.profile-card p{margin:0;color:var(--muted);font-size:13px;}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px;}
.stat{border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--bg);}
.stat strong{display:block;font-size:20px;margin-bottom:2px;}
.stat span{font-size:12px;color:var(--muted);}
.detail-header{border:1px solid var(--border);border-radius:14px;padding:20px;background:var(--side);margin-bottom:16px;}
.detail-header h2{margin:0 0 6px;font-size:20px;font-weight:700;}
.detail-header .sub{color:var(--muted);font-size:14px;margin:0;}
.detail-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center;}
.member-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:var(--bg);margin-bottom:8px;}
.member-row .avatar{width:30px;height:30px;font-size:11px;}
.member-row .grow{flex:1;}
.member-role{font-size:11px;color:var(--muted);}
.version-row{padding:8px 0;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;font-size:13px;}
.version-row:last-child{border-bottom:0;}
.version-row .ver-n{font-weight:700;color:var(--accent);flex-shrink:0;}
.version-row .ver-d{color:var(--muted);font-size:12px;flex-shrink:0;}
.version-row .ver-c{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px;}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--soft);color:var(--muted);border:1px solid var(--border);}
.chip.on{background:#EFF6FF;border-color:#BFDBFE;color:var(--accent);}
body.dark .chip.on{background:rgba(59,130,246,.15);border-color:rgba(59,130,246,.3);color:#93C5FD;}

/* ── TOAST / MODAL ── */
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:300;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.toast{background:var(--primary);color:var(--bg);padding:12px 16px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(17,24,39,.18);transform:translateX(120%);transition:transform .25s ease;max-width:360px;}
.toast.show{transform:translateX(0);}
.toast.success{background:var(--success);}
.toast.error{background:var(--danger);}
.toast.info{background:var(--accent);}
.backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:35;}
.modal{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:20px;background:rgba(15,23,42,.4);}
.modal.open{display:grid;}
.modal-box{background:var(--bg);border-radius:16px;padding:24px;max-width:500px;width:100%;border:1px solid var(--border);box-shadow:0 20px 48px rgba(17,24,39,.18);}
.modal-box h3{margin:0 0 12px;font-size:16px;font-weight:700;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}

/* ── RESPONSIVE ── */
@media(max-width:860px){
  .hamburger{display:grid;}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:min(var(--sw),86vw);transform:translateX(-105%);}
  body.collapsed .sidebar{width:min(var(--sw),86vw);}
  .sidebar.open{transform:translateX(0);}
  .backdrop.open{display:block;}
  .collapse-btn{display:none;}
  .top-title{text-align:left;}
}

<body>
<div class="backdrop" id="backdrop"></div>

<aside class="sidebar" id="sidebar">
  <div class="side-top">
    <div class="brand-row">
      <div class="brand">
        <div class="logo" aria-hidden="true">OM</div>
        <div class="brand-text side-label">
          <strong id="wsName">Workspace</strong>
          <span id="wsSub">OM AI</span>
        </div>
      </div>
      <button type="button" class="collapse-btn" id="collapseBtn" title="Collapse sidebar" aria-label="Collapse"></button>
    </div>
    <div class="ws-switcher side-label" id="wsSwitcher">
      <button type="button" id="wsSwitchBtn">Switch</button>
      <button type="button" id="wsCreateBtn">+ New</button>
    </div>
    <button type="button" class="btn-new" id="newChatBtn"></button>
  </div>

  <div class="side-nav-wrap" id="sideNavWrap">
    <nav class="nav" id="navTabs"></nav>
  </div>

  <div class="conv-panel-wrap" id="convPanelWrap">

      <button type="button" class="conv-filter-btn" data-filter="pinned">Pinned</button>
      <button type="button" class="conv-filter-btn" data-filter="archived">Archived</button>
    </div>
    <div class="conv-panel" id="convList"></div>
  </div>

  <div class="side-bottom">
    <div class="avatar" id="userAvatar">O</div>
    <div class="user-meta side-label"><strong id="userName">User</strong></div>
    <button type="button" class="ghost-btn" id="sideMenuBtn" aria-label="Profile menu"></button>
    <div class="menu" id="sideMenu"></div>
  </div>
</aside>

<main class="main">
  <header class="topbar" id="topbar">
    <button type="button" class="hamburger" id="menuBtn" aria-label="Menu"><span></span></button>
    <div class="model-wrap" id="modelWrap">
      <button type="button" class="model-btn" id="modelBtn"></button>
      <div class="drop-menu" id="modelDrop"></div>
    </div>
    <div class="top-title" id="topTitle">New chat</div>
    <div class="top-actions">
      <button type="button" class="icon-btn" id="searchTopBtn" title="Search"></button>
      <button type="button" class="icon-btn" id="shareBtn" title="Share conversation"></button>
      <div style="position:relative">
        <button type="button" class="icon-btn" id="notifBtn" title="Notifications"></button>
        <span class="badge-dot hidden" id="notifDot"></span>
        <div class="drop-menu" id="notifDrop" style="width:320px;max-height:400px"></div>
      </div>
      <button type="button" class="icon-btn" id="helpBtn" title="Help"></button>
      <div style="position:relative">
        <button type="button" class="icon-btn" id="headerProfileBtn" aria-label="Profile">
          <div class="avatar" id="headerAvatar" style="width:30px;height:30px;font-size:12px">O</div>
        </button>
        <div class="drop-menu" id="headerMenu" style="width:200px"></div>
      </div>
    </div>
  </header>

  <!-- CHAT -->
  <section class="view active" id="view-chat">
    <div class="messages" id="messages"></div>
    <div class="composer-wrap">
      <form class="composer" id="composer">
        <input type="file" id="fileInput" accept="*/*" class="hidden"/>
        <input type="file" id="fileUploadInput" accept="*/*" class="hidden"/>
        <div class="composer-tools" id="composerTools">
          <button type="button" class="tool-toggle" id="toolWeb" data-tool="web"></button>
          <button type="button" class="tool-toggle" id="toolCode" data-tool="code"></button>
          <button type="button" class="composer-model-chip" id="composerModelChip"></button>
        </div>
        <div class="composer-row">
          <div class="attach-wrap">
            <button type="button" class="icon-btn" id="attachBtn" title="Attach" aria-label="Attach"></button>
            <div class="attach-drop" id="attachDrop">
              <button type="button" id="attachUploadFile"></button>
              <button type="button" id="attachTextFile"></button>
            </div>
          </div>
          <button type="button" class="mic-btn" id="micBtn" title="Voice input" aria-label="Voice input"></button>
          <textarea id="input" rows="1" placeholder="Message OM…" autocomplete="off"></textarea>
          <button type="button" class="btn-stop" id="stopBtn">Stop</button>
          <button type="submit" class="btn-send" id="sendBtn" aria-label="Send" disabled>
            <svg viewBox="0 0 24 24"><path d="M3.4 20.6 21 12 3.4 3.4l.1 6.8L15 12 3.5 13.8z"/></svg>
          </button>
        </div>
      </form>
      <p class="hint">Enter to send · ⌘K search · Shift+Enter new line</p>
    </div>
  </section>

  <!-- SEARCH -->
  <section class="view" id="view-search"><div class="panel"><div class="panel-inner" id="searchPanel"></div></div></section>

  <!-- LIBRARY -->
  <section class="view" id="view-library"><div class="panel"><div class="panel-inner" id="libraryPanel"></div></div></section>

  <!-- SCHEDULED -->
  <section class="view" id="view-scheduled"><div class="panel"><div class="panel-inner" id="scheduledPanel"></div></div></section>

  <!-- TOOLS -->
  <section class="view" id="view-tools"><div class="panel"><div class="panel-inner" id="toolsPanel"></div></div></section>

  <!-- PROJECTS -->
  <section class="view" id="view-projects"><div class="panel"><div class="panel-inner" id="projectsPanel"></div></div></section>

  <!-- ASSISTANTS -->
  <section class="view" id="view-assistants"><div class="panel"><div class="panel-inner" id="assistantsPanel"></div></div></section>

  <!-- EXPLORE -->
  <section class="view" id="view-explore"><div class="panel"><div class="panel-inner" id="explorePanel"></div></div></section>

  <!-- FILES -->
  <section class="view" id="view-files"><div class="panel"><div class="panel-inner" id="filesPanel"></div></div></section>

  <!-- KNOWLEDGE -->
  <section class="view" id="view-knowledge"><div class="panel"><div class="panel-inner" id="knowledgePanel"></div></div></section>

  <!-- PROMPTS -->
  <section class="view" id="view-prompts"><div class="panel"><div class="panel-inner" id="promptsPanel"></div></div></section>

  <!-- MODELS -->
  <section class="view" id="view-models"><div class="panel"><div class="panel-inner" id="modelsPanel"></div></div></section>

  <!-- MEMORY -->
  <section class="view" id="view-memory"><div class="panel"><div class="panel-inner" id="memoryPanel"></div></div></section>

  <!-- SETTINGS -->
  <section class="view" id="view-settings"><div class="panel"><div class="panel-inner" id="settingsPanel"></div></div></section>

  <!-- PROFILE -->
  <section class="view" id="view-profile"><div class="panel"><div class="panel-inner" id="profilePanel"></div></div></section>
</main>

<div class="toast-wrap" id="toastWrap"></div>
<div class="conv-ctx" id="convCtxMenu"></div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="modalTitle">Confirm</h3>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button type="button" class="btn-outline" id="modalCancel">Cancel</button>
      <button type="button" class="btn-primary" id="modalOk">OK</button>
    </div>
  </div>
</div>

function svg(name, size) {
  return '<svg class="icon" width="'+(size||18)+'" height="'+(size||18)+'" viewBox="0 0 24 24">'+(ICONS[name]||"")+"</svg>";
}
function setIcon(el, name, size) { if (el) el.innerHTML = svg(name, size); }

function escapeHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function renderMarkdown(raw) {
  let s = String(raw)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const codeBlocks = [];
  s = s.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
    const i = codeBlocks.length;
    codeBlocks.push('<pre><code'+(lang?' class="language-'+lang+'"':'')+'>'+code+'</code></pre>');
    return "\x00CB"+i+"\x00";
  });
  const inlines = [];
  s = s.replace(/`([^`\n]+)`/g, (_, c) => {
    const i = inlines.length;
    inlines.push('<code>'+c+'</code>');
    return "\x00IC"+i+"\x00";
  });
  s = s.replace(/\*\*\*([^*]+)\*\*\*/g,"<strong><em>$1</em></strong>");
  s = s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s = s.replace(/\*([^*\n]+)\*/g,"<em>$1</em>");
  s = s.replace(/\n/g,"<br>");
  codeBlocks.forEach((b,i) => { s = s.split("\x00CB"+i+"\x00").join(b); });
  inlines.forEach((c,i) => { s = s.split("\x00IC"+i+"\x00").join(c); });
  return s;
}

function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  return d.toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
}

}

/* ─── API ─── */
async function api(path, opts, meta) {
  meta = meta || {};
  const headers = Object.assign({}, (opts && opts.headers) || {});
  if (opts && opts.body != null && !headers["Content-Type"] && !(opts.body instanceof FormData)) {
    headers["Content-Type"] = "application/json";
  }
  try {
    const res = await fetch(path, Object.assign({credentials:"include"}, opts||{}, {headers}));
    let data = null;
    const ct = res.headers.get("content-type") || "";
    if (ct.includes("application/json")) { try { data = await res.json(); } catch (_) {} }
    if (res.status === 401) { location.replace("/login"); throw new Error("unauthorized"); }
    if (!res.ok && meta.error !== false) {
      const detail = (data && (data.detail || data.error)) || ("HTTP "+res.status);
      toast(typeof detail === "string" ? detail : JSON.stringify(detail), "error");
    } else if (meta.success && res.ok) {
      toast(meta.success, "success");
    }
    return { res, data };
  } catch (e) {
    if (e.message !== "unauthorized") toast(e.message||"Request failed","error");
    throw e;
  }
}

function dayBucket(iso) {
  const d = iso ? new Date(iso) : null;
  if (!d || Number.isNaN(d.getTime())) return "Previous";
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const yesterday = new Date(today); yesterday.setDate(yesterday.getDate()-1);
  if (d >= today) return "Today";
  if (d >= yesterday) return "Yesterday";
  return "Previous";
}

function renderConvList() {
  els.convList.innerHTML = "";
  const showWrap = state.view === "chat";
  document.body.classList.toggle("chat-mode", showWrap);
  $("newChatBtn").style.display = "";
  if (!showWrap) return;

  let items = state.conversations.slice();
  if (state.convFilter === "pinned")   items = items.filter(c => c.pinned);
  if (state.convFilter === "archived") items = items.filter(c => c.archived);
  else if (state.convFilter === "all") items = items.filter(c => !c.archived);

  if (!items.length) {
    const empty = document.createElement("div");
    empty.style.cssText = "padding:16px 12px;color:var(--muted);font-size:13px;";
    empty.textContent = state.convFilter === "archived" ? "No archived chats" : "No chats yet";
    els.convList.appendChild(empty);
    return;
  }
  const groups = {Today:[],Yesterday:[],Previous:[]};
  items.forEach(c => groups[dayBucket(c.updated_at)].push(c));
  ["Today","Yesterday","Previous"].forEach(label => {
    const list = groups[label];
    if (!list.length) return;
    const h = document.createElement("div");

/* ─── CONVERSATION ACTIONS ─── */
async function renameConv(c) {
  const next = prompt("Rename chat", c.title||"New chat");
  if (next == null) return;
  const title = next.trim(); if (!title) return;
  const { res } = await api("/v1/conversations/"+encodeURIComponent(c.id),
    {method:"PATCH",body:JSON.stringify({title})},{success:"Chat renamed"});
  if (!res.ok) return;
  if (state.currentId === c.id) updateTopTitle();
  await refreshConversations();
}

async function pinConv(c, pinned) {
  const { res } = await api("/v1/conversations/"+encodeURIComponent(c.id),
    {method:"PATCH",body:JSON.stringify({pinned})},{success: pinned?"Pinned":"Unpinned"});
  if (res.ok) await refreshConversations();
}

async function archiveConv(c, archived) {
  const { res } = await api("/v1/conversations/"+encodeURIComponent(c.id),
    {method:"PATCH",body:JSON.stringify({archived})},{success: archived?"Archived":"Restored"});
  if (res.ok) {
    if (archived && state.currentId === c.id) {
      state.currentId = null; state.messages = [];
      updateTopTitle(); renderMessages();
    }
    await refreshConversations();
  }
}

async function moveToProject(c) {
  const { res, data } = await api("/v1/projects",{},{error:false});
  const projects = (res.ok && data && data.projects)||[];
  if (!projects.length) { toast("No projects yet — create one first","error"); setView("projects"); return; }
  const names = projects.map((p,i) => (i+1)+". "+p.name).join("\n");
  const pick = prompt("Move to project:\n"+names,"1");
  const idx = parseInt(pick,10)-1;
  if (Number.isNaN(idx)||!projects[idx]) return;
  await api("/v1/conversations/"+encodeURIComponent(c.id),
    {method:"PATCH",body:JSON.stringify({project_id:projects[idx].id})},{success:"Moved to "+projects[idx].name});
  await refreshConversations();
}

async function shareConvViaAPI(c) {
  const id = c ? c.id : state.currentId;
  if (!id) { toast("No active conversation","error"); return; }
  try {
    const { res, data } = await api("/v1/conversations/"+encodeURIComponent(id)+"/share",{method:"POST",body:"{}"},{error:false});
    if (res.ok && data && data.share_url) {
      await navigator.clipboard.writeText(data.share_url);
      toast("Share link copied to clipboard","success");
    } else {
      // fallback: copy current URL
      const url = location.origin+location.pathname+"?c="+encodeURIComponent(id);
      await navigator.clipboard.writeText(url);
      toast("Conversation link copied","success");
    }
  } catch (err) {
    toast("Share failed","error");
  }
}

async function exportConv(c) {
  const id = c ? c.id : state.currentId;
  if (!id) return;
  try {
    const { res, data } = await api("/v1/conversations/"+encodeURIComponent(id)+"/export",{},{error:false});
    if (res.ok && data) {
      const content = typeof data === "string" ? data : (data.content || data.markdown || JSON.stringify(data, null, 2));
      const blob = new Blob([content],{type:"text/markdown"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "conversation-"+id+".md";
      a.click(); URL.revokeObjectURL(a.href);
      toast("Export downloaded","success");
    } else {
      // Export from local messages
      const conv = state.conversations.find(x => x.id === id);
      const lines = [(conv && conv.title ? "# "+conv.title : "# Conversation"),""];
      state.messages.forEach(m => {
        if (m.role === "user") lines.push("**You:** "+m.content,"");
        else if (m.role === "assistant") lines.push("**OM:** "+m.content,"");
      });
      const blob = new Blob([lines.join("\n")],{type:"text/markdown"});
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
      a.download = "conversation-"+id+".md"; a.click(); URL.revokeObjectURL(a.href);
      toast("Exported from local data","success");
    }
  } catch (_) { toast("Export failed","error"); }
}

async function deleteConv(c) {
  if (!confirm('Delete "'+escapeHtml(c.title||"chat")+'"?')) return;
  const { res } = await api("/v1/conversations/"+encodeURIComponent(c.id),{method:"DELETE"},{success:"Chat deleted"});
  if (!res.ok) return;
  if (state.currentId === c.id) {
    state.currentId = null; state.messages = [];
    updateTopTitle(); renderMessages();
  }
  await refreshConversations();
}

/* ─── MESSAGES ─── */
function renderMessages() {
  els.messages.innerHTML = "";
  if (!state.messages.length) {
    const wrap = document.createElement("div");
    wrap.className = "empty-state";
    wrap.innerHTML = "<h1>How can I help?</h1><p>Start a conversation or try a suggestion.</p>";
    const grid = document.createElement("div");
    grid.className = "suggest-grid";
    SUGGESTIONS.forEach(s => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "suggest-card";
      b.innerHTML = "<strong>"+escapeHtml(s.cat)+"</strong><span>"+escapeHtml(s.text)+"</span>";
      b.addEventListener("click", () => { els.input.value = s.prompt; autosize(); els.input.focus(); });
      grid.appendChild(b);
    });
    wrap.appendChild(grid);
    els.messages.appendChild(wrap);
    return;
  }
  state.messages.forEach((m, idx) => {
    if (m.role !== "user" && m.role !== "assistant") return;
    const row = document.createElement("div");
    row.className = "row "+m.role;
    const col = document.createElement("div");
    if (m.role === "assistant") {
      const tag = document.createElement("div");
      tag.className = "om-tag"; tag.textContent = "OM";
      col.appendChild(tag);
    }
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (m._streaming) bubble.dataset.stream = "1";
    bubble.innerHTML = m._streaming ? "…" : (m.role === "assistant" ? renderMarkdown(m.content||"") : escapeHtml(m.content||"").replace(/\n/g,"<br>"));
    col.appendChild(bubble);
    if (m.role === "assistant" && !m._streaming) {
      col.appendChild(buildMsgActions(m, idx));

function buildMsgActions(m, idx) {
  const actions = document.createElement("div");
  actions.className = "msg-actions";
  const mk = (label, iconName, fn, cls) => {
    const b = document.createElement("button");
    b.type = "button";
    if (cls) b.className = cls;
    b.innerHTML = (iconName ? svg(iconName,14):"") + label;
    b.addEventListener("click", fn);
    return b;
  };
  // Read aloud
  const ttsBtn = mk("", "volume", () => {
    if (state.ttsActive) { speechSynthesis.cancel(); state.ttsActive = false; ttsBtn.classList.remove("speaking"); return; }
    const utt = new SpeechSynthesisUtterance(m.content||"");
    utt.onend = () => { state.ttsActive = false; ttsBtn.classList.remove("speaking"); };
    utt.onerror = () => { state.ttsActive = false; ttsBtn.classList.remove("speaking"); };
    speechSynthesis.speak(utt);
    state.ttsActive = true; ttsBtn.classList.add("speaking");
  }, "tts-btn");
  ttsBtn.title = "Read aloud";
  actions.append(
    mk("Copy","copy", async () => {
      try { await navigator.clipboard.writeText(m.content||""); toast("Copied","success"); }
      catch (_) { toast("Copy failed","error"); }
    }),
    mk("","thumbUp",   () => sendFeedback(idx, 5)),
    mk("","thumbDown", () => sendFeedback(idx, 1)),
    mk("Regenerate","refresh", () => regenerate(idx)),
    ttsBtn,
    mk("Share","share", () => shareMessage(m.content)),
    mk("More","more", e => showMsgMore(e, m, idx))

function showMsgMore(e, m, idx) {
  closeMenus();
  const menu = document.createElement("div");
  menu.className = "drop-menu open";
  Object.assign(menu.style, {position:"fixed",left:Math.min(e.clientX,window.innerWidth-240)+"px",top:e.clientY+"px",zIndex:"250"});
  [
    ["Save to library", () => saveToLibrary(m.content)],
    ["Add to project",  () => addToProject(m.content)],
    ["Export",          () => exportMessage(m.content)],
    ["Report",          () => toast("Report submitted — thank you","success")],
  ].forEach(([label, fn]) => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = label;
    b.addEventListener("click", () => { menu.remove(); fn(); });

}

async function regenerate(assistantIdx) {
  if (state.busy) return;
  let userIdx = -1;
  for (let i = assistantIdx-1; i >= 0; i--) {
    if (state.messages[i].role === "user") { userIdx = i; break; }
  }
  if (userIdx < 0) return;
  const prompt = state.messages[userIdx].content;
  state.messages = state.messages.slice(0,assistantIdx);
  if (state.messages.length && state.messages[state.messages.length-1].role === "user") state.messages.pop();
  renderMessages();
  await sendPrompt(prompt);
}

/* ─── STREAMING ─── */
async function streamCompletion(messages) {
  const controller = new AbortController();
  state.abort = controller;
  const res = await fetch("/api/v1/chat/completions", {
    method:"POST", credentials:"include", signal:controller.signal,
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      model:state.model||"OM-1.0", messages,
      max_tokens:1024, temperature:state.settings?state.settings.temperature:0.8, stream:true,
    }),
  });
  if (res.status === 401) { location.replace("/login"); throw new Error("unauthorized"); }
  if (!res.ok) {
    let detail = "HTTP "+res.status;
    try { const err = await res.json(); detail = err.detail||err.error||detail; if (typeof detail !== "string") detail = JSON.stringify(detail); } catch (_) {}
    throw new Error(detail);
  }
  const reader = res.body.getReader(), decoder = new TextDecoder();
  let buffer = "", full = "";
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value,{stream:true});
    const parts = buffer.split("\n"); buffer = parts.pop()||"";
    for (const line of parts) {
      const trimmed = line.trim();
      if (!trimmed.startsWith("data:")) continue;
      const payload = trimmed.slice(5).trim();
      if (payload === "[DONE]") continue;
      try {
        const json = JSON.parse(payload);
        const delta = json.choices && json.choices[0] && json.choices[0].delta;
        if (delta && typeof delta.content === "string") {
          full += delta.content;
          const last = state.messages[state.messages.length-1];
          if (last && last.role === "assistant") last.content = full;
          updateStreamBubble(full);
        }
        if (json.model) state.model = json.model;
      } catch (_) {}
    }
  }
  return full;
}

async function sendPrompt(text) {
  const prompt = String(text||"").trim();
  if (!prompt || state.busy) return;
  els.input.value = ""; autosize();
  setView("chat", true);
  if (!state.currentId) {
    try { await createChat("New chat"); } catch (e) { return; }
  }
  state.messages.push({role:"user",content:prompt});
  state.messages.push({role:"assistant",content:"",_streaming:true});
  renderMessages(); setBusy(true);
  const reqMsgs = buildRequestMessages();
  try {
    const reply = await streamCompletion(reqMsgs);
    const clean = String(reply||"").trim()||"(empty reply)";
    const last = state.messages[state.messages.length-1];
    if (last && last.role === "assistant") { last.content = clean; delete last._streaming; }
    renderMessages();
    try { await appendTurn(prompt, clean); } catch (_) { toast("Reply ok, save failed","error"); }
  } catch (e) {
    if (e.name === "AbortError") {
      const last = state.messages[state.messages.length-1];
      if (last && last.role === "assistant") { last.content = (last.content||"").trim()||"(stopped)"; delete last._streaming; }
      renderMessages();
      const final = state.messages[state.messages.length-1];
      if (final && final.role === "assistant" && final.content && final.content !== "(stopped)") {
        try { await appendTurn(prompt, final.content); } catch (_) {}
      }
    } else {
      if (state.messages.length && state.messages[state.messages.length-1].role === "assistant") state.messages.pop();
      if (state.messages.length && state.messages[state.messages.length-1].role === "user") state.messages.pop();
      renderMessages();
      if (e.message !== "unauthorized") toast(e.message||"Request failed","error");
    }
  } finally { state.abort = null; setBusy(false); }
}

function stopStream() { if (state.abort) state.abort.abort(); }

function buildRequestMessages() {
  const history = state.messages
    .filter(m => (m.role==="user"||m.role==="assistant") && !m._streaming)
    .map(m => ({role:m.role,content:m.content}));
  if (state.selectedAssistantId) {
    const a = state.assistants.find(x => x.id === state.selectedAssistantId);
    if (a && a.system_prompt) return [{role:"system",content:a.system_prompt},...history];
  }
  const extras = [];
  if (state.tools.web)  extras.push("[web search enabled]");
  if (state.tools.code) extras.push("[code interpreter enabled]");
  if (extras.length && history.length) {
    const last = history[history.length-1];
    if (last.role === "user") last.content = extras.join(" ")+" "+last.content;
  }
  return history;
}

function autosize() {
  const ta = els.input;
  ta.style.height = "auto";
  ta.style.height = Math.min(ta.scrollHeight,160)+"px";

async function appendTurn(userText, assistantText) {
  if (!state.currentId) return;
  const { res, data } = await api("/v1/conversations/"+encodeURIComponent(state.currentId)+"/messages",
    {method:"POST",body:JSON.stringify({messages:[{role:"user",content:userText},{role:"assistant",content:assistantText}],auto_title:true})},{error:false});
  if (res.ok && data && data.conversation) {
    const conv = state.conversations.find(c => c.id === state.currentId);
    if (conv) conv.title = data.conversation.title;
    updateTopTitle(); await refreshConversations();
  }
}

function buildTabs(container, tabs, onChange, defaultTab) {
  const bar = document.createElement("div"); bar.className = "tabs";
  const activeId = defaultTab||tabs[0][0];
  tabs.forEach(([id, label]) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "tab"+(id === activeId?" active":"");
    b.dataset.tab = id; b.textContent = label;
    b.addEventListener("click", () => {
      bar.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      b.classList.add("active");
      onChange(id);
    });
    bar.appendChild(b);
  });
  container.appendChild(bar);
  return activeId;
}

async function loadSearchView() {
  const panel = $("searchPanel");
  panel.innerHTML = '<div class="panel-head"><div><h2>Search</h2><p class="sub">Search across your workspace.</p></div></div>'+
    '<input class="search-bar" id="globalSearchInput" placeholder="Search conversations, files, projects…" value="'+escapeHtml(state.searchQuery)+'"/>'+
    '<div id="searchResults">'+skeletons(4)+"</div>";
  const input = $("globalSearchInput");
  const run = async () => {
    const q = input.value.trim(); state.searchQuery = q;
    const box = $("searchResults");
    if (!q) { box.innerHTML = emptyPanel("Start typing","Search chats, files, projects, assistants, and more.").outerHTML; return; }
    box.innerHTML = skeletons(3);
    const { res, data } = await api("/v1/search?q="+encodeURIComponent(q),{},{error:false});
    if (!res.ok) { box.innerHTML = '<div class="empty-panel"><p>Search failed. Try again.</p></div>'; return; }
    const results = (data && data.results)||{};
    box.innerHTML = "";
    const sections = [
      ["conversations","Chats"],["projects","Projects"],["assistants","Assistants"],
      ["files","Files"],["library","Library"],["prompts","Prompts"],["memories","Memories"],
    ];
    let any = false;
    sections.forEach(([key, label]) => {
      const items = results[key]||[]; if (!items.length) return; any = true;
      const g = document.createElement("div"); g.className = "search-group";
      g.innerHTML = "<h4>"+escapeHtml(label)+"</h4>";
      items.forEach(item => {
        const hit = document.createElement("div"); hit.className = "search-hit";
        hit.innerHTML = '<span class="tag">'+escapeHtml(label.slice(0,-1))+"</span><strong></strong><span></span>";
        hit.querySelector("strong").textContent = item.title||item.name||item.id||"Item";
        hit.querySelector("span").textContent   = item.description||item.content||item.body||fmtDate(item.updated_at||item.created_at);
        hit.addEventListener("click", () => {
          if (key==="conversations"&&item.id) loadConversation(item.id);
          else setView(key==="memories"?"memory":key);
        });
        g.appendChild(hit);
      });
      box.appendChild(g);
    });
    if (!any) box.appendChild(emptyPanel("No results",'Nothing matched "'+q+'".'));
  };
  input.addEventListener("keydown", e => { if (e.key==="Enter") run(); });
  let t; input.addEventListener("input", () => { clearTimeout(t); t = setTimeout(run,300); });
  input.focus();
  if (state.searchQuery) run();
  else $("searchResults").innerHTML = emptyPanel("Start typing","Search chats, files, projects, assistants, and more.").outerHTML;
}

async function loadScheduledList() {
  const box = $("schedList"); if (!box) return;
  box.innerHTML = skeletons(3);
  const { res, data } = await api("/v1/scheduled-tasks",{},{error:false});
  box.innerHTML = "";
  const items = (res.ok && data && (data.tasks||data.scheduled_tasks||data.items))||[];
  if (!items.length) { box.appendChild(emptyPanel("No scheduled tasks","Create recurring automations.")); return; }
  items.forEach(t => {
    const isPaused = t.status === "paused" || t.paused;
    const badgeClass = isPaused?"yellow":t.status==="error"?"red":"green";
    box.appendChild(entityCard(
      t.title||t.name||"Untitled",
      (t.schedule||"")+(t.payload&&t.payload.prompt?" · "+String(t.payload.prompt).slice(0,80):""),
      fmtDate(t.updated_at||t.created_at),
      [
        Object.assign(document.createElement("span"),{
          innerHTML:'<span class="badge '+badgeClass+'">'+escapeHtml(t.status||"active")+"</span>",
        }),
        btnOutline(isPaused?"Resume":"Pause", isPaused?"play":"pause", async () => {
          await api("/v1/tasks/"+encodeURIComponent(t.id),{method:"PATCH",body:JSON.stringify({status:isPaused?"active":"paused"})},{success:isPaused?"Resumed":"Paused"});
          loadScheduledList();
        }),
        btnOutline("Delete","trash", async () => {
          if (!confirm("Delete task?")) return;
          await api("/v1/tasks/"+encodeURIComponent(t.id),{method:"DELETE"},{success:"Task deleted"});
          loadScheduledList();
        }),
      ]
    ));
  });
}

          '<span class="ver-c">'+escapeHtml((v.content||"").slice(0,80))+"…</span>";

    const { res, data } = await api("/v1/tools",{},{error:false});
    box.innerHTML = "";
    const tools = (res.ok && data && (data.tools||data.items))||[];
    const asstTools = new Set(a.tools||[]);
    if (!tools.length) { box.appendChild(emptyPanel("No tools","No tools available in this workspace.")); return; }
    tools.forEach(t => {
      const enabled = asstTools.has(t.id);
      box.appendChild(entityCard(t.name, t.description||"", t.category||"", [
        btnOutline(enabled?"Remove":"Add", enabled?"x":"plus", async () => {
          const next = new Set(asstTools);
          if (enabled) next.delete(t.id); else next.add(t.id);
          await api("/v1/assistants/"+encodeURIComponent(a.id),{method:"PATCH",body:JSON.stringify({tools:[...next]})},{success:enabled?"Tool removed":"Tool added"});
          a.tools = [...next]; loadAssistantTab(a,"tools");

      ]));

  } else if (tab === "settings") {
    box.innerHTML = "";
    const form = document.createElement("form"); form.className = "form-grid";
    form.innerHTML = "<label>Name<input name='name' value='"+escapeHtml(a.name||"")+"' required maxlength='120'/></label>"+
      "<label>Description<textarea name='description' rows='2'>"+escapeHtml(a.description||"")+"</textarea></label>"+
      "<label>Model<input name='model' value='"+escapeHtml(a.model||state.model)+"'/></label>"+
      '<div style="display:flex;gap:8px">'+
      '<button type="submit" class="btn-primary">'+svg("check",14)+" Save</button>"+
      '<button type="button" class="btn-danger" id="asstDeleteBtn2">'+svg("trash",14)+" Delete</button></div>";
    form.addEventListener("submit", async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      await api("/v1/assistants/"+encodeURIComponent(a.id),{method:"PATCH",body:JSON.stringify({name:String(fd.get("name")||"").trim(),description:String(fd.get("description")||"").trim(),model:String(fd.get("model")||"").trim()})},{success:"Assistant updated"});
    });
    box.appendChild(form);
    $("asstDeleteBtn2").addEventListener("click", async () => {
      if (!confirm("Delete assistant permanently?")) return;

      await api("/v1/assistants/"+encodeURIComponent(a.id),{method:"DELETE"},{success:"Deleted"});

    '<button type="button" class="btn-primary" id="filesCreateBtn">'+svg("plus",14)+" Create</button></div></div>"+

    '<div id="filesTabs"></div><div id="filesContent">'+skeletons(3)+"</div>"+
    '<form class="form-grid hidden" id="filesCreateForm">'+
    '<label>File name<input name="name" required maxlength="240" placeholder="notes.txt"/></label>'+
    '<label>Content<textarea name="content" rows="8" maxlength="2000000" placeholder="Paste text content…"></textarea></label>'+

    '<button type="button" class="btn-outline" id="filesCancelBtn">Cancel</button></div></form>';

  $("filesUploadBtn").addEventListener("click", () => $("filesUpload").click());
  $("filesCreateBtn").addEventListener("click", () => {
    $("filesCreateForm").classList.remove("hidden"); $("filesCreateBtn").classList.add("hidden");
  });
  $("filesCancelBtn").addEventListener("click", () => {
    $("filesCreateForm").classList.add("hidden"); $("filesCreateBtn").classList.remove("hidden");
  });
  $("filesUpload").addEventListener("change", async e => {
    const file = e.target.files && e.target.files[0]; e.target.value = "";
    if (!file) return;
    const isText = !file.type||file.type.startsWith("text/")||/\.(txt|md|json|csv)$/i.test(file.name);
    if (isText) {
      const text = await file.text();
      await api("/v1/files",{method:"POST",body:JSON.stringify({name:file.name,content:text,mime:file.type||"text/plain"})},{success:"File uploaded"});
    } else {
      const buf = await file.arrayBuffer();
      const b64 = btoa(String.fromCharCode(...new Uint8Array(buf)));
      await api("/v1/files",{method:"POST",body:JSON.stringify({name:file.name,content_base64:b64,mime:file.type||"application/octet-stream"})},{success:"File uploaded"});
    }
    loadFilesTab(activeFilesTab);
  });
  $("filesCreateForm").addEventListener("submit", async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    await api("/v1/files",{method:"POST",body:JSON.stringify({name:String(fd.get("name")||"").trim(),content:String(fd.get("content")||""),mime:"text/plain"})},{success:"File created"});
    e.target.reset(); $("filesCreateForm").classList.add("hidden"); $("filesCreateBtn").classList.remove("hidden");
    loadFilesTab(activeFilesTab);
  });

  const fileTabs = [["all","All"],["documents","Documents"],["images","Images"],["code","Code"],["recent","Recent"]];
  buildTabs($("filesTabs"), fileTabs, id => { activeFilesTab = id; loadFilesTab(id); }, "all");
  loadFilesTab("all");
}

  if (tabId === "code")      params.push("kind=code");
  if (tabId === "recent")    params.push("sort=recent&limit=20");

  const { res, data } = await api(url,{},{error:false});
  box.innerHTML = "";
  const items = (res.ok && data && data.files)||[];
  if (!items.length) { box.appendChild(emptyPanel("No files","Upload or create files.")); return; }
  items.forEach(f => {
    box.appendChild(entityCard(f.name, f.mime+" · "+(f.size||0)+" bytes", fmtDate(f.updated_at||f.created_at), [

  });

/* ─── SET VIEW ─── */
function setView(view, silent) {
  state.view = view;
  document.body.classList.toggle("chat-mode", view === "chat");
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.view === view));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "view-"+view));
  updateTopTitle();
  renderConvList();
  closeMenus();
  closeSidebar();
  if (VIEW_LOADERS[view]) VIEW_LOADERS[view]();
  if (!silent && view === "chat") renderMessages();
}

/* ─── MIC / SPEECH ─── */
function initMic() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn = $("micBtn");
  if (!SpeechRecognition) {
    micBtn.addEventListener("click", () => toast("Speech recognition not supported in this browser","error"));
    return;
  }
  const recog = new SpeechRecognition();
  recog.continuous = false; recog.interimResults = false; recog.lang = "en-US";
  state.recognition = recog;
  recog.onresult = e => {
    const transcript = e.results[e.results.length-1][0].transcript;
    els.input.value += (els.input.value ? " " : "")+transcript;
    autosize(); els.input.focus();
    micBtn.classList.remove("listening");
  };
  recog.onend  = () => micBtn.classList.remove("listening");
  recog.onerror = () => { micBtn.classList.remove("listening"); toast("Voice input error","error"); };
  micBtn.addEventListener("click", () => {
    if (micBtn.classList.contains("listening")) {
      recog.stop(); micBtn.classList.remove("listening");
    } else {
      try { recog.start(); micBtn.classList.add("listening"); }
      catch (_) { toast("Could not start voice input","error"); }
    }
  });
}

/* ─── INIT ─── */
async function init() {
  buildNav();
  document.body.classList.add("chat-mode");
  const me = await api("/v1/auth/me",{},{error:false});
  if (!me.res.ok) { location.replace("/login"); return; }
  state.user = me.data;
  try {
    const prof = await api("/v1/profile",{},{error:false});
    if (prof.res.ok) state.profile = prof.data;
    const sett = await api("/v1/settings",{},{error:false});
    if (sett.res.ok) state.settings = (sett.data && sett.data.settings)||{};
  } catch (_) {}
  applyUserChrome();
  applyDarkMode();
  await Promise.all([loadWorkspaces(), loadModelsCatalog(), loadNotifications()]);
  try {
    const asst = await api("/v1/assistants",{},{error:false});
    if (asst.res.ok) state.assistants = (asst.data && asst.data.assistants)||[];
    const proj = await api("/v1/projects",{},{error:false});
    if (proj.res.ok) state.projects = (proj.data && proj.data.projects)||[];
  } catch (_) {}
  await refreshConversations();
  const params = new URLSearchParams(location.search);
  const deepLink = params.get("c");
  if (deepLink) await loadConversation(deepLink);
  else {
    const last = (me.data && me.data.last_conversation_id)||(state.profile && state.profile.last_conversation_id);
    if (last && state.conversations.some(c => c.id === last)) await loadConversation(last);
    else renderMessages();
  }
  updateTopTitle();
  initMic();
  // composer model chip
  updateComposerChip();
  $("composerModelChip").addEventListener("click", e => {
    e.stopPropagation();
    els.modelDrop.classList.toggle("open");
  });
  // system dark mode listener
  if (window.matchMedia) {
    window.matchMedia("(prefers-color-scheme:dark)").addEventListener("change", applyDarkMode);
  }
}

// File inputs
$("fileInput").addEventListener("change", async e => {
  const file = e.target.files && e.target.files[0]; e.target.value = "";
  if (!file) return;
  try {
    const text = await file.text();
    const cur = els.input.value;
    els.input.value = cur+(cur && !cur.endsWith("\n") ? "\n\n":"")+text;
    autosize(); toast("File attached to message","success");
  } catch (_) { toast("Could not read file","error"); }
});
$("fileUploadInput").addEventListener("change", async e => {
  const file = e.target.files && e.target.files[0]; e.target.value = "";
  if (!file) return;
  try {
    const isText = !file.type||file.type.startsWith("text/")||/\.(txt|md|json|csv)$/i.test(file.name);
    if (isText) {
      const text = await file.text();
      await api("/v1/files",{method:"POST",body:JSON.stringify({name:file.name,content:text,mime:file.type||"text/plain"})},{success:"File uploaded to OM"});
    } else {
      const buf = await file.arrayBuffer();
      const b64 = btoa(String.fromCharCode(...new Uint8Array(buf)));
      await api("/v1/files",{method:"POST",body:JSON.stringify({name:file.name,content_base64:b64,mime:file.type||"application/octet-stream"})},{success:"File uploaded to OM"});
    }
  } catch (_) { toast("Upload failed","error"); }
});

    state.workspaceId = state.workspaces[idx].id;
    els.wsName.textContent = state.workspaces[idx].name;

document.addEventListener("click", e => {
  closeMenus();
  if (!els.convCtxMenu.contains(e.target)) els.convCtxMenu.classList.remove("open");
});

  if (e.key === "Escape") { closeMenus(); els.convCtxMenu.classList.remove("open"); }

    e.preventDefault();
    if (state.view === "search") { const i = $("globalSearchInput"); if (i) i.focus(); }
    else setView("search");
  }
});
