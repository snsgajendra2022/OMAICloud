/* ─── MIC / SPEECH ─── */
function initMic() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn = $("micBtn");
  if (!SpeechRecognition) {
    micBtn.addEventListener("click", () => toast("Speech recognition not supported in this browser","error"));
    return;
  }
  const recog = new SpeechRecognition();
  recog.continuous = false; recog.interimResults = false; recog.lang = "en-US";
  state.recognition = recog;
  recog.onresult = e => {
    const transcript = e.results[e.results.length-1][0].transcript;
    els.input.value += (els.input.value ? " " : "")+transcript;
    autosize(); els.input.focus();
    micBtn.classList.remove("listening");
  };
  recog.onend  = () => micBtn.classList.remove("listening");
  recog.onerror = () => { micBtn.classList.remove("listening"); toast("Voice input error","error"); };
  micBtn.addEventListener("click", () => {
    if (micBtn.classList.contains("listening")) {
      recog.stop(); micBtn.classList.remove("listening");
    } else {
      try { recog.start(); micBtn.classList.add("listening"); }
      catch (_) { toast("Could not start voice input","error"); }
    }
  });
}

/* ─── LIVE RUNTIME STATUS ─── */
async function refreshRuntimeStatus() {
  const strip = $("omStatusStrip");
  if (!strip) return;
  const pills = strip.querySelectorAll(".om-pill");
  if (!pills.length) return;
  try {
    const {res,data} = await api("/health",{},{error:false});
    const healthy = !!(res.ok && data && data.ok);
    const modelReady = healthy && !!data.model;
    const dot = pills[0].querySelector(".dot");
    if (dot) {
      dot.classList.toggle("online", modelReady);
      dot.classList.toggle("offline", !modelReady);
    }
    pills[0].lastChild.textContent = modelReady ? "Model ready" : (healthy ? "API online · model standby" : "Runtime unavailable");
    if (pills[2]) pills[2].textContent = data && data.memory ? "Memory active" : "Memory unavailable";
    if (pills[3]) pills[3].textContent = data && data.agents ? "Agents ready" : "Agents unavailable";
    strip.title = "Runtime: "+(data && data.status || "unavailable")+" · Model loaded: "+(modelReady ? "yes" : "no");
  } catch (_) {
    pills[0].textContent = "Runtime unavailable";
    strip.title = "Could not verify runtime readiness";
  }
}

/* ─── INIT ─── */
async function init() {
  buildNav();
  document.body.classList.add("chat-mode");
  const me = await api("/v1/auth/me",{},{error:false});
  if (!me.res.ok) { location.replace("/login"); return; }
  state.user = me.data;
  refreshRuntimeStatus();
  try {
    const prof = await api("/v1/profile",{},{error:false});
    if (prof.res.ok) state.profile = prof.data;
    const sett = await api("/v1/settings",{},{error:false});
    if (sett.res.ok) state.settings = (sett.data && sett.data.settings)||{};
  } catch (_) {}
  applyUserChrome();
  applyDarkMode();
  await Promise.all([loadWorkspaces(), loadModelsCatalog(), loadNotifications(), loadOmRuntimeStatus()]);
  try {
    const boot = await api("/v1/workspace/bootstrap",{method:"POST",body:"{}"},{error:false});
    if (boot.res.ok && boot.data && boot.data.created) {
      state.bootstrap = boot.data;
    }
  } catch (_) {}
  try {
    const asst = await api("/v1/assistants",{},{error:false});
    if (asst.res.ok) state.assistants = (asst.data && asst.data.assistants)||[];
    const proj = await api("/v1/projects",{},{error:false});
    if (proj.res.ok) state.projects = (proj.data && proj.data.projects)||[];
    const tools = await api("/v1/tools",{},{error:false});
    if (tools.res.ok) syncComposerToolsFromCatalog((tools.data && tools.data.tools)||[]);
  } catch (_) {}
  await refreshConversations();
  const routed = await restoreProjectRoute();
  if (!routed) {
    const params = new URLSearchParams(location.search);
    const deepLink = params.get("c");
    if (deepLink) await loadConversation(deepLink);
    else {
      const last = (me.data && me.data.last_conversation_id)||(state.profile && state.profile.last_conversation_id);
      const welcomeId = state.bootstrap && state.bootstrap.created && state.bootstrap.created.conversation_id;
      if (last && state.conversations.some(c => c.id === last)) await loadConversation(last);
      else if (welcomeId && state.conversations.some(c => c.id === welcomeId)) await loadConversation(welcomeId);
      else if (state.conversations.length) await loadConversation(state.conversations[0].id);
      else renderMessages();
    }
  }
  window.addEventListener("hashchange", () => { restoreProjectRoute().catch(() => {}); });
  updateTopTitle();
  initMic();
  // composer model chip
  updateComposerChip();
  $("composerModelChip").addEventListener("click", toggleModelDrop);
  // system dark mode listener
  if (window.matchMedia) {
    window.matchMedia("(prefers-color-scheme:dark)").addEventListener("change", applyDarkMode);
  }
}

function showMmStatus(steps) {

async function ingestMmFile(file) {
  if (!file) return;
  const isImage = (file.type||"").startsWith("image/");
  const entry = { name: file.name, mime: file.type||"", preview: null, path: null };
  if (isImage) {
    entry.preview = URL.createObjectURL(file);
  }
  state.mmFiles.push(entry);
  renderMmPreview();
  showMmStatus([
    {label:"Image received ✅", done:true},
    {label:"Uploading…", done:false},
    {label:"OCR / vision pending", done:false},
  ]);
  try {
    let body;
    if (!file.type || file.type.startsWith("text/") || /\.(txt|md|json|csv)$/i.test(file.name)) {
      const text = await file.text();
      body = {name:file.name, content:text, mime:file.type||"text/plain"};
    } else {
      const buf = await file.arrayBuffer();
      let binary = "";
      const bytes = new Uint8Array(buf);
      const chunk = 0x8000;
      for (let i=0;i<bytes.length;i+=chunk) binary += String.fromCharCode.apply(null, bytes.subarray(i,i+chunk));
      const b64 = btoa(binary);
      body = {name:file.name, content_base64:b64, mime:file.type||"application/octet-stream"};
    }
    const up = await api("/v1/files",{method:"POST",body:JSON.stringify(body)},{error:false});
    if (up.res && up.res.ok) {
      entry.path = (up.data && (up.data.path || up.data.id)) || file.name;
      showMmStatus([
        {label:"Image received ✅", done:true},
        {label:"Upload complete ✅", done:true},
        {label:"Running multimodal analyze…", done:false},
      ]);
      const analyzed = await api("/v1/multimodal/analyze",{
        method:"POST",
        body:JSON.stringify({text: els.input.value || "What is in this image?", image_paths: entry.path ? [entry.path] : []})
      },{error:false});
      if (analyzed.res && analyzed.res.ok) {
        const stages = (analyzed.data && analyzed.data.stages) || [];
        showMmStatus([
          {label:"Image received ✅", done:true},
          {label:"✓ OCR / parse complete", done:true},
          {label:"✓ Context found", done:!!(analyzed.data && analyzed.data.summary)},
          {label:"Ready — send a message to ask about this file", done:true},
        ].concat(stages.slice(0,4).map(s => ({label:String(s), done:true}))));
        if (analyzed.data && analyzed.data.summary && !els.input.value.trim()) {
          // keep user control; do not auto-send
        }
      }
      toast("File ready for multimodal chat","success");
    } else {
      showMmStatus([{label:"Upload failed", done:false}]);
    }
  } catch (_) {
    showMmStatus([{label:"Upload / analyze failed", done:false}]);
    toast("Upload failed","error");
  }
}

// File inputs
$("fileInput").addEventListener("change", async e => {
  const file = e.target.files && e.target.files[0]; e.target.value = "";
  if (!file) return;
  if ((file.type||"").startsWith("image/")) { await ingestMmFile(file); return; }
  try {
    const text = await file.text();
    const cur = els.input.value;
    els.input.value = cur+(cur && !cur.endsWith("\n") ? "\n\n":"")+text;
    autosize(); toast("File attached to message","success");
  } catch (_) { toast("Could not read file","error"); }
});
$("fileUploadInput").addEventListener("change", async e => {
  const files = e.target.files ? Array.from(e.target.files) : []; e.target.value = "";
  for (const file of files) await ingestMmFile(file);
});

// Drag & drop images onto composer
const composerEl = $("composer");
if (composerEl) {
  ["dragenter","dragover"].forEach(ev => composerEl.addEventListener(ev, e => { e.preventDefault(); composerEl.classList.add("dragover"); }));
  ["dragleave","drop"].forEach(ev => composerEl.addEventListener(ev, e => { e.preventDefault(); composerEl.classList.remove("dragover"); }));
  composerEl.addEventListener("drop", async e => {
    const files = e.dataTransfer && e.dataTransfer.files ? Array.from(e.dataTransfer.files) : [];
    for (const f of files) await ingestMmFile(f);
  });
}

// Tool toggles (sync with Tools catalog)
["toolWeb","toolCode"].forEach(id => {
  $(id).addEventListener("click", async () => {
    const key = id === "toolWeb" ? "web":"code";
    const toolId = key === "web" ? "web_search" : "code_interpreter";
    const next = !state.tools[key];
    state.tools[key] = next;
    $(id).classList.toggle("on", next);
    try {
      await patchTool(toolId, {install:true, enabled:next}, (key==="web"?"Web":"Code")+" "+(next?"enabled":"disabled"));
    } catch (_) {
      state.tools[key] = !next;
      $(id).classList.toggle("on", !next);
    }
  });
});

// Share
$("shareBtn").addEventListener("click", () => shareConvViaAPI(null));

// Notifications
$("notifBtn").addEventListener("click", e => {
  e.stopPropagation();
  els.notifDrop.classList.toggle("open");
  els.modelDrop.classList.remove("open");
  if (els.modelBtn) els.modelBtn.setAttribute("aria-expanded", "false");
  $("headerMenu").classList.remove("open");
});

// Help
$("helpBtn").addEventListener("click", () => toast("See README.md in the repo for OM AI docs","success"));

// Header profile
$("headerProfileBtn").addEventListener("click", e => {
  e.stopPropagation();
  $("headerMenu").classList.toggle("open");
  els.notifDrop.classList.remove("open");
  els.modelDrop.classList.remove("open");
  if (els.modelBtn) els.modelBtn.setAttribute("aria-expanded", "false");
});

// Model btn
function toggleModelDrop(e) {
  if (e) e.stopPropagation();
  const open = !els.modelDrop.classList.contains("open");
  els.notifDrop.classList.remove("open");
  $("headerMenu").classList.remove("open");
  $("attachDrop").classList.remove("open");
  $("sideMenu").classList.remove("open");
  els.modelDrop.classList.toggle("open", open);
  if (els.modelBtn) els.modelBtn.setAttribute("aria-expanded", open ? "true" : "false");
}
els.modelBtn.addEventListener("click", toggleModelDrop);

// Side menu
$("sideMenuBtn").addEventListener("click", e => { e.stopPropagation(); $("sideMenu").classList.toggle("open"); });

// Search top button
$("searchTopBtn").addEventListener("click", () => setView("search"));

// Workspace actions
$("wsCreateBtn").addEventListener("click", async () => {
  const name = prompt("Workspace name","New workspace");
  if (!name||!name.trim()) return;
  await api("/v1/workspaces",{method:"POST",body:JSON.stringify({name:name.trim()})},{success:"Workspace created"});
  loadWorkspaces();
});
$("wsSwitchBtn").addEventListener("click", async () => {
  await loadWorkspaces();
  if (state.workspaces.length <= 1) { toast("Only one workspace — create another to switch","error"); return; }
  const names = state.workspaces.map((w,i) => (i+1)+". "+w.name).join("\n");
  const pick = prompt("Select workspace:\n"+names,"1");
  const idx = parseInt(pick,10)-1;
  if (!Number.isNaN(idx) && state.workspaces[idx]) {
    state.workspaceId = state.workspaces[idx].id;
    els.wsName.textContent = "OM";
    if ($("wsSub")) $("wsSub").textContent = state.workspaces[idx].name;
    toast("Switched to "+state.workspaces[idx].name,"success");
  }
});

// Conv filter buttons
document.querySelectorAll(".conv-filter-btn").forEach(btn => {
  btn.addEventListener("click", e => {
    e.stopPropagation();
    setConvFilter(btn.dataset.filter || "all");
  });
});

// Global close / keyboard
document.addEventListener("click", e => {
  const keepOpen = e.target.closest("#modelWrap,#modelDrop,#notifBtn,#notifDrop,#headerProfileBtn,#headerMenu,#sideMenuBtn,#sideMenu,#attachBtn,#attachDrop,#composerModelChip");
  if (!keepOpen) closeMenus();
  if (!els.convCtxMenu.contains(e.target)) els.convCtxMenu.classList.remove("open");
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeMenus(); els.convCtxMenu.classList.remove("open"); }
  if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    if (state.view === "search") { const i = $("globalSearchInput"); if (i) i.focus(); }
    else setView("search");
  }
});

els.modalCancel.addEventListener("click", () => els.modal.classList.remove("open"));
els.modalOk.addEventListener("click", () => els.modal.classList.remove("open"));

init().catch(() => location.replace("/login"));
})();
</script>
</body>
</html>
