/* ─── CONVERSATION ACTIONS ─── */
async function renameConv(c) {
  const next = prompt("Rename chat", c.title||"New chat");
  if (next == null) return;
  const title = next.trim(); if (!title) return;
  const { res } = await api("/v1/conversations/"+encodeURIComponent(c.id),
    {method:"PATCH",body:JSON.stringify({title})},{success:"Chat renamed"});
  if (!res.ok) return;
  if (state.currentId === c.id) updateTopTitle();
  await refreshConversations();
}

async function pinConv(c, pinned) {
  const { res } = await api("/v1/conversations/"+encodeURIComponent(c.id),
    {method:"PATCH",body:JSON.stringify({pinned})},{success: pinned?"Pinned":"Unpinned"});
  if (!res.ok) return;
  if (!state.sideSections) state.sideSections = {pinned:true, projects:true, chats:true};
  if (pinned) state.sideSections.pinned = true;
  await refreshConversations();
}

async function archiveConv(c, archived) {
  const { res } = await api("/v1/conversations/"+encodeURIComponent(c.id),
    {method:"PATCH",body:JSON.stringify({archived})},{success: archived?"Archived":"Restored"});
  if (!res.ok) return;
  if (archived && state.currentId === c.id) {
    state.currentId = null; state.messages = [];
    updateTopTitle(); renderMessages();
  }
  await refreshConversations();
}

async function moveToProject(c) {
  const { res, data } = await api("/v1/projects",{},{error:false});
  const projects = (res.ok && data && data.projects)||[];
  if (!projects.length) { toast("No projects yet — create one first","error"); setView("projects"); return; }
  const names = projects.map((p,i) => (i+1)+". "+p.name).join("\n");
  const pick = prompt("Move to project:\n"+names,"1");
  const idx = parseInt(pick,10)-1;
  if (Number.isNaN(idx)||!projects[idx]) return;
  await api("/v1/conversations/"+encodeURIComponent(c.id),
    {method:"PATCH",body:JSON.stringify({project_id:projects[idx].id})},{success:"Moved to "+projects[idx].name});
  state.expandedProjects[projects[idx].id] = true;
  await refreshConversations();
}

async function shareConvViaAPI(c) {
  const id = c ? c.id : state.currentId;
  if (!id) { toast("No active conversation","error"); return; }
  try {
    const { res, data } = await api("/v1/conversations/"+encodeURIComponent(id)+"/share",{method:"POST",body:"{}"},{error:false});
    if (res.ok && data && data.share_url) {
      await navigator.clipboard.writeText(data.share_url);
      toast("Share link copied to clipboard","success");
    } else {
      // fallback: copy current URL
      const url = location.origin+location.pathname+"?c="+encodeURIComponent(id);
      await navigator.clipboard.writeText(url);
      toast("Conversation link copied","success");
    }
  } catch (err) {
    toast("Share failed","error");
  }
}

async function exportConv(c) {
  const id = c ? c.id : state.currentId;
  if (!id) return;
  try {
    const { res, data } = await api("/v1/conversations/"+encodeURIComponent(id)+"/export",{},{error:false});
    if (res.ok && data) {
      const content = typeof data === "string" ? data : (data.content || data.markdown || JSON.stringify(data, null, 2));
      const blob = new Blob([content],{type:"text/markdown"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "conversation-"+id+".md";
      a.click(); URL.revokeObjectURL(a.href);
      toast("Export downloaded","success");
    } else {
      // Export from local messages
      const conv = state.conversations.find(x => x.id === id);
      const lines = [(conv && conv.title ? "# "+conv.title : "# Conversation"),""];
      state.messages.forEach(m => {
        if (m.role === "user") lines.push("**You:** "+m.content,"");
        else if (m.role === "assistant") lines.push("**OM:** "+m.content,"");
      });
      const blob = new Blob([lines.join("\n")],{type:"text/markdown"});
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
      a.download = "conversation-"+id+".md"; a.click(); URL.revokeObjectURL(a.href);
      toast("Exported from local data","success");
    }
  } catch (_) { toast("Export failed","error"); }
}

async function deleteConv(c) {
  if (!confirm('Delete "'+escapeHtml(c.title||"chat")+'"?')) return;
  const { res } = await api("/v1/conversations/"+encodeURIComponent(c.id),{method:"DELETE"},{success:"Chat deleted"});
  if (!res.ok) return;
  if (state.currentId === c.id) {
    state.currentId = null; state.messages = [];
    updateTopTitle(); renderMessages();
  }
  await refreshConversations();
}

/* ─── MESSAGES ─── */
function typingIndicatorHtml() {
  return '<div class="typing-dots" aria-label="OM is typing" role="status"><span></span><span></span><span></span></div>';
}

function omAvatarHtml() {
  return '<div class="om-avatar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"></path><circle cx="12" cy="12" r="3"></circle></svg></div>';
}

function renderMessages() {
  els.messages.innerHTML = "";
  if (!state.messages.length) {
    const wrap = document.createElement("div");
    wrap.className = "empty-state";
    wrap.innerHTML = "<h1>What can I help with?</h1><p>Start a conversation or try a suggestion.</p>";
    const grid = document.createElement("div");
    grid.className = "suggest-grid";
    SUGGESTIONS.forEach(s => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "suggest-card";
      b.innerHTML = "<strong>"+escapeHtml(s.cat)+"</strong><span>"+escapeHtml(s.text)+"</span>";
      b.addEventListener("click", () => { els.input.value = s.prompt; autosize(); els.input.focus(); });
      grid.appendChild(b);
    });
    wrap.appendChild(grid);
    els.messages.appendChild(wrap);
    return;
  }
  state.messages.forEach((m, idx) => {
    if (m.role !== "user" && m.role !== "assistant") return;
    const row = document.createElement("div");
    row.className = "row "+m.role;
    if (m.role === "assistant") {
      const av = document.createElement("div");
      av.innerHTML = omAvatarHtml();
      row.appendChild(av.firstChild);
    }
    const col = document.createElement("div");
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    const waiting = !!(m._streaming && !String(m.content||"").trim());
    if (m._streaming) bubble.dataset.stream = "1";
    if (waiting) bubble.classList.add("is-typing");
    if (waiting) bubble.innerHTML = typingIndicatorHtml();
    else if (m.role === "assistant") bubble.innerHTML = renderExperienceMarkdown(stripPipelineDump(m.content||""), !!m._reveal);
    else bubble.innerHTML = escapeHtml(m.content||"").replace(/\n/g,"<br>");
    col.appendChild(bubble);
    if (m.role === "assistant" && !m._streaming) {
      if (m._reveal) delete m._reveal;
      col.appendChild(buildMsgActions(m, idx));
    }
    if (m.role === "user" && !m._streaming) {
      col.appendChild(buildUserActions(m, idx));
    }
    row.appendChild(col);
    els.messages.appendChild(row);
  });
  els.messages.scrollTop = els.messages.scrollHeight;
}

function updateStreamBubble(text) {
  const bubble = els.messages.querySelector('.bubble[data-stream="1"]');
  if (!bubble) { renderMessages(); return; }
  const body = String(text||"");
  if (!body.trim()) {
    bubble.classList.add("is-typing");
    bubble.setAttribute("aria-busy", "true");
    bubble.innerHTML = typingIndicatorHtml();
  } else {
    bubble.classList.remove("is-typing");
    bubble.removeAttribute("aria-busy");
    bubble.innerHTML = renderMarkdown(stripPipelineDump(body));
  }
  els.messages.scrollTop = els.messages.scrollHeight;
}

function buildMsgActions(m, idx) {
  const actions = document.createElement("div");
  actions.className = "msg-actions";
  const mk = (title, iconName, fn, cls) => {
    const b = document.createElement("button");
    b.type = "button";
    if (cls) b.className = cls;
    b.title = title;
    b.setAttribute("aria-label", title);
    b.innerHTML = iconName ? svg(iconName,16) : "";
    b.addEventListener("click", fn);
    return b;
  };
  // Read aloud
  const ttsBtn = mk("Read aloud", "volume", () => {
    if (state.ttsActive) { speechSynthesis.cancel(); state.ttsActive = false; ttsBtn.classList.remove("speaking"); return; }
    const utt = new SpeechSynthesisUtterance(m.content||"");
    utt.onend = () => { state.ttsActive = false; ttsBtn.classList.remove("speaking"); };
    utt.onerror = () => { state.ttsActive = false; ttsBtn.classList.remove("speaking"); };
    speechSynthesis.speak(utt);
    state.ttsActive = true; ttsBtn.classList.add("speaking");
  }, "tts-btn");
  actions.append(
    mk("Copy response","copy", async () => {
      try { await navigator.clipboard.writeText(m.content||""); toast("Copied","success"); }
      catch (_) { toast("Copy failed","error"); }
    }),
    mk("Good response","thumbUp",   () => sendFeedback(idx, 5)),
    mk("Bad response","thumbDown", () => sendFeedback(idx, 1)),
    ttsBtn,
    mk("Regenerate response","refresh", () => regenerate(idx)),
    mk("Share","share", () => shareMessage(m.content)),
    mk("More","more", e => { e.stopPropagation(); showMsgMore(e, m, idx); })
  );
  return actions;
}

function buildUserActions(m, idx) {
  const actions = document.createElement("div");
  actions.className = "msg-actions";
  const copyBtn = document.createElement("button");
  copyBtn.type = "button";
  copyBtn.title = "Copy";
  copyBtn.setAttribute("aria-label", "Copy");
  copyBtn.innerHTML = svg("copy",16);
  copyBtn.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(m.content||""); toast("Copied","success"); }
    catch (_) { toast("Copy failed","error"); }
  });
  const b = document.createElement("button");
  b.type = "button";
  b.title = "Edit";
  b.setAttribute("aria-label", "Edit");
  b.innerHTML = svg("edit",16);
  b.addEventListener("click", () => {
    els.input.value = m.content||"";
    autosize();
    els.input.focus();
    state._editFrom = idx;
    toast("Edit the message, then send to replace this turn","success");
  });
  actions.append(copyBtn, b);
  return actions;
}

function editUserFromAssistant(assistantIdx) {
  let userIdx = -1;
  for (let i = assistantIdx-1; i >= 0; i--) {
    if (state.messages[i].role === "user") { userIdx = i; break; }
  }
  if (userIdx < 0) return;
  els.input.value = state.messages[userIdx].content||"";
  autosize();
  els.input.focus();
  state._editFrom = userIdx;
}

function showMsgMore(e, m, idx) {
  closeMenus();
  const menu = document.createElement("div");
  menu.className = "drop-menu open msg-more-menu";
  Object.assign(menu.style, {
    position:"fixed",
    left:Math.min((e.clientX||0), window.innerWidth-260)+"px",
    top:Math.min((e.clientY||0), window.innerHeight-320)+"px",
    zIndex:"250",
  });
  const items = [
    { label: "Edit prompt", icon: "edit", onClick: () => editUserFromAssistant(idx) },
    { label: "Regenerate", icon: "refresh", onClick: () => regenerate(idx) },
    { label: "Share", icon: "share", onClick: () => shareMessage(m.content) },
    { label: "Copy", icon: "copy", onClick: async () => {
      try { await navigator.clipboard.writeText(m.content||""); toast("Copied","success"); }
      catch (_) { toast("Copy failed","error"); }
    }},
    { label: "Save to library", icon: "book", onClick: () => saveToLibrary(m.content) },
    { label: "Add to project", icon: "folder", onClick: () => addToProject(m.content) },
    { label: "Export", icon: "download", onClick: () => exportMessage(m.content) },
    { label: "Report", icon: "shield", onClick: () => toast("Report submitted — thank you","success") },
  ];
  items.forEach(it => {
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = (it.icon && typeof svg === "function" ? svg(it.icon,14) : "") + escapeHtml(it.label);
    b.addEventListener("click", ev => {
      ev.stopPropagation();
      menu.remove();
      it.onClick();
    });
    menu.appendChild(b);
  });
  document.body.appendChild(menu);
  const close = ev => {
    if (!menu.contains(ev.target)) {
      menu.remove();
      document.removeEventListener("click", close);
    }
  };
  setTimeout(() => document.addEventListener("click", close), 0);
}

async function sendFeedback(assistantIdx, rating) {
  if (!state.currentId) { toast("No active conversation","error"); return; }
  const { res } = await api("/v1/conversations/"+encodeURIComponent(state.currentId)+"/feedback",
    {method:"POST",body:JSON.stringify({rating,comment:rating>=4?"thumbs_up":"thumbs_down"})},{error:false});
  const answer = state.messages[assistantIdx] && String(state.messages[assistantIdx].content||"");
  let question = "";
  for (let i = assistantIdx-1; i >= 0; i--) {
    if (state.messages[i] && state.messages[i].role === "user") { question = String(state.messages[i].content||""); break; }
  }
  // A feedback event is saved for learning analysis, but explicit training consent
  // stays false unless a future UI asks the user to opt in.
  if (res.ok && question && answer) {
    await api("/api/ml/feedback", {
      method:"POST",
      body:JSON.stringify({
        question, answer, rating:rating>=4 ? 1 : -1,
        reason:rating>=4 ? "chat_thumbs_up" : "chat_thumbs_down",
        conversation_id:state.currentId,
        consent_to_training:rating>=4 && hasLearningConsent()
      })
    }, {error:false});
  }
  toast(res.ok ? "Feedback saved":"Feedback unavailable", res.ok?"success":"error");
}

async function regenerate(assistantIdx) {
  if (state.busy) return;
  let userIdx = -1;
  for (let i = assistantIdx-1; i >= 0; i--) {
    if (state.messages[i].role === "user") { userIdx = i; break; }
  }
  if (userIdx < 0) return;
  const prompt = state.messages[userIdx].content;
  state.messages = state.messages.slice(0,assistantIdx);
  if (state.messages.length && state.messages[state.messages.length-1].role === "user") state.messages.pop();
  renderMessages();
  await sendPrompt(prompt);
}

/* ─── STREAMING ─── */
async function streamCompletion(messages) {
  const controller = new AbortController();
  state.abort = controller;
  const maxTok = Math.max(64, Math.min(2048, Number((state.settings&&state.settings.max_tokens)||256)||256));
  const temp = state.settings ? Number(state.settings.temperature??0.55) : 0.55;
  const modelId = activeChatModel();
  const res = await fetch("/api/v1/chat/completions", {
    method:"POST", credentials:"include", signal:controller.signal,
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      model:modelId, messages,
      max_tokens:maxTok, temperature:temp, stream:true,
      project_id:state.activeProjectId||undefined,
      conversation_id:state.currentId||undefined,
      tools:{
        web:!!(state.tools&&state.tools.web),
        code:!!(state.tools&&state.tools.code),
      },
    }),
  });
  if (res.status === 401) { location.replace("/login"); throw new Error("unauthorized"); }
  if (!res.ok) {
    let detail = "HTTP "+res.status;
    try { const err = await res.json(); detail = err.detail||err.error||detail; if (typeof detail !== "string") detail = JSON.stringify(detail); } catch (_) {}
    throw new Error(detail);
  }
  const reader = res.body.getReader(), decoder = new TextDecoder();
  let buffer = "", full = "", usedBackend = "", streamError = "";
  if (state._rxPhaseTimer) { clearInterval(state._rxPhaseTimer); state._rxPhaseTimer = null; }
  state._rxPhase = "";
  try {
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value,{stream:true});
    const parts = buffer.split("\n"); buffer = parts.pop()||"";
    for (const line of parts) {
      const trimmed = line.trim();
      if (!trimmed.startsWith("data:")) continue;
      const payload = trimmed.slice(5).trim();
      if (payload === "[DONE]") continue;
      try {
        const json = JSON.parse(payload);
        if (json.error) {
          const msg = (json.error && (json.error.message || json.error)) || "Chat failed";
          streamError = typeof msg === "string" ? msg : JSON.stringify(msg);
          continue;
        }
        if (json.om_backend) usedBackend = String(json.om_backend);
        if (json.om_provider) state._lastProvider = String(json.om_provider);
        const delta = json.choices && json.choices[0] && json.choices[0].delta;
        if (delta && typeof delta.content === "string") {
          full += delta.content;
          const last = state.messages[state.messages.length-1];
          if (last && last.role === "assistant") last.content = full;
          updateStreamBubble(full);
        }
        if (json.model && isExternalModelId(json.model)) {
          state._lastStreamModel = String(json.model);
        }
      } catch (_) {}
    }
  }
  } finally {
    if (state._rxPhaseTimer) { clearInterval(state._rxPhaseTimer); state._rxPhaseTimer = null; }
  }
  if (streamError) throw new Error(streamError);
  state._lastBackend = usedBackend || "";
  if (!String(full || "").trim()) {
    throw new Error(
      isExternalModelId(modelId)
        ? ("No reply from "+modelId+". Check API key in Settings → AI, then click Use.")
        : ("No reply from "+modelId+". Try again or switch model.")
    );
  }
  return full;
}

async function sendPrompt(text) {
  const prompt = String(text||"").trim();
  if (!prompt || state.busy) return;
  els.input.value = ""; autosize();
  setView("chat", true);
  if (!state.currentId) {
    try { await createChat("New chat"); } catch (e) { return; }
  }
  applyOptimisticTitle(prompt);
  if (typeof state._editFrom === "number" && state._editFrom >= 0) {
    state.messages = state.messages.slice(0, state._editFrom);
    state._editFrom = -1;
  }
  state.messages.push({role:"user",content:prompt});
  state.messages.push({role:"assistant",content:"",_streaming:true});
  renderMessages(); setBusy(true); armTypingTimeout();
  const reqMsgs = buildRequestMessages();
  try {
    const reply = await streamCompletion(reqMsgs);
    const clean = String(reply||"").trim();
    if (!clean) throw new Error("Empty model reply");
    const last = state.messages[state.messages.length-1];
    if (last && last.role === "assistant") {
      last.content = clean;
      last._reveal = true;
      delete last._streaming;
    }
    clearTypingAnimation();
    renderMessages();
    try { await appendTurn(prompt, clean); } catch (_) { toast("Reply ok, save failed","error"); }
  } catch (e) {
    if (e.name === "AbortError") {
      const last = state.messages[state.messages.length-1];
      if (last && last.role === "assistant") { last.content = (last.content||"").trim()||"(stopped)"; delete last._streaming; }
      clearTypingAnimation();
      renderMessages();
      const final = state.messages[state.messages.length-1];
      if (final && final.role === "assistant" && final.content && final.content !== "(stopped)") {
        try { await appendTurn(prompt, final.content); } catch (_) {}
      }
    } else {
      if (state.messages.length && state.messages[state.messages.length-1].role === "assistant") state.messages.pop();
      if (state.messages.length && state.messages[state.messages.length-1].role === "user") state.messages.pop();
      clearTypingAnimation();
      renderMessages();
      if (e.message !== "unauthorized") toast(e.message||"Request failed","error");
    }
  } finally { state.abort = null; setBusy(false); clearTypingAnimation(); }
}

function stopStream() { if (state.abort) state.abort.abort(); }

function buildRequestMessages() {
  const history = state.messages
    .filter(m => (m.role==="user"||m.role==="assistant") && !m._streaming)
    .map(m => ({role:m.role,content:m.content}));
  if (state.selectedAssistantId) {
    const a = state.assistants.find(x => x.id === state.selectedAssistantId);
    if (a && a.system_prompt) return [{role:"system",content:a.system_prompt},...history];
  }
  // Do not rewrite user text with "[web search enabled]" tags — that breaks
  // tiny OM-1.0 chat-SFT greets. Tool mode is tracked client-side only.
  return history;
}

function autosize() {
  const ta = els.input;
  ta.style.height = "auto";
  const h = Math.min(ta.scrollHeight, 160);
  ta.style.height = h + "px";
  els.sendBtn.disabled = state.busy || !ta.value.trim();
  els.composer.classList.toggle("composer-tall", h > 40);
}

/* ─── CONVERSATION API ─── */
async function refreshProjects() {
  const { res, data } = await api("/v1/projects",{},{error:false});
  if (res.ok) state.projects = (data && data.projects)||[];
}

function setConvFilter(filter, { refresh = true } = {}) {
  const next = filter === "pinned" || filter === "archived" ? filter : "all";
  state.convFilter = next;
  if (refresh) return refreshConversations();
}

async function refreshConversations() {
  // Sidebar accordion needs the full non-archived list (pinned + projects + chats).
  // Archived items are still reachable via explicit archived filter if set.
  const qs = new URLSearchParams();
  if (state.convFilter === "archived") qs.set("archived_only", "true");
  const suffix = qs.toString() ? ("?" + qs.toString()) : "";
  const [{ res, data }] = await Promise.all([
    api("/v1/conversations"+suffix,{},{error:false}),
    refreshProjects(),
  ]);
  if (!res.ok) return;
  state.conversations = ((data && data.conversations)||[]).map(c => ({
    ...c,
    pinned: !!(c.pinned === true || c.pinned === 1 || c.pinned === "1"),
    archived: !!(c.archived === true || c.archived === 1 || c.archived === "1"),
  }));
  renderConvList();
}

async function createChat(title, projectId) {
  const pid = projectId || state.activeProjectId || null;
  const body = {title:title||"New chat"};
  if (pid) body.project_id = pid;
  const { res, data } = await api("/v1/conversations",{method:"POST",body:JSON.stringify(body)},{success:"New chat created"});
  if (!res.ok) throw new Error((data && data.detail)||"Create failed");
  state.currentId = data.id; state.messages = [];
  if (pid) state.activeProjectId = pid;
  updateTopTitle(); await refreshConversations();
  await persistLast(data.id); renderMessages();
  if (pid) setProjectHash(pid, data.id);
  return data;
}

async function loadConversation(id, opts) {
  opts = opts || {};
  const { res, data } = await api("/v1/conversations/"+encodeURIComponent(id),{},{error:false});
  if (!res.ok) { toast("Could not load chat","error"); return; }
  state.currentId = data.id;
  state.messages = (data.messages||[]).map(m => ({role:m.role,content:m.content}));
  if (data.project_id) state.activeProjectId = data.project_id;
  else if (!opts.keepProject) state.activeProjectId = null;
  if (data.project_id) state.expandedProjects[data.project_id] = true;
  if (data.project_id && data.model) { /* noop */ }
  if (data.project_id) {
    const proj = state.projects.find(p => p.id === data.project_id);
    // Do not overwrite an active external LLM (DeepSeek/GPT/…) with a project OM level.
    const settingsDefault = (state.settings && state.settings.default_model) || "";
    if (proj && proj.model && !(isExternalModelId(state.model) || isExternalModelId(settingsDefault))) {
      state.model = normalizeModelId(proj.model);
    }
  }
  updateTopTitle(); setView("chat",true);
  renderConvList(); renderMessages();
  await persistLast(id);
  if (data.project_id) setProjectHash(data.project_id, id);
}

async function appendTurn(userText, assistantText) {
  if (!state.currentId) return;
  const { res, data } = await api("/v1/conversations/"+encodeURIComponent(state.currentId)+"/messages",
    {method:"POST",body:JSON.stringify({messages:[{role:"user",content:userText},{role:"assistant",content:assistantText}],auto_title:true})},{error:false});
  if (res.ok && data && data.conversation) {
    const conv = state.conversations.find(c => c.id === state.currentId);
    if (conv) conv.title = data.conversation.title;
    updateTopTitle(); await refreshConversations();
  }
}

/* ─── MODELS ─── */
function renderModels() {
  els.modelDrop.innerHTML = "";
  // Top picker: Levels 1–5 first, then any enabled external models.
  const evo = evolutionModelList();
  const extras = (state.catalog || []).filter(m => {
    const id = String((m && m.id) || "");
    return id && !/^OM-L[1-5]$/i.test(id) && !/^(OM-1\.0|om-1\.0)$/i.test(id);
  });
  const list = evo.concat(extras);
  state.model = isExternalModelId(state.model) ? String(state.model).toLowerCase() : normalizeModelId(state.model);
  list.forEach(m => {
    const id = m.id||m;
    const idNorm = isExternalModelId(id) ? String(id).toLowerCase() : normalizeModelId(id);
    const b = document.createElement("button"); b.type = "button";
    b.className = idNorm === state.model || String(id).toLowerCase() === String(state.model).toLowerCase() ? "active":"";
    b.textContent = m.name||id;
    b.addEventListener("click", async () => {
      state.model = isExternalModelId(id) ? String(id).toLowerCase() : normalizeModelId(id);
      els.modelBtn.innerHTML = escapeHtml(m.name||id)+svg("chevD",14);
      updateComposerChip();
      els.modelDrop.classList.remove("open");
      if (els.modelBtn) els.modelBtn.setAttribute("aria-expanded", "false");
      await api("/v1/settings",{method:"PATCH",body:JSON.stringify({default_model:state.model})},{success:"Default model updated"});
      // Keep active project model in sync when chatting inside a project.
      if (state.activeProjectId && !isExternalModelId(state.model)) {
        await api("/v1/projects/"+encodeURIComponent(state.activeProjectId),{
          method:"PATCH", body:JSON.stringify({model:state.model})
        },{error:false});
      }
      if (state.settings) state.settings.default_model = state.model;
      renderModels();
    });
    els.modelDrop.appendChild(b);
  });
  const cur = list.find(m => {
    const id = m.id||m;
    return id === state.model || String(id).toLowerCase() === String(state.model).toLowerCase();
  })||list[0];
  els.modelBtn.innerHTML = escapeHtml((cur&&(cur.name||cur.id))||state.model)+svg("chevD",14);
  const pill = $("omLevelPill");
  if (pill) {
    let n = null;
    if (cur && cur.level != null) n = Number(cur.level);
    else {
      const m = String(state.model || "").match(/L([1-5])/i);
      if (m) n = Number(m[1]);
    }
    pill.textContent = (n >= 1 && n <= 5) ? ("OM-L" + n) : String((cur && cur.name) || state.model || "OM-L5");
  }
  updateComposerChip();
}

function updateComposerChip() {
  const chip = $("composerModelChip");
  if (chip) chip.textContent = state.model;
}

function normalizeModelId(id) {
  const raw = String(id || "").trim();
  if (!raw) return "OM-L5";
  const low = raw.toLowerCase();
  if (low === "om-1.0" || low === "om-1" || low === "om1.0") return "OM-L1";
  const m = low.match(/^om-?l([1-5])(?:\.0)?$/);
  if (m) return "OM-L" + m[1];
  return raw;
}

/** External provider ids used by Settings → AI (gpt, deepseek, …). */
function isExternalModelId(id) {
  const raw = String(id || "").trim().toLowerCase();
  if (!raw) return false;
  if (/^om-l[1-5]$/.test(raw)) return false;
  if (/^om-?1(\.0)?$/.test(raw) || raw === "om" || raw === "om_native") return false;
  return ["gpt","claude","gemini","llama","mistral","qwen","deepseek","openrouter","grok"].includes(raw);
}

/** Model id actually sent to /api/v1/chat/completions. */
function activeChatModel() {
  const fromState = normalizeModelId(state.model || "");
  const fromSettings = normalizeModelId((state.settings && state.settings.default_model) || "");
  // Prefer an enabled external default from Settings so keys actually get used.
  if (isExternalModelId(fromSettings)) {
    const providers = (state.settings && state.settings.llm_providers) || {};
    const keysSet = (state.settings && state.settings.llm_api_keys_set) || {};
    const pid = fromSettings.toLowerCase();
    if (providers[pid] !== false && keysSet[pid]) return pid;
    if (providers[pid]) return pid;
  }
  if (isExternalModelId(fromState)) return fromState.toLowerCase();
  return fromState || "OM-L5";
}

/** Levels 1–5 for pickers (exclude duplicate OM-1.0 alias + external). */
function evolutionModelList() {
  const fromCat = (state.catalog || []).filter(m => {
    const id = String((m && m.id) || m || "");
    return /^OM-L[1-5]$/i.test(id);
  });
  if (fromCat.length) return fromCat;
  return [
    {id:"OM-L1", name:"OM Pulse · Chat", level:1},
    {id:"OM-L2", name:"OM Mind · Reason", level:2},
    {id:"OM-L3", name:"OM Forge · Agent", level:3},
    {id:"OM-L4", name:"OM Nova · Create", level:4},
    {id:"OM-L5", name:"OM Matrix · Orchestrate", level:5},
  ];
}

function modelSelectOptions(selected) {
  const sel = normalizeModelId(selected || state.model || "OM-L5");
  return evolutionModelList().map(m => {
    const id = m.id || m;
    const label = m.name || id;
    return '<option value="'+escapeHtml(id)+'"'+(id===sel?' selected':'')+">"+escapeHtml(label)+"</option>";
  }).join("");
}

async function loadOmRuntimeStatus() {
  const nativeEl = $("omNativeStatus");
  const qualityEl = $("omQualityStatus");
  if (!nativeEl || !qualityEl) return;
  try {
    const {res, data} = await api("/api/v1/om/modules", {}, {error:false});
    if (!res.ok || !data) throw new Error("Runtime status unavailable");
    const ready = data.native_model_ready === true;
    nativeEl.innerHTML = '<i class="dot '+(ready ? "online" : "offline")+'"></i>' +
      (ready ? "Native model loaded" : "Native model not ready");
    nativeEl.title = ready
      ? "Checkpoint loaded; answer quality is not implied."
      : "OM native checkpoint is not loaded or trained.";
    qualityEl.textContent = "Quality " + (data.quality_status || "not certified").replace(/_/g, " ");
    qualityEl.title = "A loaded checkpoint is not proof of answer quality. Run the OM capability evaluation.";
  } catch (_) {
    nativeEl.innerHTML = '<i class="dot offline"></i>Runtime status unavailable';
    nativeEl.title = "Could not verify native model readiness.";
    qualityEl.textContent = "Quality not certified";
    qualityEl.title = "Answer quality has not been certified by evaluation.";
  }
}

async function loadModelsCatalog() {
  const { res, data } = await api("/v1/models/catalog",{},{error:false});
  if (res.ok && data) {
    state.catalog = data.models || [];
    state.models = evolutionModelList();
    if (data.default_model) {
      state.model = isExternalModelId(data.default_model)
        ? String(data.default_model).toLowerCase()
        : normalizeModelId(data.default_model);
    }
  } else {
    state.models = evolutionModelList();
  }
  if (!isExternalModelId(state.model)) state.model = normalizeModelId(state.model);
  renderModels();
}

function renderNotifDrop() {
  els.notifDrop.innerHTML = "";
  if (!state.notifications.length) {
    els.notifDrop.innerHTML = '<div style="padding:12px;color:var(--muted);font-size:13px">No notifications</div>'; return;
  }
  state.notifications.slice(0,20).forEach(n => {
    const d = document.createElement("div");
    d.className = "notif-item"+(n.read?"":" unread");
    d.innerHTML = "<strong></strong><span></span>";
    d.querySelector("strong").textContent = n.title||"Notification";
    d.querySelector("span").textContent = (n.body||"")+" · "+fmtDate(n.created_at);
    d.addEventListener("click", async () => {
      if (!n.read) {
        await api("/v1/notifications/"+encodeURIComponent(n.id)+"/read",{method:"POST",body:"{}"},{error:false});
        n.read = true; state.unreadNotifs = Math.max(0,state.unreadNotifs-1);
        els.notifDot.classList.toggle("hidden",!state.unreadNotifs);
        d.classList.remove("unread");
      }
    });
    els.notifDrop.appendChild(d);
  });
}

function mkBadge(text, cls) {
  const s = document.createElement("span");
  s.className = "badge "+(cls||"gray");
  s.textContent = text;
  return s;
}

function uiMoreMenu(items) {
  const wrap = document.createElement("div");
  wrap.className = "ui-more-wrap";
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "icon-btn";
  btn.title = "More";
  btn.innerHTML = svg("more",16);
  const drop = document.createElement("div");
  drop.className = "drop-menu";
  btn.addEventListener("click", e => {
    e.stopPropagation();
    const wasOpen = drop.classList.contains("open");
    closeMenus();
    if (wasOpen) return;
    drop.innerHTML = "";
    (items||[]).forEach(it => {
      const b = document.createElement("button");
      b.type = "button";
      if (it.danger) b.style.color = "var(--danger)";
      b.innerHTML = (it.icon ? svg(it.icon,14) : "") + escapeHtml(it.label||"");
      b.onclick = async ev => {
        ev.stopPropagation();
        drop.classList.remove("open");
        if (it.onClick) await it.onClick();
      };
      drop.appendChild(b);
    });
    drop.classList.add("open");
  });
  wrap.append(btn, drop);
  return wrap;
}

function uiCard({ icon, title, desc, badges, actions, more }) {
  const card = document.createElement("div");
  card.className = "ui-card";
  const left = document.createElement("div");
  left.className = "ui-card-top";
  left.innerHTML =
    '<div class="ui-icon">'+(icon ? svg(icon,18) : svg("file",18))+"</div>"+
    '<div class="grow"><h3></h3><p></p><div class="ui-badges"></div></div>';
  left.querySelector("h3").textContent = title || "Untitled";
  left.querySelector("p").textContent = desc || "";
  const badgeRow = left.querySelector(".ui-badges");
  (badges||[]).forEach(b => {
    if (!b) return;
    if (b instanceof Node) badgeRow.appendChild(b);
    else badgeRow.appendChild(mkBadge(b.text, b.cls));
  });
  const act = document.createElement("div");
  act.className = "ui-actions";
  (actions||[]).forEach(a => { if (a) act.appendChild(a); });
  if (more && more.length) act.appendChild(uiMoreMenu(more));
  card.append(left, act);
  return card;
}

function blurb(text, max) {
  const s = String(text||"").trim().replace(/\s+/g," ");
  if (!s) return "";
  const n = max || 160;
  return s.length > n ? s.slice(0, n) + "…" : s;
}

function buildTabs(container, tabs, onChange, defaultTab) {
  const bar = document.createElement("div"); bar.className = "tabs";
  const activeId = defaultTab||tabs[0][0];
  tabs.forEach(([id, label]) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "tab"+(id === activeId?" active":"");
    b.dataset.tab = id; b.textContent = label;
    b.addEventListener("click", () => {
      bar.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      b.classList.add("active");
      onChange(id);
    });
    bar.appendChild(b);
  });
  container.appendChild(bar);
  return activeId;
}

/* ─── VIEW: SEARCH ─── */
async function loadSearchView() {
  const panel = $("searchPanel");
  panel.innerHTML = '<div class="panel-head"><div><h2>Search</h2><p class="sub">Search across your workspace.</p></div></div>'+
    '<input class="search-bar" id="globalSearchInput" placeholder="Search conversations, files, projects…" value="'+escapeHtml(state.searchQuery)+'"/>'+
    '<div id="searchResults">'+skeletons(4)+"</div>";
  const input = $("globalSearchInput");
  const run = async () => {
    const q = input.value.trim(); state.searchQuery = q;
    const box = $("searchResults");
    if (!q) { box.innerHTML = emptyPanel("Start typing","Search chats, files, projects, assistants, and more.").outerHTML; return; }
    box.innerHTML = skeletons(3);
    try {
      const { res, data } = await api("/v1/search?q="+encodeURIComponent(q),{},{error:false});
      if (!res.ok) { box.innerHTML = '<div class="empty-panel"><p>Search failed. Try again.</p></div>'; return; }
      const results = (data && data.results)||{};
      box.innerHTML = "";
      const sections = [
        ["conversations","Chats"],["projects","Projects"],["assistants","Assistants"],
        ["files","Files"],["library","Library"],["prompts","Prompts"],["memories","Memories"],
      ];
      let any = false;
      sections.forEach(([key, label]) => {
        const items = results[key]||[]; if (!items.length) return; any = true;
        const g = document.createElement("div"); g.className = "search-group";
        g.innerHTML = "<h4>"+escapeHtml(label)+"</h4>";
        items.forEach(item => {
          const hit = document.createElement("div"); hit.className = "search-hit";
          hit.innerHTML = '<span class="tag">'+escapeHtml(label.slice(0,-1))+"</span><strong></strong><span class=\"search-hit-meta\"></span>";
          hit.querySelector("strong").textContent = item.title||item.name||item.id||"Item";
          hit.querySelector(".search-hit-meta").textContent = item.description||item.content||item.body||fmtDate(item.updated_at||item.created_at);
          hit.addEventListener("click", () => {
            if (key==="conversations"&&item.id) loadConversation(item.id);
            else setView(key==="memories"?"memory":key);
          });
          g.appendChild(hit);
        });
        box.appendChild(g);
      });
      if (!any) box.appendChild(emptyPanel("No results",'Nothing matched "'+q+'".'));
    } catch (_) {
      box.innerHTML = '<div class="empty-panel"><p>Search failed. Try again.</p></div>';
    }
  };
  input.addEventListener("keydown", e => { if (e.key==="Enter") run(); });
  let t; input.addEventListener("input", () => { clearTimeout(t); t = setTimeout(run,300); });
  input.focus();
  if (state.searchQuery) run();
  else $("searchResults").innerHTML = emptyPanel("Start typing","Search chats, files, projects, assistants, and more.").outerHTML;
}

function openLibraryCreateModal() {

async function loadLibTab(tabId) {
  activeLibTab = tabId || "all";
  const box = $("libContent"); if (!box) return;
  box.innerHTML = skeletons(3);
  const params = [];
  if (activeLibTab !== "all" && activeLibTab !== "favorites") params.push("kind="+encodeURIComponent(activeLibTab));
  if (activeLibTab === "favorites") params.push("favorite=1");
  const { res, data } = await api("/v1/library"+(params.length?"?"+params.join("&"):""),{},{error:false});
  box.innerHTML = "";
  const items = (res.ok && data && data.items)||[];
  if (!items.length) {
    box.appendChild(emptyPanel("Nothing here","Add items to your library.","Add item", () => openLibraryCreateModal()));
    return;
  }
  items.forEach(item => {
    box.appendChild(uiCard({
      icon: item.kind === "image" ? "image" : (item.kind === "snippet" ? "code" : "book"),
      title: item.title || "Untitled",
      desc: blurb(item.content, 160),
      badges: [
        {text: item.kind || "item", cls:"gray"},
        item.favorite ? {text:"Favorite", cls:"yellow"} : null,
        {text: fmtDate(item.created_at), cls:"gray"},
      ].filter(Boolean),
      actions: [
        btnPrimary("Use", "zap", () => {
          els.input.value = item.content||"";
          autosize(); setView("chat");
          toast("Loaded into composer","success");
        }),
      ],
      more: [
        {
          label: item.favorite ? "Unfavorite" : "Favorite",
          icon: "star",
          onClick: async () => {
            await api("/v1/library/"+encodeURIComponent(item.id),{method:"PATCH",body:JSON.stringify({favorite:!item.favorite})},{success:item.favorite?"Removed from favorites":"Favorited"});
            loadLibTab(activeLibTab);
          },
        },
        {
          label: "Delete",
          icon: "trash",
          danger: true,
          onClick: async () => {
            if (!confirm("Delete item?")) return;
            await api("/v1/library/"+encodeURIComponent(item.id),{method:"DELETE"},{success:"Deleted"});
            loadLibTab(activeLibTab);
          },
        },
      ],
    }));
  });
}

function toolIconName(id) {
  const map = {
    shell:"wrench", knowledge_search:"brain", openapi:"link",
    web_search:"globe", calculator:"cpu", code_interpreter:"code", file_analyzer:"file",
  };
  return map[id] || "wrench";
}

function syncComposerToolsFromCatalog(tools) {
  const byId = {};
  (tools||[]).forEach(t => { byId[t.id] = t; });
  const web = byId.web_search;
  const code = byId.code_interpreter;
  if (web) {
    state.tools.web = !!(web.installed && web.enabled);
    $("toolWeb") && $("toolWeb").classList.toggle("on", state.tools.web);
  }
  if (code) {
    state.tools.code = !!(code.installed && code.enabled);
    $("toolCode") && $("toolCode").classList.toggle("on", state.tools.code);
  }
}

async function patchTool(toolId, body, successMsg) {
  const { res, data } = await api(
    "/v1/tools/"+encodeURIComponent(toolId),
    {method:"PATCH", body:JSON.stringify(body)},
    {success: successMsg, error:true}
  );
  return { res, data };
}

async function loadToolsView() {
  const panel = $("toolsPanel");
  panel.innerHTML =
    '<div class="panel-head"><div><h2>Tools</h2><p class="sub">Install and enable tools for chat and agents.</p></div></div>'+
    '<div class="tools-list" id="toolsList">'+skeletons(4)+"</div>";

  const { res, data } = await api("/v1/tools",{},{error:false});
  const box = $("toolsList");
  box.innerHTML = "";
  const items = (res.ok && data && (data.tools||data.items))||[];
  if (!items.length) {
    box.appendChild(emptyPanel("No tools available","Tools registered in your workspace will appear here."));
    return;
  }
  syncComposerToolsFromCatalog(items);

  items.forEach(t => {
    const installed = !!(t.installed || t.category === "installed");
    const enabled = installed && !!t.enabled;
    const card = document.createElement("div");
    card.className = "tool-card";

    const left = document.createElement("div");
    left.className = "tool-card-top";
    left.innerHTML =
      '<div class="tool-icon">'+svg(toolIconName(t.id),18)+"</div>"+
      '<div class="grow"><h3></h3><p></p><div class="tool-badges"></div></div>';
    left.querySelector("h3").textContent = t.name || t.id;
    left.querySelector("p").textContent = t.description || "";
    const badges = left.querySelector(".tool-badges");
    const mkBadge = (text, cls) => {
      const s = document.createElement("span");
      s.className = "badge "+cls;
      s.textContent = text;
      return s;
    };
    badges.appendChild(mkBadge(installed ? "Installed" : "Available", installed ? "blue" : "gray"));
    badges.appendChild(mkBadge(enabled ? "Enabled" : "Disabled", enabled ? "green" : "gray"));

    const actions = document.createElement("div");
    actions.className = "tool-actions";

    if (!installed) {
      actions.appendChild(btnPrimary("Install", "download", async () => {
        await patchTool(t.id, {install:true, enabled:true}, "Tool installed & enabled");
        loadToolsView();
      }));
    } else if (enabled) {
      actions.appendChild(btnOutline("Disable", "x", async () => {
        await patchTool(t.id, {enabled:false}, "Tool disabled");
        loadToolsView();
      }));
    } else {
      actions.appendChild(btnPrimary("Enable", "check", async () => {
        await patchTool(t.id, {enabled:true, install:true}, "Tool enabled");
        loadToolsView();
      }));
    }

    card.appendChild(left);
    card.appendChild(actions);
    box.appendChild(card);
  });
}

/* ─── VIEW: PROJECTS ─── */
function setProjectHash(projectId, chatId) {
  if (!projectId) { if (location.hash.indexOf("/projects") === 1) history.replaceState(null,"",location.pathname+location.search); return; }
  const h = chatId ? "#/projects/"+projectId+"/chat/"+chatId : "#/projects/"+projectId;
  if (location.hash !== h) history.replaceState(null,"",h);
}

function parseProjectHash() {
  const m = String(location.hash||"").match(/^#\/projects(?:\/([a-f0-9]+)(?:\/chat\/([a-f0-9]+))?)?/i);
  if (!m) return null;
  return { projectId: m[1]||null, chatId: m[2]||null };
}

function relativeUpdated(iso) {
  if (!iso) return "";
  const d = parseConvDate(iso);
  if (!d) return String(iso);
  const bucket = dayBucket(iso);
  return bucket === "Older"
    ? d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })
    : bucket;
}

async function openProjectCreateModal() {
  const opts = modelSelectOptions(state.model || "OM-L5");
  showModal("New Project",
    '<form class="form-grid" id="projCreateModalForm">'+
    '<label>Project Name<input name="name" required maxlength="120" placeholder="Hindu Rishte AI"/></label>'+
    '<label>Description<textarea name="description" rows="2" maxlength="2000" placeholder="What is this project about?"></textarea></label>'+
    '<label>Project Instructions<textarea name="instructions" rows="5" maxlength="8000" placeholder="You are a relationship assistant."></textarea></label>'+
    '<label>Default AI Model<select name="model">'+opts+"</select></label>"+
    '<label>Seed file (optional)<input name="seed" type="file"/></label>'+
    '<p style="margin:0;font-size:12px;color:var(--muted)">After create you will open the project workspace.</p></form>',
    async () => {
      const form = $("projCreateModalForm");
      if (!form) return;
      const fd = new FormData(form);
      const name = String(fd.get("name")||"").trim();
      if (!name) { toast("Project name required","error"); return; }
      const payload = {
        name,
        description: String(fd.get("description")||"").trim(),
        instructions: String(fd.get("instructions")||"").trim(),
        model: normalizeModelId(String(fd.get("model")||state.model||"OM-L5")),
      };
      const { res, data } = await api("/v1/projects",{method:"POST",body:JSON.stringify(payload)},{success:"Project created"});
      if (!res.ok || !data) return;
      const fileInput = form.querySelector('input[name="seed"]');
      if (fileInput && fileInput.files && fileInput.files[0]) {
        const f = fileInput.files[0];
        const text = await f.text().catch(() => "");
        await api("/v1/projects/"+encodeURIComponent(data.id)+"/files",{
          method:"POST",
          body:JSON.stringify({name:f.name, content:text.slice(0,500000), mime:f.type||"text/plain"})
        },{error:false});
      }
      state.projects = [data].concat(state.projects.filter(p => p.id !== data.id));
      state.expandedProjects[data.id] = true;
      state.activeProjectId = data.id;
      renderConvList();
      await loadProjectDetail(data);
    }
  );
  // Make modal OK submit the form
  setTimeout(() => {
    const form = $("projCreateModalForm");
    if (form) form.addEventListener("submit", e => { e.preventDefault(); els.modalOk.click(); });
  }, 0);
}

async function renderProjectsList() {
  const list = $("projectsList");
  if (!list) return;
  list.innerHTML = skeletons(3);
  const qs = new URLSearchParams();
  if (state.projectQuery) qs.set("q", state.projectQuery);
  if (state.projectSort) qs.set("sort", state.projectSort);
  if (state.projectFilter) qs.set("filter", state.projectFilter);
  const { res, data } = await api("/v1/projects?"+qs.toString(),{},{error:false});
  list.innerHTML = "";
  state.projects = (res.ok && data && data.projects)||[];
  if (!state.projects.length) {
    list.appendChild(emptyPanel("No projects","Create a project to keep chats, files, and memory together.","New Project", () => openProjectCreateModal()));
    return;
  }
  state.projects.forEach(p => list.appendChild(projectCard(p)));
}

function projectCard(p) {
  const card = document.createElement("div");
  card.className = "entity-card";
  card.style.cssText = "padding:16px;border:1px solid var(--border);border-radius:14px;background:var(--bg);margin-bottom:10px;position:relative;";
  card.innerHTML =
    '<div style="display:flex;gap:12px;align-items:flex-start">'+
    '<div style="width:40px;height:40px;border-radius:10px;background:var(--soft);display:grid;place-items:center;flex-shrink:0">'+svg("folder",18)+"</div>"+
    '<div style="flex:1;min-width:0">'+
    '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><strong style="font-size:15px">'+escapeHtml(p.name||"Untitled")+"</strong>"+
    (p.favorite ? '<span class="badge blue">Favorite</span>' : "")+
    (p.archived ? '<span class="badge gray">Archived</span>' : "")+
    "</div>"+
    '<p style="margin:6px 0;color:var(--muted);font-size:13px;line-height:1.45">'+escapeHtml(p.description||"No description")+"</p>"+
    '<div style="display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)">'+
    "<span>Last updated: "+escapeHtml(relativeUpdated(p.updated_at||p.created_at))+"</span>"+
    "<span>Chats: "+(p.chat_count||0)+"</span>"+
    "<span>Files: "+(p.file_count||0)+"</span>"+
    "</div>"+
    '<div style="display:flex;gap:8px;margin-top:12px;align-items:center">'+
    '<button type="button" class="btn-primary" data-open>Open Project</button>'+
    '<button type="button" class="icon-btn" data-menu title="More">'+svg("more",16)+"</button>"+
    "</div></div></div>"+
    '<div class="drop-menu" data-drop style="right:12px;top:auto;bottom:12px;left:auto;min-width:180px"></div>';

  card.querySelector("[data-open]").onclick = () => loadProjectDetail(p);
  const menuBtn = card.querySelector("[data-menu]");
  const drop = card.querySelector("[data-drop]");
  menuBtn.onclick = (e) => {
    e.stopPropagation();
    closeMenus();
    drop.innerHTML =
      '<button type="button" data-act="rename">'+svg("edit",14)+" Rename</button>"+
      '<button type="button" data-act="duplicate">'+svg("copy",14)+" Duplicate</button>"+
      '<button type="button" data-act="favorite">'+svg("star",14)+" "+(p.favorite?"Unfavorite":"Favorite")+"</button>"+
      '<button type="button" data-act="archive">'+svg("archive",14)+" "+(p.archived?"Unarchive":"Archive")+"</button>"+
      '<button type="button" data-act="share">'+svg("share",14)+" Share</button>"+
      '<div class="drop-sep"></div>'+
      '<button type="button" data-act="delete" style="color:var(--danger)">'+svg("trash",14)+" Delete</button>";
    drop.classList.add("open");
    drop.querySelectorAll("[data-act]").forEach(btn => {
      btn.onclick = async (ev) => {
        ev.stopPropagation();
        drop.classList.remove("open");
        const act = btn.getAttribute("data-act");
        if (act === "rename") {
          const name = prompt("Rename project", p.name||"");
          if (!name || !name.trim()) return;
          await api("/v1/projects/"+encodeURIComponent(p.id),{method:"PATCH",body:JSON.stringify({name:name.trim()})},{success:"Renamed"});
          renderProjectsList();
        } else if (act === "duplicate") {
          const { res, data } = await api("/v1/projects/"+encodeURIComponent(p.id)+"/duplicate",{method:"POST"},{success:"Duplicated"});
          if (res.ok && data) loadProjectDetail(data);
          else renderProjectsList();
        } else if (act === "favorite") {
          await api("/v1/projects/"+encodeURIComponent(p.id),{method:"PATCH",body:JSON.stringify({favorite:!p.favorite})},{success:p.favorite?"Removed favorite":"Favorited"});
          renderProjectsList();
        } else if (act === "archive") {
          await api("/v1/projects/"+encodeURIComponent(p.id),{method:"PATCH",body:JSON.stringify({archived:!p.archived})},{success:p.archived?"Restored":"Archived"});
          renderProjectsList();
        } else if (act === "share") {
          const url = location.origin+"/chat#/projects/"+p.id;
          try { await navigator.clipboard.writeText(url); toast("Project link copied","success"); }
          catch (_) { prompt("Copy project link", url); }
        } else if (act === "delete") {
          if (!confirm("Delete project permanently?")) return;
          await api("/v1/projects/"+encodeURIComponent(p.id),{method:"DELETE"},{success:"Project deleted"});
          renderProjectsList();
        }
      };
    });
  };
  return card;
}

async function loadProjectDetail(p, tab) {
  state.activeProjectId = p.id;
  setProjectHash(p.id);
  if (p.model) state.model = normalizeModelId(p.model);
  const panel = $("projectsPanel");
  panel.innerHTML =
    '<button type="button" class="back-btn" id="projBackBtn">'+svg("chevL",14)+" Projects</button>"+
    '<div class="detail-header">'+
    '<h2 id="projDetailTitle"></h2>'+
    '<p class="sub" id="projDetailDesc"></p>'+
    '<div class="detail-meta">'+
    '<span class="badge blue">'+svg("folder",12)+" Project</span>"+
    '<span style="font-size:12px;color:var(--muted)">Model: '+escapeHtml(normalizeModelId(p.model||state.model||"OM-L5"))+"</span>"+
    '<span style="font-size:12px;color:var(--muted)">'+fmtDate(p.updated_at||p.created_at)+"</span>"+
    '</div></div>'+
    '<div id="projDetailTabs"></div><div id="projDetailContent">'+skeletons(2)+"</div>";

  $("projDetailTitle").textContent = p.name;
  $("projDetailDesc").textContent = p.description||"";
  $("projBackBtn").addEventListener("click", loadProjectsView);

  const tabs = [
    ["overview","Overview"],["chats","Chats"],["files","Files"],
    ["knowledge","Knowledge"],["instructions","Instructions"],
    ["memory","Memory"],["settings","Settings"]
  ];
  const startTab = tab || "overview";
  buildTabs($("projDetailTabs"), tabs, id => loadProjectTab(p, id), startTab);
  loadProjectTab(p, startTab);
  setView("projects", true);
}

async function openProjectChat(project, chatId) {
  state.activeProjectId = project.id;
  if (project.model) state.model = normalizeModelId(project.model);
  await loadConversation(chatId, {keepProject:true});
  renderModels();
  setProjectHash(project.id, chatId);
}

async function loadProjectTab(p, tab) {
  const box = $("projDetailContent");
  if (!box) return;
  box.innerHTML = skeletons(2);

  if (tab === "overview") {
    const { res, data } = await api("/v1/projects/"+encodeURIComponent(p.id),{},{error:false});
    const proj = (res.ok && data) || p;
    Object.assign(p, proj);
    box.innerHTML = "";
    const info = document.createElement("div");
    info.className = "settings-section";
    info.innerHTML = "<h3>Overview</h3>"+
      "<p style='margin:0;font-size:14px;line-height:1.6'>"+escapeHtml(proj.description||"No description.")+"</p>"+
      (proj.instructions ? "<pre style='white-space:pre-wrap;background:var(--soft);padding:12px;border-radius:10px;font-size:13px;margin-top:12px'>"+escapeHtml(proj.instructions.slice(0,800))+"</pre>" : "")+
      "<div class='stat-row' style='margin-top:12px'>"+
      "<div class='stat'><strong>"+(proj.chat_count||0)+"</strong><span>Chats</span></div>"+
      "<div class='stat'><strong>"+(proj.file_count||0)+"</strong><span>Files</span></div>"+
      "<div class='stat'><strong>"+(proj.memory_count||0)+"</strong><span>Memories</span></div>"+
      "<div class='stat'><strong>"+(proj.knowledge_count||0)+"</strong><span>Knowledge</span></div>"+
      "</div>";
    box.appendChild(info);
    const { res: r2, data: d2 } = await api("/v1/projects/"+encodeURIComponent(p.id)+"/chats",{},{error:false});
    const chats = (r2.ok && ((d2 && d2.chats) || (d2 && d2.conversations))) || [];
    if (chats.length) {
      const h4 = document.createElement("h4"); h4.textContent = "Recent project chats"; h4.style.cssText = "margin:16px 0 8px;font-size:14px;";
      box.appendChild(h4);
      chats.slice(0,5).forEach(c => {

        row.addEventListener("click", () => openProjectChat(p, c.id));

      '<button type="button" class="btn-primary" id="projNewChatBtn">'+svg("plus",14)+" New Chat</button></div>"+
      '<div id="projChatsList">'+skeletons(3)+"</div>";
    $("projNewChatBtn").onclick = async () => {
      const chat = await createChat("New chat", p.id);
      await openProjectChat(p, chat.id);
    };
    const { res, data } = await api("/v1/projects/"+encodeURIComponent(p.id)+"/chats",{},{error:false});
    const list = $("projChatsList"); list.innerHTML = "";
    const chats = (res.ok && ((data && data.chats) || (data && data.conversations))) || [];
    if (!chats.length) { list.appendChild(emptyPanel("No project chats yet","Start a chat that uses this project's instructions, files, and memory.","New Chat", () => $("projNewChatBtn").click())); return; }
    chats.forEach(c => {
      const row = document.createElement("div");
      row.style.cssText = "display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;background:var(--bg);cursor:pointer;";
      row.innerHTML = svg("message",16)+'<div style="flex:1;min-width:0"><strong style="display:block;font-size:14px">'+escapeHtml(c.title||"Chat")+'</strong><small style="color:var(--muted)">'+fmtDate(c.updated_at)+"</small></div>";
      row.onclick = () => openProjectChat(p, c.id);

      '<div id="projFilesList">'+skeletons(3)+"</div>";
    $("projFileInput").onchange = async (e) => {
      const files = Array.from(e.target.files||[]);
      for (const f of files) {
        const text = await f.text().catch(() => "");
        await api("/v1/projects/"+encodeURIComponent(p.id)+"/files",{
          method:"POST", body:JSON.stringify({name:f.name, content:String(text||"").slice(0,500000), mime:f.type||"text/plain"})

    const files = (res.ok && data && data.files)||[];
    if (!files.length) { list.appendChild(emptyPanel("No files","Upload documents to ground project chats.")); return; }
    files.forEach(f => {
      list.appendChild(entityCard(f.name, (f.mime||"file")+" · Ready ✓", fmtDate(f.updated_at||f.created_at), [
        btnOutline("Open","externalLink", async () => {
          const { res:r2, data:d2 } = await api("/v1/files/"+encodeURIComponent(f.id),{},{error:false});

        }),
        btnOutline("Rename","edit", async () => {
          const name = prompt("Rename file", f.name||"");
          if (!name || !name.trim()) return;
          await api("/v1/files/"+encodeURIComponent(f.id),{method:"PATCH",body:JSON.stringify({name:name.trim()})},{success:"Renamed"});
          loadProjectTab(p, "files");
        }),
        btnOutline("Remove","trash", async () => {
          if (!confirm("Remove file from project?")) return;
          await api("/v1/projects/"+encodeURIComponent(p.id)+"/files/"+encodeURIComponent(f.id),{method:"DELETE"},{success:"Removed"});
          loadProjectTab(p, "files");
        }),
      ]));
    });
    return;
  }

  if (tab === "knowledge") {
    box.innerHTML =
      '<div class="panel-head" style="padding:0;margin-bottom:12px"><div><h3 style="margin:0">Knowledge</h3><p class="sub">Files, documents, URLs, and data sources for project search.</p></div></div>'+
      '<form class="form-grid" id="projKnForm">'+
      '<label>Name<input name="name" required maxlength="200" placeholder="Source name"/></label>'+
      '<label>Type<select name="source_type"><option value="document">Document</option><option value="url">URL</option><option value="file">File</option><option value="data">Data source</option></select></label>'+
      '<label>URI / URL<input name="uri" maxlength="1000" placeholder="https://…"/></label>'+
      '<label>Content<textarea name="content" rows="4" maxlength="2000000" placeholder="Paste text to embed…"></textarea></label>'+
      '<button type="submit" class="btn-primary">'+svg("plus",14)+" Add source</button></form>"+
      '<div id="projKnList" style="margin-top:14px">'+skeletons(2)+"</div>";
    $("projKnForm").onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      await api("/v1/knowledge/sources",{method:"POST",body:JSON.stringify({
        name:String(fd.get("name")||"").trim(),
        source_type:String(fd.get("source_type")||"document"),
        uri:String(fd.get("uri")||"").trim(),
        content:String(fd.get("content")||""),
        project_id:p.id
      })},{success:"Knowledge source added"});

      e.target.reset(); loadProjectTab(p, "memory");
    };
    const { res, data } = await api("/v1/projects/"+encodeURIComponent(p.id)+"/memory",{},{error:false});

      '<button type="button" class="btn-danger" id="projDeleteBtn">'+svg("trash",14)+" Delete Project</button></div></form>"+

async function restoreProjectRoute() {
  const route = parseProjectHash();
  if (!route || !route.projectId) return false;
  const { res, data } = await api("/v1/projects/"+encodeURIComponent(route.projectId),{},{error:false});
  if (!res.ok || !data) return false;
  if (route.chatId) {
    await loadProjectDetail(data, "chats");
    await openProjectChat(data, route.chatId);
  } else {
    await loadProjectDetail(data);
  }
  return true;
}

/* ─── VIEW: ASSISTANTS ─── */
function assistantBlurb(a) {
  const desc = String(a.description || "").trim();
  if (desc) return desc;
  const sp = String(a.system_prompt || "").trim().replace(/\s+/g, " ");
  if (!sp) return "No description yet.";
  return sp.length > 140 ? sp.slice(0, 140) + "…" : sp;
}

async function openAssistantCreateModal() {
  const opts = modelSelectOptions(state.model || "OM-L5");
  showModal("New Assistant",
    '<form class="form-grid" id="asstCreateModalForm">'+
    '<label>Name<input name="name" required maxlength="120" placeholder="Coding Assistant"/></label>'+
    '<label>Description<textarea name="description" rows="2" maxlength="2000" placeholder="What this assistant is for"></textarea></label>'+
    '<label>System prompt<textarea name="system_prompt" rows="6" maxlength="8000" placeholder="You are a helpful coding assistant…"></textarea></label>'+
    '<label>Model<select name="model">'+opts+"</select></label></form>",
    async () => {
      const form = $("asstCreateModalForm");
      if (!form) return;
      const fd = new FormData(form);
      const name = String(fd.get("name")||"").trim();
      if (!name) { toast("Name required","error"); return; }
      const { res, data } = await api("/v1/assistants",{method:"POST",body:JSON.stringify({
        name,
        description: String(fd.get("description")||"").trim(),
        system_prompt: String(fd.get("system_prompt")||"").trim(),
        model: normalizeModelId(String(fd.get("model")||state.model||"OM-L5")),
      })},{success:"Assistant created"});
      if (!res.ok || !data) return;
      state.assistants = [data].concat(state.assistants.filter(x => x.id !== data.id));
      await loadAssistantsView();
      loadAssistantDetail(data);
    }
  );
  setTimeout(() => {
    const form = $("asstCreateModalForm");
    if (form) form.addEventListener("submit", e => { e.preventDefault(); els.modalOk.click(); });
  }, 0);
}

async function loadAssistantsView() {
  const panel = $("assistantsPanel");
  panel.innerHTML =
    '<div class="panel-head"><div><h2>Assistants</h2><p class="sub">Custom system prompts for specialized chats.</p></div>'+
    '<button type="button" class="btn-primary" id="asstCreateBtn">'+svg("plus",14)+" New assistant</button></div>"+
    '<div class="asst-list" id="assistantsList">'+skeletons(3)+"</div>";

  $("asstCreateBtn").onclick = () => openAssistantCreateModal();

  const { res, data } = await api("/v1/assistants",{},{error:false});
  const list = $("assistantsList");
  list.innerHTML = "";
  state.assistants = (res.ok && data && data.assistants)||[];
  if (!state.assistants.length) {
    list.appendChild(emptyPanel("No assistants","Create a custom assistant for specialized chats.","New assistant", () => openAssistantCreateModal()));
    return;
  }

  state.assistants.forEach(a => {
    const isActive = state.selectedAssistantId === a.id;
    const card = document.createElement("div");
    card.className = "asst-card"+(isActive?" active":"");

    const left = document.createElement("div");
    left.className = "asst-card-top";
    left.innerHTML =
      '<div class="asst-icon">'+svg("bot",18)+"</div>"+
      '<div class="grow"><h3></h3><p></p><div class="asst-badges"></div></div>';
    left.querySelector("h3").textContent = a.name || "Untitled";
    left.querySelector("p").textContent = assistantBlurb(a);
    const badges = left.querySelector(".asst-badges");
    const mkBadge = (text, cls) => {
      const s = document.createElement("span");
      s.className = "badge "+cls;
      s.textContent = text;
      return s;
    };
    badges.appendChild(mkBadge(a.model || "OM-1.0", "blue"));
    if (isActive) badges.appendChild(mkBadge("Active", "green"));

    const actions = document.createElement("div");
    actions.className = "asst-actions";

    const useBtn = isActive
      ? btnOutline("Active", "check", () => {
          state.selectedAssistantId = null;
          toast("Assistant cleared","success");
          loadAssistantsView();
        })
      : btnPrimary("Use", "zap", () => {
          state.selectedAssistantId = a.id;
          toast("Using "+(a.name||"assistant"),"success");
          setView("chat");
        });
    if (isActive) useBtn.classList.add("active");

    const openBtn = btnOutline("Open", "bot", () => loadAssistantDetail(a));

    const moreWrap = document.createElement("div");
    moreWrap.className = "asst-more-wrap";
    const moreBtn = document.createElement("button");
    moreBtn.type = "button";
    moreBtn.className = "icon-btn";
    moreBtn.title = "More";
    moreBtn.innerHTML = svg("more",16);
    const drop = document.createElement("div");
    drop.className = "drop-menu";
    moreBtn.addEventListener("click", e => {
      e.stopPropagation();
      const wasOpen = drop.classList.contains("open");
      closeMenus();
      if (wasOpen) return;
      drop.innerHTML =
        '<button type="button" data-act="duplicate">'+svg("copy",14)+" Duplicate</button>"+
        '<button type="button" data-act="delete" style="color:var(--danger)">'+svg("trash",14)+" Delete</button>";
      drop.classList.add("open");
      drop.querySelectorAll("[data-act]").forEach(btn => {
        btn.onclick = async ev => {
          ev.stopPropagation();
          drop.classList.remove("open");
          const act = btn.getAttribute("data-act");
          if (act === "duplicate") {
            await api("/v1/assistants/"+encodeURIComponent(a.id)+"/duplicate",{method:"POST",body:"{}"},{success:"Duplicated"});
            loadAssistantsView();
          } else if (act === "delete") {
            if (!confirm("Delete assistant \""+(a.name||"")+"\"?")) return;
            if (state.selectedAssistantId === a.id) state.selectedAssistantId = null;
            await api("/v1/assistants/"+encodeURIComponent(a.id),{method:"DELETE"},{success:"Deleted"});
            loadAssistantsView();
          }
        };
      });
    });
    moreWrap.append(moreBtn, drop);

    actions.append(useBtn, openBtn, moreWrap);
    card.append(left, actions);
    list.appendChild(card);
  });
}

async function loadAssistantTab(a, tab) {
  const box = $("asstDetailContent"); box.innerHTML = skeletons(2);
  if (tab === "chat") {
    box.innerHTML = "";
    const info = document.createElement("div"); info.className = "settings-section";
    const isActive = state.selectedAssistantId === a.id;
    info.innerHTML = "<h3>Use this assistant</h3>"+
      "<p style='margin:0 0 12px;font-size:13px;color:var(--muted)'>When active, this assistant's system prompt will be applied to all new messages.</p>";
    const btn = document.createElement("button"); btn.type = "button";
    btn.className = isActive?"btn-danger":"btn-primary";
    btn.innerHTML = isActive ? svg("x",14)+" Deactivate" : svg("check",14)+" Activate for chat";
    btn.addEventListener("click", () => {
      state.selectedAssistantId = isActive ? null : a.id;
      toast(state.selectedAssistantId?"Assistant active":"Assistant cleared","success");
      if (!isActive) { setView("chat"); } else loadAssistantTab(a,"chat");
    });
    info.appendChild(btn); box.appendChild(info);
  } else if (tab === "instructions") {
    box.innerHTML = "";
    const { res, data } = await api("/v1/instructions/versions?owner_type=assistant&owner_id="+encodeURIComponent(a.id),{},{error:false});
    const versions = (res.ok && data && (data.versions||data.items))||[];
    const form = document.createElement("form"); form.className = "form-grid";
    form.innerHTML = "<label>System prompt<textarea name='system_prompt' rows='12' maxlength='16000'>"+escapeHtml(a.system_prompt||"")+"</textarea></label>"+
      '<button type="submit" class="btn-primary">'+svg("check",14)+" Save version</button>";
    form.addEventListener("submit", async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const sp = String(fd.get("system_prompt"));
      await api("/v1/assistants/"+encodeURIComponent(a.id),{method:"PATCH",body:JSON.stringify({system_prompt:sp})},{success:"System prompt updated"});
      await api("/v1/instructions/versions",{method:"POST",body:JSON.stringify({owner_type:"assistant",owner_id:a.id,content:sp})},{error:false});
      a.system_prompt = sp;
    });
    box.appendChild(form);
    if (versions.length) {
      const h4 = document.createElement("h4"); h4.textContent = "Version history"; h4.style.cssText = "margin:16px 0 8px;font-size:14px;";
      box.appendChild(h4);
      versions.slice(0,5).forEach((v,i) => {
        const row = document.createElement("div"); row.className = "version-row";
        row.innerHTML = '<span class="ver-n">v'+(versions.length-i)+"</span>"+
          '<span class="ver-d">'+fmtDate(v.created_at)+"</span>"+
          '<span class="ver-c">'+escapeHtml((v.content||"").slice(0,80))+"…</span>";
        box.appendChild(row);
      });
    }
  } else if (tab === "knowledge") {
    const { res, data } = await api("/v1/knowledge/sources?assistant_id="+encodeURIComponent(a.id),{},{error:false});
    box.innerHTML = "";
    const sources = (res.ok && data && data.sources)||[];
    if (!sources.length) { box.appendChild(emptyPanel("No knowledge linked","Attach knowledge sources to this assistant.")); return; }
    sources.forEach(s => box.appendChild(entityCard(s.name, s.source_type+" · "+(s.status||""), fmtDate(s.created_at), [])));
  } else if (tab === "tools") {
    const { res, data } = await api("/v1/tools",{},{error:false});
    box.innerHTML = "";
    const intro = document.createElement("div");
    intro.className = "settings-section";
    intro.innerHTML = "<h3>Assistant tools</h3><p style='margin:0;font-size:13px;color:var(--muted)'>Add tools this assistant can use during chats.</p>";
    box.appendChild(intro);
    const list = document.createElement("div");
    list.className = "ui-list";
    box.appendChild(list);
    const tools = (res.ok && data && (data.tools||data.items))||[];
    const asstTools = new Set(a.tools||[]);
    if (!tools.length) {
      list.appendChild(emptyPanel("No tools","Install tools from the Tools page first."));
      return;
    }
    tools.forEach(t => {
      const attached = asstTools.has(t.id);
      const installed = !!(t.installed || t.status === "installed");
      list.appendChild(uiCard({
        icon: toolIconName(t.id),
        title: t.name || t.id,
        desc: t.description || "",
        badges: [
          {text: installed ? "Installed" : "Available", cls: installed ? "blue" : "gray"},
          {text: attached ? "Added" : "Not added", cls: attached ? "green" : "gray"},
        ],
        actions: [
          attached
            ? btnOutline("Remove", "x", async () => {
                const next = new Set(asstTools);
                next.delete(t.id);
                await api("/v1/assistants/"+encodeURIComponent(a.id),{method:"PATCH",body:JSON.stringify({tools:[...next]})},{success:"Tool removed"});
                a.tools = [...next];
                loadAssistantTab(a, "tools");
              })
            : btnPrimary("Add", "plus", async () => {
                const next = new Set(asstTools);
                next.add(t.id);
                if (!installed) {
                  await patchTool(t.id, {install:true, enabled:true}, null).catch(() => {});
                }
                await api("/v1/assistants/"+encodeURIComponent(a.id),{method:"PATCH",body:JSON.stringify({tools:[...next]})},{success:"Tool added"});
                a.tools = [...next];
                loadAssistantTab(a, "tools");
              }),
        ],
      }));
    });
  } else if (tab === "settings") {
    box.innerHTML = "";
    const form = document.createElement("form"); form.className = "form-grid";
    form.innerHTML = "<label>Name<input name='name' value='"+escapeHtml(a.name||"")+"' required maxlength='120'/></label>"+
      "<label>Description<textarea name='description' rows='2'>"+escapeHtml(a.description||"")+"</textarea></label>"+
      "<label>Model<input name='model' value='"+escapeHtml(a.model||state.model)+"'/></label>"+
      '<div style="display:flex;gap:8px">'+
      '<button type="submit" class="btn-primary">'+svg("check",14)+" Save</button>"+
      '<button type="button" class="btn-danger" id="asstDeleteBtn2">'+svg("trash",14)+" Delete</button></div>";
    form.addEventListener("submit", async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      await api("/v1/assistants/"+encodeURIComponent(a.id),{method:"PATCH",body:JSON.stringify({name:String(fd.get("name")||"").trim(),description:String(fd.get("description")||"").trim(),model:String(fd.get("model")||"").trim()})},{success:"Assistant updated"});
    });
    box.appendChild(form);
    $("asstDeleteBtn2").addEventListener("click", async () => {
      if (!confirm("Delete assistant permanently?")) return;
      if (state.selectedAssistantId === a.id) state.selectedAssistantId = null;
      await api("/v1/assistants/"+encodeURIComponent(a.id),{method:"DELETE"},{success:"Deleted"});
      loadAssistantsView();
    });
  }
}

function exploreIcon(category) {
  const map = { featured:"zap", template:"scroll", workflow:"activity", community:"users" };
  return svg(map[category] || "compass", 18);
}

function exploreBadgeClass(category) {
  if (category === "featured") return "blue";

}

    chip.dataset.filter = id;
    chip.addEventListener("click", () => {
      filterBar.querySelectorAll(".explore-chip").forEach(c => c.classList.toggle("active", c === chip));
      renderExploreGrid(id);
    });
    filterBar.appendChild(chip);
  });
  renderExploreGrid("all");
}

function renderExploreGrid(filterId) {
  const body = $("exploreBody");
  if (!body) return;
  const items = state._exploreItems || [];
  const filtered = filterId === "all"
    ? items.slice()
    : items.filter(it => String(it.category||"").toLowerCase() === filterId || (filterId === "featured" && it.featured));

  body.innerHTML = "";
  if (!filtered.length) {
    body.appendChild(emptyPanel("Nothing here","Try another filter or check back later."));
    return;
  }

  const order = ["featured","template","workflow","community"];
  const groups = {};
  filtered.forEach(it => {
    const cat = String(it.category || "template").toLowerCase();
    (groups[cat] = groups[cat] || []).push(it);
  });

  const cats = filterId === "all"
    ? order.filter(c => groups[c] && groups[c].length)
    : Object.keys(groups);

  cats.forEach(cat => {
    const section = document.createElement("section");
    section.className = "explore-section";
    const label = cat.charAt(0).toUpperCase() + cat.slice(1);
    section.innerHTML =
      '<div class="explore-section-head"><h3>'+escapeHtml(label)+'</h3></div>'+
      '<div class="explore-grid"></div>';
    const grid = section.querySelector(".explore-grid");
    (groups[cat] || []).forEach(item => grid.appendChild(buildExploreCard(item)));
    body.appendChild(section);
  });
}

function buildExploreCard(item) {
  const cat = String(item.category || "template").toLowerCase();
  const card = document.createElement("article");
  card.className = "explore-card"+(item.featured ? " featured" : "");
  card.innerHTML =
    '<div class="explore-card-top">'+
    '<div class="explore-icon">'+exploreIcon(cat)+"</div>"+
    '<span class="badge '+exploreBadgeClass(cat)+'">'+escapeHtml(cat)+"</span>"+
    "</div>"+
    "<h4></h4><p></p>"+
    '<div class="explore-card-foot"><button type="button" class="btn-use">Use</button></div>';
  card.querySelector("h4").textContent = item.title || "Untitled";
  card.querySelector("p").textContent = item.description || "";
  card.querySelector(".btn-use").addEventListener("click", async () => {
    const { res: r2, data: d2 } = await api(
      "/v1/explore/"+encodeURIComponent(item.id)+"/use",
      { method:"POST", body:"{}" },
      { success:"Added to workspace" }
    );
    if (r2.ok && d2 && d2.assistant) { setView("assistants"); loadAssistantsView(); }
    else if (r2.ok && d2 && d2.prompt) { setView("prompts"); loadPromptsView(); }
    else if (r2.ok && d2 && d2.prompt_text) {
      els.input.value = d2.prompt_text;
      autosize();
      setView("chat");
      toast("Prompt loaded","success");
    }
  });
  return card;
}

    '<div style="display:flex;gap:6px">'+

    '<button type="button" class="btn-primary" id="filesCreateBtn">'+svg("plus",14)+" Create</button></div></div>"+
    '<input type="file" id="filesUpload" class="hidden" accept="*/*"/>'+
    '<div id="filesTabs"></div><div class="ui-list" id="filesContent">'+skeletons(3)+"</div>";

  $("filesUploadBtn").onclick = () => $("filesUpload").click();
  $("filesCreateBtn").onclick = () => openFileCreateModal();
  $("filesUpload").onchange = async e => {
    const file = e.target.files && e.target.files[0]; e.target.value = "";
    if (!file) return;
    const isText = !file.type||file.type.startsWith("text/")||/\.(txt|md|json|csv)$/i.test(file.name);
    if (isText) {
      const text = await file.text();
      await api("/v1/files",{method:"POST",body:JSON.stringify({name:file.name,content:text,mime:file.type||"text/plain"})},{success:"File uploaded"});
    } else {
      const buf = await file.arrayBuffer();
      const b64 = btoa(String.fromCharCode(...new Uint8Array(buf)));
      await api("/v1/files",{method:"POST",body:JSON.stringify({name:file.name,content_base64:b64,mime:file.type||"application/octet-stream"})},{success:"File uploaded"});
    }
    loadFilesTab(activeFilesTab);
  };

  const fileTabs = [["all","All"],["documents","Documents"],["images","Images"],["code","Code"],["recent","Recent"]];
  buildTabs($("filesTabs"), fileTabs, id => { activeFilesTab = id; loadFilesTab(id); }, activeFilesTab||"all");
  loadFilesTab(activeFilesTab||"all");
}

      loadFilesTab(activeFilesTab);
    }
  );

function fileIconFor(f) {
  const mime = String(f.mime||"");
  const name = String(f.name||"");
  if (mime.startsWith("image/") || /\.(png|jpe?g|gif|webp)$/i.test(name)) return "image";
  if (mime.includes("json") || /\.(js|ts|py|go|rs|java|c|cpp|html|css)$/i.test(name)) return "code";
  return "file";
}

function formatBytes(n) {
  const v = Number(n)||0;
  if (v < 1024) return v+" B";
  if (v < 1048576) return (v/1024).toFixed(1)+" KB";
  return (v/1048576).toFixed(1)+" MB";
}
