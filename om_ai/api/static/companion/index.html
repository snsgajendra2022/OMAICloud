<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OM</title>
  <style>
    :root {
      --ink: #e8f4ff;
      --muted: #7fa0b8;
      --line: rgba(117,213,227,0.22);
      --cyan: #75d5e3;
      --cyan-bright: #b8f4ff;
      --cyan-dim: rgba(117,213,227,0.35);
      --gold: #d4af37;
      --ok: #5ee0a8;
      --danger: #ff7b7b;
      --bg: #050a10;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      color: var(--ink);
      font-family: "Avenir Next", "SF Pro Display", "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse 70% 55% at 50% 42%, rgba(20,60,90,0.45), transparent 70%),
        radial-gradient(circle at 50% 50%, #0a1520 0%, var(--bg) 70%);
      overflow: hidden;
    }
    .shell {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
      max-width: 980px;
      margin: 0 auto;
      padding: 18px 22px 28px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      z-index: 2;
    }
    .brand {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 700;
      letter-spacing: 0.14em;
      line-height: 1;
      color: var(--cyan-bright);
      text-shadow: 0 0 24px rgba(117,213,227,0.45);
    }
    .hint { color: var(--muted); font-size: 0.85rem; }
    .stage {
      display: grid;
      place-items: center;
      text-align: center;
      gap: 12px;
      position: relative;
    }
    /* —— Jarvis HUD —— */
    .orb-wrap {
      position: relative;
      width: min(420px, 86vw);
      height: min(420px, 86vw);
      display: grid;
      place-items: center;
      user-select: none;
    }
    .hud-aura {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 116%;
      height: 116%;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0.95;
      z-index: 0;
    }
    .hud-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 0 6px rgba(117,213,227,0.55)) drop-shadow(0 0 18px rgba(117,213,227,0.25));
    }
    .hud-spin-cw { animation: spinCW 28s linear infinite; transform-origin: 50% 50%; }
    .hud-spin-ccw { animation: spinCCW 38s linear infinite; transform-origin: 50% 50%; }
    .hud-spin-fast { animation: spinCW 14s linear infinite; transform-origin: 50% 50%; }
    .hud-pulse { animation: hudPulse 2.8s ease-in-out infinite; }
    @keyframes spinCW { to { transform: rotate(360deg); } }
    @keyframes spinCCW { to { transform: rotate(-360deg); } }
    @keyframes hudPulse {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 1; }
    }
    .orb {
      position: relative;
      width: 52%;
      height: 52%;
      border-radius: 50%;
      z-index: 2;
      background: radial-gradient(circle at 50% 50%, #0a141c 0%, #050c14 65%, #02060a 100%);
      box-shadow:
        0 0 0 1.5px rgba(220,245,255,0.95),
        0 0 22px rgba(117,213,227,0.65),
        0 0 48px rgba(117,213,227,0.28),
        inset 0 0 40px rgba(117,213,227,0.1);
      overflow: hidden;
    }
    .presence3d {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      border-radius: 50%;
      overflow: hidden;
      opacity: 0.92;
      transition: opacity .25s ease;
    }
    .orb-wrap[data-state="speaking"] .presence3d,
    .orb-wrap[data-presence="speaking"] .presence3d,
    .orb-wrap[data-presence="attentive"] .presence3d {
      opacity: 1;
    }
    .orb-wrap[data-state="speaking"] .orb-core {
      opacity: 0.55;
    }
    .orb-core {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: block;
    }
    .orb-wrap[data-state="listening"] .orb {
      box-shadow:
        0 0 0 2px rgba(184,244,255,0.95),
        0 0 22px rgba(117,213,227,0.7),
        0 0 55px rgba(117,213,227,0.35),
        inset 0 0 36px rgba(117,213,227,0.18);
    }
    .orb-wrap[data-state="thinking"] .hud-svg { animation-duration: 0.01s; filter: drop-shadow(0 0 10px rgba(117,213,227,0.8)); }
    .orb-wrap[data-state="thinking"] .hud-spin-cw { animation-duration: 8s; }
    .orb-wrap[data-state="thinking"] .hud-spin-ccw { animation-duration: 11s; }
    .orb-wrap[data-state="speaking"] .orb {
      transform: scale(1.04);
      box-shadow:
        0 0 0 2px #fff,
        0 0 28px rgba(255,255,255,0.55),
        0 0 60px rgba(117,213,227,0.5),
        inset 0 0 40px rgba(255,255,255,0.15);
    }
    .orb-wrap[data-state="muted"] { filter: grayscale(0.55) brightness(0.65); }
    .status {
      display: inline-flex; align-items: center; gap: 10px;
      color: var(--muted); letter-spacing: 0.14em; text-transform: uppercase;
      font-size: 0.75rem;
    }
    .status i {
      width: 8px; height: 8px; border-radius: 50%; background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
    }
    .status[data-mode="muted"] i { background: var(--danger); box-shadow: 0 0 12px var(--danger); }
    .said {
      max-width: 36rem;
      font-size: clamp(1.1rem, 2.3vw, 1.45rem);
      line-height: 1.4;
      min-height: 2.8em;
      margin: 0;
      color: #d7eef8;
    }
    .said::before {
      content: "OM";
      display: block;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 6px;
      opacity: 0.85;
    }
    .heard {
      color: #b8d4e4;
      font-size: 1.02rem;
      min-height: 1.3em;
      margin: 0;
      max-width: 36rem;
    }
    .heard:empty { display: none; }
    .feeling {
      color: var(--gold);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      min-height: 1em;
      opacity: 0.9;
    }
    .enable-once,
    .mic-help,
    .live-pill,
    .memory-line {
      display: none !important;
    }
    .feeling:empty { display: none; }
    .activity { display: none !important; }
    .perm {
      display: none; gap: 10px; align-items: center; justify-content: center;
      padding: 10px 14px; border-radius: 16px;
      border: 1px solid rgba(212,175,55,0.4);
      background: rgba(212,175,55,0.08); color: #ffe7b0; max-width: 34rem;
    }
    .perm.show { display: flex; flex-wrap: wrap; }
    .perm button {
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: var(--ink); border-radius: 999px;
      padding: 8px 14px; font: inherit; cursor: pointer;
    }
    .mic-help.show { display: block; }
    .mic-help strong { color: #fff; }
    .mic-help code {
      background: rgba(0,0,0,0.35); padding: 1px 6px;
      border-radius: 6px; font-size: 0.82rem;
    }
    .mic-help ol { margin: 8px 0 0; padding-left: 1.2rem; }
    .wave {
      display: flex; gap: 3px; height: 18px; align-items: flex-end; justify-content: center;
      opacity: 0; transition: opacity .2s;
    }
    .wave.on { opacity: 1; }
    .wave span {
      width: 3px; height: 6px; border-radius: 2px;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
      animation: bar 0.7s ease-in-out infinite;
    }
    .wave span:nth-child(2) { animation-delay: .1s; }
    .wave span:nth-child(3) { animation-delay: .2s; }
    .wave span:nth-child(4) { animation-delay: .3s; }
    .wave span:nth-child(5) { animation-delay: .15s; }
    @keyframes bar { 50% { height: 18px; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">OM</div>
      <div class="hint" id="privacyHint"></div>
    </header>

    <main class="stage">
      <div class="orb-wrap" id="orbWrap" data-state="idle">
        <canvas class="hud-aura" id="auraCanvas"></canvas>
        <svg class="hud-svg" viewBox="0 0 400 400" aria-hidden="true">
          <defs>
            <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#b8f4ff"/>
              <stop offset="45%" stop-color="#75d5e3"/>
              <stop offset="100%" stop-color="#3a9bb0"/>
            </linearGradient>
            <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="2.2" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <!-- outermost tick ring -->
          <g class="hud-spin-ccw" filter="url(#softGlow)">
            <circle cx="200" cy="200" r="188" fill="none" stroke="rgba(117,213,227,0.28)" stroke-width="1"/>
            <circle cx="200" cy="200" r="188" fill="none" stroke="#75d5e3" stroke-width="2.5"
              stroke-dasharray="2 6 2 6 14 8 2 6 2 6 2 6 28 10" stroke-linecap="butt" opacity="0.85"/>
            <g stroke="#75d5e3" stroke-width="1.2" opacity="0.7">
              <line x1="200" y1="8" x2="200" y2="18"/><line x1="200" y1="382" x2="200" y2="392"/>
              <line x1="8" y1="200" x2="18" y2="200"/><line x1="382" y1="200" x2="392" y2="200"/>
            </g>
          </g>
          <!-- segmented primary band -->
          <g class="hud-spin-cw" filter="url(#softGlow)">
            <circle cx="200" cy="200" r="168" fill="none" stroke="rgba(117,213,227,0.12)" stroke-width="22"/>
            <circle cx="200" cy="200" r="168" fill="none" stroke="url(#ringGrad)" stroke-width="16"
              stroke-dasharray="100 18" stroke-linecap="butt" opacity="0.92"/>
            <circle cx="200" cy="200" r="168" fill="none" stroke="rgba(184,244,255,0.35)" stroke-width="3"
              stroke-dasharray="4 10 4 10 40 14" opacity="0.9"/>
            <!-- gold accent arc (bottom-left like reference) -->
            <path d="M 95 268 A 168 168 0 0 0 132 310" fill="none" stroke="#d4af37" stroke-width="5"
              stroke-linecap="round" opacity="0.95"/>
            <path d="M 88 255 A 168 168 0 0 0 95 268" fill="none" stroke="#f0d878" stroke-width="2.5" opacity="0.8"/>
          </g>
          <!-- mid detail ring -->
          <g class="hud-spin-fast" filter="url(#softGlow)">
            <circle cx="200" cy="200" r="142" fill="none" stroke="rgba(117,213,227,0.45)" stroke-width="1.5"
              stroke-dasharray="1 3 1 3 8 5"/>
            <circle cx="200" cy="200" r="136" fill="none" stroke="#75d5e3" stroke-width="2"
              stroke-dasharray="28 8 6 8 28 8 6 8" opacity="0.75"/>
            <!-- block markers -->
            <rect x="196" y="54" width="8" height="6" rx="1" fill="#75d5e3" opacity="0.85"/>
            <rect x="196" y="340" width="8" height="6" rx="1" fill="#75d5e3" opacity="0.85"/>
            <rect x="54" y="196" width="6" height="8" rx="1" fill="#75d5e3" opacity="0.85"/>
            <rect x="340" y="196" width="6" height="8" rx="1" fill="#75d5e3" opacity="0.7"/>
          </g>
          <!-- inner thin rings -->
          <g class="hud-pulse" filter="url(#softGlow)">
            <circle cx="200" cy="200" r="118" fill="none" stroke="rgba(184,244,255,0.55)" stroke-width="1.5"/>
            <circle cx="200" cy="200" r="112" fill="none" stroke="rgba(117,213,227,0.35)" stroke-width="1"
              stroke-dasharray="2 4"/>
            <circle cx="200" cy="200" r="104" fill="none" stroke="rgba(184,244,255,0.7)" stroke-width="1.2"/>
          </g>
        </svg>
        <div class="orb" id="orb">
          <canvas class="orb-core" id="coreCanvas"></canvas>
          <div class="presence3d" id="presence3d" aria-hidden="true"></div>
        </div>
      </div>

      <div class="status" id="statusRow"><i></i><span id="stateLabel">READY</span></div>
      <div class="wave" id="wave"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="live-pill" id="livePill" hidden aria-hidden="true"></div>
      <p class="heard" id="heard"></p>
      <p class="feeling" id="feeling"></p>
      <p class="said" id="reply"></p>
      <p class="memory-line" id="memoryLine"></p>
      <p class="activity" id="activity" hidden aria-hidden="true"></p>

      <!-- Auto-connect: no tap / no mic help chrome -->
      <button class="enable-once hidden" id="btnEnable" type="button" aria-hidden="true" tabindex="-1"></button>
      <div class="mic-help" id="micHelp" hidden aria-hidden="true"><div id="micHelpBody"></div></div>

      <div class="perm" id="permBox">
        <span id="permText">Permission needed</span>
        <button type="button" id="btnYes">Allow</button>
        <button type="button" id="btnNo">Deny</button>
      </div>
    </main>
  </div>

  <script src="/static/companion/presence3d.js"></script>
  <script>
    const els = {
      orbWrap: document.getElementById('orbWrap'),
      coreCanvas: document.getElementById('coreCanvas'),
      auraCanvas: document.getElementById('auraCanvas'),
      stateLabel: document.getElementById('stateLabel'),
      statusRow: document.getElementById('statusRow'),
      reply: document.getElementById('reply'),
      heard: document.getElementById('heard'),
      feeling: document.getElementById('feeling'),
      activity: document.getElementById('activity'),
      memoryLine: document.getElementById('memoryLine'),
      wave: document.getElementById('wave'),
      btnEnable: document.getElementById('btnEnable'),
      livePill: document.getElementById('livePill'),
      permBox: document.getElementById('permBox'),
      permText: document.getElementById('permText'),
      micHelp: document.getElementById('micHelp'),
      micHelpBody: document.getElementById('micHelpBody'),
      privacyHint: document.getElementById('privacyHint'),
    };

    let sessionId = null;
    let muted = false;
    let alwaysOn = false;
    let listening = false;
    let speaking = false;
    let busy = false;
    let micReady = false;
    let micStream = null;
    let energyBoost = 0;
    let recognition = null;
    let audioEl = null;
    let pendingPermissionId = null;
    let pendingGreeting = null;
    let restartTimer = null;
    let bargeAnalyser = null;
    let bargeCtx = null;
    let bargeRaf = 0;
    let lastBargeAt = 0;
    let speakStartedAt = 0;
    let bargeHits = 0;
    let turnQueue = [];
    let chatHistory = [];
    let companionWs = null;
    let lastVoicePlan = null;
    let holdBuffer = '';
    let holdTimer = null;
    let lastPartialAt = 0;
    let partialTimer = null;
    const HOLD_MS = 950; // wait for incomplete thought before committing


    /* —— White emission particle core (Jarvis HUD) —— */
    const core = { particles: [], raf: 0, w: 0, h: 0, ctx: null };
    const aura = { particles: [], raf: 0, w: 0, h: 0, ctx: null };

    function resizeCanvases() {
      const orb = document.getElementById('orb');
      const wrap = els.orbWrap;
      if (orb && els.coreCanvas) {
        const r = orb.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        core.w = Math.max(1, Math.floor(r.width));
        core.h = Math.max(1, Math.floor(r.height));
        els.coreCanvas.width = core.w * dpr;
        els.coreCanvas.height = core.h * dpr;
        core.ctx = els.coreCanvas.getContext('2d');
        core.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        seedCoreParticles();
      }
      if (wrap && els.auraCanvas) {
        const r = wrap.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        aura.w = Math.max(1, Math.floor(r.width * 1.16));
        aura.h = Math.max(1, Math.floor(r.height * 1.16));
        els.auraCanvas.width = aura.w * dpr;
        els.auraCanvas.height = aura.h * dpr;
        els.auraCanvas.style.width = aura.w + 'px';
        els.auraCanvas.style.height = aura.h + 'px';
        aura.ctx = els.auraCanvas.getContext('2d');
        aura.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        seedAuraParticles();
      }
    }

    function seedCoreParticles() {
      const n = 720;
      const cx = core.w / 2, cy = core.h / 2;
      const maxR = Math.min(cx, cy) * 0.96;
      core.particles = [];
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        // bias toward rim for bright white emission ring
        const rimBias = Math.pow(Math.random(), 0.35);
        const rr = rimBias * maxR;
        core.particles.push({
          x: cx + Math.cos(a) * rr,
          y: cy + Math.sin(a) * rr,
          vx: (Math.random() - 0.5) * 0.28,
          vy: (Math.random() - 0.5) * 0.28,
          r: 0.45 + Math.random() * 1.65,
          a: 0.4 + Math.random() * 0.6,
          bright: Math.random() > 0.55,
        });
      }
    }

    function seedAuraParticles() {
      const n = 140;
      const cx = aura.w / 2, cy = aura.h / 2;
      const inner = Math.min(cx, cy) * 0.64;
      const outer = Math.min(cx, cy) * 0.99;
      aura.particles = [];
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const rr = inner + Math.random() * (outer - inner);
        aura.particles.push({
          x: cx + Math.cos(a) * rr,
          y: cy + Math.sin(a) * rr,
          vx: (Math.random() - 0.5) * 0.15,
          vy: (Math.random() - 0.5) * 0.15,
          r: 0.4 + Math.random() * 1.5,
          a: 0.12 + Math.random() * 0.5,
        });
      }
    }

    function tickCore() {
      if (!core.ctx || !core.w) return;
      const ctx = core.ctx;
      const cx = core.w / 2, cy = core.h / 2;
      const maxR = Math.min(cx, cy) * 0.96;
      const boost = 1 + energyBoost;
      ctx.clearRect(0, 0, core.w, core.h);
      const g = ctx.createRadialGradient(cx, cy, maxR * 0.05, cx, cy, maxR);
      g.addColorStop(0, 'rgba(255,255,255,0.06)');
      g.addColorStop(0.45, 'rgba(184,244,255,0.07)');
      g.addColorStop(0.82, 'rgba(117,213,227,0.05)');
      g.addColorStop(1, 'rgba(5,10,16,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, core.w, core.h);
      for (const p of core.particles) {
        p.x += p.vx * boost;
        p.y += p.vy * boost;
        const dx = p.x - cx, dy = p.y - cy;
        const d = Math.sqrt(dx * dx + dy * dy) || 1;
        if (d > maxR) {
          const a = Math.random() * Math.PI * 2;
          const rr = Math.pow(Math.random(), 0.35) * maxR;
          p.x = cx + Math.cos(a) * rr;
          p.y = cy + Math.sin(a) * rr;
        }
        p.vx += (-dy / d) * 0.0035 * boost;
        p.vy += (dx / d) * 0.0035 * boost;
        p.vx *= 0.992; p.vy *= 0.992;
        const rim = Math.min(1, d / maxR);
        const alpha = p.a * (0.35 + rim * 0.7) * (0.8 + energyBoost * 0.45);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * (0.95 + energyBoost * 0.4), 0, Math.PI * 2);
        ctx.fillStyle = p.bright
          ? `rgba(255,255,255,${Math.min(1, alpha)})`
          : `rgba(210,242,255,${Math.min(0.95, alpha * 0.9)})`;
        ctx.fill();
      }
      // bright white rim emission
      ctx.beginPath();
      ctx.arc(cx, cy, maxR * 0.985, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,255,255,${0.45 + energyBoost * 0.4})`;
      ctx.lineWidth = 1.8 + energyBoost * 1.2;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, cy, maxR * 0.97, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(180,235,255,${0.25 + energyBoost * 0.2})`;
      ctx.lineWidth = 4 + energyBoost;
      ctx.stroke();
      // gentle energy decay
      if (energyBoost > 0 && els.orbWrap.dataset.state !== 'speaking') {
        energyBoost = Math.max(0, energyBoost - 0.012);
      }
      core.raf = requestAnimationFrame(tickCore);
    }

    function tickAura() {
      if (!aura.ctx || !aura.w) return;
      const ctx = aura.ctx;
      const cx = aura.w / 2, cy = aura.h / 2;
      const inner = Math.min(cx, cy) * 0.58;
      const outer = Math.min(cx, cy) * 0.99;
      ctx.clearRect(0, 0, aura.w, aura.h);
      for (const p of aura.particles) {
        p.x += p.vx;
        p.y += p.vy;
        const dx = p.x - cx, dy = p.y - cy;
        const d = Math.sqrt(dx * dx + dy * dy) || 1;
        if (d < inner || d > outer) {
          const a = Math.random() * Math.PI * 2;
          const rr = inner + Math.random() * (outer - inner);
          p.x = cx + Math.cos(a) * rr;
          p.y = cy + Math.sin(a) * rr;
        }
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(180,235,255,${p.a})`;
        ctx.fill();
      }
      aura.raf = requestAnimationFrame(tickAura);
    }

    function startHud() {
      resizeCanvases();
      cancelAnimationFrame(core.raf);
      cancelAnimationFrame(aura.raf);
      tickCore();
      tickAura();
      mountPresence();
    }

    function mountPresence() {
      const host = document.getElementById('presence3d');
      if (!host || !window.OMPresence3D) return;
      try {
        const mounted = window.OMPresence3D.mount(host);
        if (mounted && window.OMPresence3D.setPresence) {
          window.OMPresence3D.setPresence(els.orbWrap.dataset.presence || 'idle');
        }
      } catch (_) {}
    }

    window.addEventListener('om-presence-mouth', (ev) => {
      const energy = Number(ev.detail && ev.detail.energy);
      if (Number.isFinite(energy)) {
        energyBoost = Math.max(energyBoost, Math.min(1.8, 0.25 + energy * 1.6));
      }
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const isLocal = /^(localhost|127\.0\.0\.1)$/i.test(location.hostname);

    function startEnergy() {
      energyBoost = 1.2;
    }
    function stopEnergy() {
      /* decay handled in tickCore */
      if (energyBoost < 0.35) energyBoost = 0.35;
    }

    window.addEventListener('resize', resizeCanvases);
    startHud();

    function showActivity(items) {
      // Never dump internal pipeline chrome on the HUD (production companion)
      els.activity.textContent = '';
    }

    function setState(state, presenceMode) {
      const s = String(state || 'idle').toLowerCase();
      let mode = 'idle';
      if (muted) mode = 'muted';
      else if (s.includes('speak')) mode = 'speaking';
      else if (s.includes('think') || s.includes('understand') || s.includes('generat') || s.includes('plan') || s.includes('transcrib') || s.includes('remember')) mode = 'listening';
      else if (s.includes('listen') || alwaysOn) mode = 'listening';
      else if (s.includes('permission')) mode = 'waiting_permission';
      else if (['attentive','curious','focused','concerned','excited','confused','waiting','explaining','silent_listening'].includes(s)) {
        mode = (s === 'excited' || s === 'explaining') ? 'speaking' : 'listening';
      }
      els.orbWrap.dataset.state = mode;
      if (presenceMode && !String(presenceMode).toLowerCase().includes('think') && !String(presenceMode).toLowerCase().includes('understand')) {
        els.orbWrap.dataset.presence = String(presenceMode).toLowerCase();
      } else {
        els.orbWrap.dataset.presence = mode;
      }
      // Human labels only — never THINKING / UNDERSTANDING chrome
      let label = 'WITH YOU';
      if (muted) label = 'MUTED';
      else if (mode === 'speaking') label = 'SPEAKING';
      else if (mode === 'waiting_permission') label = 'NEEDING A YES';
      else if (alwaysOn) label = 'LISTENING';
      else label = 'READY';
      els.stateLabel.textContent = label;
      els.statusRow.dataset.mode = muted ? 'muted' : '';
      els.wave.classList.toggle('on', mode === 'listening' || mode === 'speaking');
      els.livePill.classList.toggle('on', alwaysOn && !muted);
      if (window.OMPresence3D) {
        try {
          window.OMPresence3D.setPresence(els.orbWrap.dataset.presence || mode);
          window.OMPresence3D.setSpeaking(mode === 'speaking', mode === 'speaking' ? 0.22 : 0);
        } catch (_) {}
      }
      if (mode === 'speaking') startEnergy(); else if (mode !== 'listening') stopEnergy();
      else energyBoost = Math.max(energyBoost, 0.25);
      els.activity.textContent = '';
    }

    function showMicBlocked(_reason) {
      // Never show instructional chrome — keep HUD clean and keep trying quietly
      hideMicHelp();
      if (els.btnEnable) els.btnEnable.classList.add('hidden');
      if (els.activity) els.activity.textContent = '';
    }

    function hideMicHelp() {
      if (els.micHelp) {
        els.micHelp.classList.remove('show');
        els.micHelp.hidden = true;
      }
    }

    async function api(path, opts = {}) {
      const res = await fetch('/api/companion' + path, {
        headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
        ...opts,
      });
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    async function ensureMicPermission() {
      // Soft mic: never block the companion UI. SpeechRecognition can still work.
      if (micReady && micStream?.active) return micStream;
      try {
        const md = navigator.mediaDevices;
        if (!md || typeof md.getUserMedia !== 'function') {
          micReady = false;
          return null;
        }
        if (micStream) micStream.getTracks().forEach((t) => t.stop());
        micStream = await md.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
        });
        micReady = true;
        hideMicHelp();
        startBargeMonitor(micStream);
        return micStream;
      } catch (_) {
        micReady = false;
        return null;
      }
    }

    function startBargeMonitor(stream) {
      try {
        if (bargeCtx) {
          try { if (bargeCtx.state === 'suspended') bargeCtx.resume(); } catch (_) {}
          return;
        }
        bargeCtx = new (window.AudioContext || window.webkitAudioContext)();
        try { bargeCtx.resume(); } catch (_) {}
        const src = bargeCtx.createMediaStreamSource(stream);
        bargeAnalyser = bargeCtx.createAnalyser();
        bargeAnalyser.fftSize = 512;
        src.connect(bargeAnalyser);
        const data = new Uint8Array(bargeAnalyser.frequencyBinCount);
        const tick = () => {
          bargeRaf = requestAnimationFrame(tick);
          // Only barge while OM is speaking — never kill TTS from speaker bleed
          if (!speaking || muted) {
            bargeHits = 0;
            return;
          }
          // Grace: ignore first 900ms of TTS (speaker → mic echo)
          if (performance.now() - speakStartedAt < 900) {
            bargeHits = 0;
            return;
          }
          bargeAnalyser.getByteTimeDomainData(data);
          let sum = 0;
          for (let i = 0; i < data.length; i++) {
            const v = (data[i] - 128) / 128;
            sum += v * v;
          }
          const rms = Math.sqrt(sum / data.length);
          const now = performance.now();
          // Require strong, sustained voice — not TTS bleed
          if (rms > 0.18) bargeHits += 1;
          else bargeHits = Math.max(0, bargeHits - 2);
          if (bargeHits >= 8 && now - lastBargeAt > 1200) {
            lastBargeAt = now;
            bargeHits = 0;
            stopSpeakingLocal();
            setState('INTERRUPTED');
            scheduleListen(120);
          }
        };
        tick();
      } catch (_) {}
    }

    async function startSession() {
      const data = await api('/session', { method: 'POST', body: '{}' });
      sessionId = data.session_id;
      connectCompanionWs(sessionId);
      if (data.memory_line && els.memoryLine) {
        // Keep memory internal — do not display chrome on HUD
        els.memoryLine.textContent = '';
      }
      if (data.user && data.user.name && els.privacyHint) {
        els.privacyHint.textContent = '';
      }
      if (data.avatar && window.OMPresence3D) {
        try { window.OMPresence3D.applyAvatarState(data.avatar); } catch (_) {}
      }
      if (data.greeting) {
        const g = String(data.greeting).replace(/\[\[slnc\s+\d+\]\]/gi, ' ').replace(/\s+/g, ' ').trim();
        els.reply.textContent = g;
        pendingGreeting = data.spoken_tts || data.greeting;
        pushHistory('assistant', g);
      }
      return data;
    }

    function connectCompanionWs(sid) {
      if (!sid) return;
      try {
        if (companionWs) {
          try { companionWs.onclose = null; companionWs.close(); } catch (_) {}
          companionWs = null;
        }
        const proto = location.protocol === 'https:' ? 'wss' : 'ws';
        const ws = new WebSocket(proto + '://' + location.host + '/api/companion/ws/' + encodeURIComponent(sid));
        companionWs = ws;
        ws.onmessage = (ev) => {
          let msg = null;
          try { msg = JSON.parse(ev.data); } catch (_) { return; }
          const et = msg.event_type || msg.type || '';
          const payload = msg.payload || msg.data || msg;
          if (et === 'avatar.state' || et === 'presence.state') {
            if (window.OMPresence3D) {
              try {
                if (et === 'avatar.state') window.OMPresence3D.applyAvatarState(payload);
                else {
                  const mode = payload.mode || payload.state
                    || (payload.presence && (payload.presence.mode || payload.presence));
                  if (mode) window.OMPresence3D.setPresence(mode);
                }
              } catch (_) {}
            }
            const mode = (payload && (payload.mode || payload.state || (payload.presence && payload.presence.mode))) || '';
            if (mode && !speaking) setState(mode, mode);
          }
          if (et === 'permission.required' && payload) {
            pendingPermissionId = payload.permission_id;
            const ask = payload.prompt || 'Allow this action?';
            els.permText.textContent = ask;
            els.permBox.classList.add('show');
          }
        };
        ws.onclose = () => {
          companionWs = null;
          if (sessionId && alwaysOn) {
            setTimeout(() => { if (sessionId === sid) connectCompanionWs(sid); }, 1200);
          }
        };
        ws.onerror = () => {};
      } catch (_) {}
    }

    function pushHistory(role, content) {
      const c = String(content || '').trim();
      if (!c) return;
      chatHistory.push({ role, content: c.slice(0, 2000) });
      if (chatHistory.length > 24) chatHistory = chatHistory.slice(-24);
    }

    function flushTurnQueue() {
      if (busy || speaking || !turnQueue.length) return;
      const next = turnQueue.shift();
      if (next) handleTurn(next);
    }

    let speakGen = 0;
    let turnGen = 0;

    function isStopCommand(text) {
      const t = String(text || '').toLowerCase().replace(/[^\w\s']/g, ' ').replace(/\s+/g, ' ').trim();
      if (!t) return false;
      const exact = new Set([
        'stop','cancel','cancel that','mute','quiet','enough','shut up','be quiet',
        'ruk','ruko','ruk jao','band karo','band kar','chup','chup raho','bas','bas karo'
      ]);
      return exact.has(t) || t.startsWith('stop ') || t.startsWith('cancel ') || t === 'ruk ja';
    }

    function stopSpeakingLocal() {
      speakGen += 1;
      speaking = false;
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      if (audioEl) { try { audioEl.pause(); audioEl.src = ''; } catch (_) {} audioEl = null; }
      if (lipRaf) { cancelAnimationFrame(lipRaf); lipRaf = 0; }
      if (window.OMPresence3D) {
        try { window.OMPresence3D.setSpeaking(false, 0); } catch (_) {}
      }
      api('/interrupt', { method: 'POST', body: '{}' }).catch(() => {});
    }

    function scheduleListen(ms = 250) {
      if (restartTimer) clearTimeout(restartTimer);
      restartTimer = setTimeout(() => {
        if (alwaysOn && !muted && !busy && !speaking) startListening(true);
      }, ms);
    }

    let lipRaf = 0;
    let lipAudioCtx = null;

    function driveLipsFromAudio(audio, lipsPlan) {
      if (window.OMPresence3D && lipsPlan) {
        try { window.OMPresence3D.applyLipPlan(lipsPlan); } catch (_) {}
      } else if (window.OMPresence3D) {
        try { window.OMPresence3D.setSpeaking(true, 0.2); } catch (_) {}
      }
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC || !audio) return;
        if (!lipAudioCtx) lipAudioCtx = new AC();
        const src = lipAudioCtx.createMediaElementSource(audio);
        const analyser = lipAudioCtx.createAnalyser();
        analyser.fftSize = 256;
        src.connect(analyser);
        analyser.connect(lipAudioCtx.destination);
        const data = new Uint8Array(analyser.frequencyBinCount);
        const tick = () => {
          if (!speaking || !audioEl) return;
          analyser.getByteFrequencyData(data);
          let sum = 0;
          for (let i = 0; i < data.length; i++) sum += data[i];
          const avg = sum / (data.length * 255);
          energyBoost = Math.max(0.35, Math.min(1.8, 0.4 + avg * 2.2));
          if (window.OMPresence3D) {
            try { window.OMPresence3D.setMouth(avg); } catch (_) {}
          }
          lipRaf = requestAnimationFrame(tick);
        };
        lipAudioCtx.resume().catch(() => {});
        lipRaf = requestAnimationFrame(tick);
      } catch (_) {
        // Viseme plan alone is enough for procedural jaw
        energyBoost = 1.1;
      }
    }

    async function speak(text, emotion, voicePlan) {
      const say = String(text || '').trim();
      if (!say || muted) {
        speaking = false;
        setState('LISTENING');
        scheduleListen(120);
        flushTurnQueue();
        return;
      }
      // Do not bump speakGen here via stopSpeakingLocal before assigning myGen —
      // only cancel prior audio, then own this generation.
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      if (audioEl) { try { audioEl.pause(); audioEl.src = ''; } catch (_) {} audioEl = null; }
      speakGen += 1;
      const myGen = speakGen;
      speaking = true;
      speakStartedAt = performance.now();
      bargeHits = 0;
      setState('SPEAKING', 'speaking');
      // Pause STT while OM talks (avoids echo / false finals)
      try { if (recognition) recognition.stop(); } catch (_) {}
      try { if (bargeCtx && bargeCtx.state === 'suspended') await bargeCtx.resume(); } catch (_) {}
      const emo = emotion || (voicePlan && voicePlan.emotion) || 'calm';
      try {
        const res = await fetch('/api/companion/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text: say,
            emotion: emo,
            presence: (voicePlan && voicePlan.presence) || 'speaking',
          }),
        });
        if (myGen !== speakGen) {
          speaking = false;
          return;
        }
        if (res.ok) {
          let lipsPlan = (voicePlan && voicePlan.lips) || null;
          const lipsHdr = res.headers.get('X-OM-Lips');
          if (!lipsPlan && lipsHdr) {
            try { lipsPlan = JSON.parse(lipsHdr); } catch (_) {}
          }
          if (!lipsPlan) {
            try {
              const planRes = await fetch('/api/companion/voice/plan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: say, emotion: emo }),
              });
              if (planRes.ok) {
                const pj = await planRes.json();
                lipsPlan = pj.lips || null;
              }
            } catch (_) {}
          }
          if (myGen !== speakGen) { speaking = false; return; }
          const blob = await res.blob();
          if (myGen !== speakGen) { speaking = false; return; }
          if (!blob || blob.size < 64) {
            throw new Error('empty_tts_blob');
          }
          const url = URL.createObjectURL(blob);
          audioEl = new Audio(url);
          audioEl.volume = 1.0;
          audioEl.muted = false;
          const hdrRate = Number(res.headers.get('X-OM-Playback-Rate') || '');
          let playRate = Number.isFinite(hdrRate) && hdrRate > 0.85 && hdrRate < 1.2
            ? hdrRate
            : 1.0;
          if (emo === 'excited') playRate = Math.min(1.06, Math.max(1.0, playRate));
          audioEl.playbackRate = playRate;
          if ('preservesPitch' in audioEl) audioEl.preservesPitch = true;
          driveLipsFromAudio(audioEl, lipsPlan);
          await new Promise((resolve, reject) => {
            audioEl.onended = resolve;
            audioEl.onerror = reject;
            const p = audioEl.play();
            if (p && typeof p.then === 'function') p.catch(reject);
          });
          URL.revokeObjectURL(url);
          if (myGen !== speakGen) { speaking = false; return; }
          speaking = false;
          if (lipRaf) { cancelAnimationFrame(lipRaf); lipRaf = 0; }
          if (window.OMPresence3D) {
            try { window.OMPresence3D.setSpeaking(false, 0); } catch (_) {}
          }
          setState('LISTENING');
          scheduleListen(200);
          flushTurnQueue();
          return;
        }
        console.warn('OM TTS failed — status', res.status);
      } catch (e) {
        console.warn('OM TTS error', e);
      }

      if (myGen !== speakGen) { speaking = false; return; }
      // Browser fallback — any available voice (prefer Indian male)
      if (window.speechSynthesis) {
        const voices = speechSynthesis.getVoices();
        const preferred =
          voices.find(v => /aman/i.test(v.name)) ||
          voices.find(v => /rishi/i.test(v.name)) ||
          voices.find(v => /en-IN/i.test(v.lang) && /male|aman|rishi/i.test(v.name)) ||
          voices.find(v => /hi-IN/i.test(v.lang)) ||
          voices.find(v => /^en/i.test(v.lang)) ||
          voices[0];
        if (preferred) {
          if (window.OMPresence3D) {
            try { window.OMPresence3D.setSpeaking(true, 0.25); } catch (_) {}
          }
          energyBoost = 1.0;
          await new Promise((resolve) => {
            const u = new SpeechSynthesisUtterance(
              say.replace(/\[\[(slnc|rate|pbas|volm)[^\]]*\]\]/gi, ' ').replace(/\s+/g, ' ').trim()
            );
            u.rate = emo === 'excited' ? 1.08 : (emo === 'soft' || emo === 'concerned' ? 0.96 : 1.02);
            u.pitch = emo === 'excited' ? 1.05 : (emo === 'soft' ? 0.95 : 1.0);
            u.volume = 1.0;
            u.voice = preferred;
            u.onend = resolve;
            u.onerror = resolve;
            speechSynthesis.speak(u);
          });
        } else {
          console.warn('OM TTS unavailable — showing text only');
        }
      }
      if (myGen !== speakGen) { speaking = false; return; }
      speaking = false;
      if (window.OMPresence3D) {
        try { window.OMPresence3D.setSpeaking(false, 0); } catch (_) {}
      }
      setState('LISTENING');
      scheduleListen(150);
      flushTurnQueue();
    }

    async function handleTurn(text, opts) {
      const options = opts || {};
      const forceCommit = !!options.forceCommit;
      const q = String(text || '').trim();
      if (!q) return;
      // Stop must always win — even mid-speech / mid-brain
      if (isStopCommand(q)) {
        turnGen += 1;
        turnQueue = [];
        holdBuffer = '';
        if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
        stopSpeakingLocal();
        busy = false;
        els.heard.textContent = 'You said: ' + q;
        els.reply.textContent = /ruk|band|chup|bas/i.test(q) ? 'Theek hai — ruk gaya.' : 'Okay — stopped.';
        setState('LISTENING');
        try {
          await api('/message', {
            method: 'POST',
            body: JSON.stringify({ text: q, session_id: sessionId, speak: false, history: chatHistory.slice(-12) }),
          });
        } catch (_) {}
        scheduleListen(120);
        return;
      }
      if (busy && !forceCommit) {
        // Queue instead of dropping overlapping finals
        if (turnQueue.length < 3 && turnQueue[turnQueue.length - 1] !== q) turnQueue.push(q);
        return;
      }
      // Ignore tiny noise fragments
      if (q.length < 2) return;
      const myTurn = ++turnGen;
      busy = true;
      stopSpeakingLocal();
      els.heard.textContent = 'You said: ' + q;
      if (els.feeling) els.feeling.textContent = '';
      setState('LISTENING');
      if (!forceCommit) pushHistory('user', q);
      try {
        if (!sessionId) await startSession();
        const data = await api('/message', {
          method: 'POST',
          body: JSON.stringify({
            text: q,
            session_id: sessionId,
            speak: true,
            force_commit: forceCommit,
            history: chatHistory.slice(-12),
          }),
        });
        if (myTurn !== turnGen) return;
        if (data.session_id) sessionId = data.session_id;
        // Incomplete speech — keep listening, commit after natural pause
        if (data.hold) {
          holdBuffer = q;
          busy = false;
          setState('LISTENING');
          if (holdTimer) clearTimeout(holdTimer);
          holdTimer = setTimeout(() => {
            const buf = holdBuffer;
            holdBuffer = '';
            holdTimer = null;
            if (buf) handleTurn(buf, { forceCommit: true });
          }, HOLD_MS);
          scheduleListen(80);
          return;
        }
        holdBuffer = '';
        if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
        // Only skip TTS on real interrupt / empty stop — never mute a real reply
        if (data.interrupted) {
          els.reply.textContent = data.spoken || data.answer || 'Okay — stopped.';
          setState('LISTENING');
          scheduleListen(120);
          return;
        }
        showActivity([]);


        if (els.memoryLine) els.memoryLine.textContent = '';
        if (data.heard) els.heard.textContent = data.heard || '';
        if (els.feeling) els.feeling.textContent = '';
        if (data.avatar && window.OMPresence3D) {
          try { window.OMPresence3D.applyAvatarState(data.avatar); } catch (_) {}
        }
        const presenceMode = (data.presence && data.presence.mode) || data.state || '';
        if (presenceMode) setState(presenceMode, presenceMode);
        if (data.permission && data.permission.requires_approval) {
          pendingPermissionId = data.permission.permission_id;
          const ask = data.spoken || data.answer || data.permission.prompt || 'Do you want me to allow that?';
          els.permText.textContent = ask;
          els.permBox.classList.add('show');
          els.reply.textContent = ask;
          setState('WAITING_FOR_PERMISSION');
          await speak(data.spoken_tts || ask, data.feeling || 'calm', data.voice_plan);
          return;
        }
        els.permBox.classList.remove('show');
        pendingPermissionId = null;
        const answer = data.spoken || data.answer || '';
        const display = String(answer)
          .replace(/\[\[[^\]]+\]\]/g, ' ')
          .replace(/<break\s+\d+ms\s*\/>/gi, ' ')
          .replace(/\*\*/g, '')
          .replace(/\s+/g, ' ')
          .trim();
        // Never show / speak internal agent dumps in the HUD
        const internal = /agent\s*\[|agent\s*goal|collaboration\s*:|knowledge investigation|retrieve context|retrieve information/i.test(display);
        if (internal) {
          els.reply.textContent = "I'm here.";
          setState('LISTENING');
          scheduleListen(150);
          return;
        }
        if (display) {
          els.reply.textContent = display;
          pushHistory('assistant', display);
          if (myTurn !== turnGen) return;
          lastVoicePlan = data.voice_plan || null;
          await speak(
            data.spoken_tts || answer,
            data.feeling || (data.affect && data.affect.label) || 'calm',
            data.voice_plan
          );
        } else {
          setState('LISTENING');
          scheduleListen(150);
        }
      } catch (err) {
        if (myTurn !== turnGen) return;
        els.reply.textContent = 'I missed that — say it again.';
        setState('ERROR');
        console.error(err);
        scheduleListen(400);
      } finally {
        if (myTurn === turnGen) busy = false;
        flushTurnQueue();
      }
    }

    function ensureRecognition() {
      if (!SpeechRecognition) return null;
      if (recognition) return recognition;
      recognition = new SpeechRecognition();
      // continuous=true is flaky on Chrome/macOS (silent fail after greeting).
      // Restart on every onend instead — much more reliable for always-on.
      recognition.continuous = false;
      recognition.interimResults = true;
      const nav = (navigator.language || '').toLowerCase();
      recognition.lang = nav.startsWith('hi') ? 'hi-IN' : 'en-IN';
      recognition.maxAlternatives = 3;

      recognition.onstart = () => {
        listening = true;
        setState('LISTENING');
        els.activity.textContent = '';
        els.livePill.classList.add('on');
      };

      recognition.onresult = (event) => {
        let interim = '';
        let finalText = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          let chunk = event.results[i][0].transcript;
          if (event.results[i].length > 1) {
            for (let a = 0; a < event.results[i].length; a++) {
              const alt = event.results[i][a].transcript || '';
              if (/[A-Za-z]/.test(alt) && !/[\u0900-\u097F]/.test(alt)) {
                chunk = alt;
                break;
              }
            }
          }
          if (event.results[i].isFinal) finalText += chunk;
          else interim += chunk;
        }
        if (interim) {
          els.heard.textContent = interim;
          lastPartialAt = Date.now();
          // Soft partial understanding — no answer yet
          if (partialTimer) clearTimeout(partialTimer);
          partialTimer = setTimeout(() => {
            const t = String(interim || els.heard.textContent || '').trim();
            if (!t || busy || speaking) return;
            api('/partial', {
              method: 'POST',
              body: JSON.stringify({
                text: t,
                session_id: sessionId,
                history: chatHistory.slice(-8),
                rms: energyBoost || 0,
              }),
            }).catch(() => {});
          }, 280);
          // Extending hold if user still speaking mid-thought
          if (holdBuffer) {
            holdBuffer = (holdBuffer + ' ' + interim).replace(/\s+/g, ' ').trim();
            if (holdTimer) {
              clearTimeout(holdTimer);
              holdTimer = setTimeout(() => {
                const buf = holdBuffer;
                holdBuffer = '';
                holdTimer = null;
                if (buf) handleTurn(buf, { forceCommit: true });
              }, HOLD_MS);
            }
          }
        }
        if (finalText) {
          let cleaned = String(finalText).trim();
          if (holdBuffer && cleaned && !cleaned.toLowerCase().startsWith(holdBuffer.toLowerCase().slice(0, 8))) {
            cleaned = (holdBuffer + ' ' + cleaned).replace(/\s+/g, ' ').trim();
          }
          els.heard.textContent = cleaned;
          if (isStopCommand(cleaned)) {
            handleTurn(cleaned);
            return;
          }
          if (speaking) {
            // Ignore likely TTS echo — only barge on clear stop, or strong finals after grace
            const elapsed = performance.now() - speakStartedAt;
            if (isStopCommand(cleaned) || (elapsed > 900 && cleaned.split(/\s+/).length >= 3)) {
              stopSpeakingLocal();
              api('/interrupt', { method: 'POST', body: '{}' }).catch(() => {});
            } else {
              return;
            }
          }
          if (!busy) handleTurn(cleaned);
          else if (turnQueue.length < 3) turnQueue.push(cleaned);
        }
      };

      recognition.onerror = (e) => {
        listening = false;
        const err = e.error || '';
        if (err === 'not-allowed' || err === 'service-not-allowed') {
          // Keep quiet — retry without showing blocked UI
          if (alwaysOn && !muted) scheduleListen(1200);
          return;
        }
        if (alwaysOn && !muted && err !== 'aborted') {
          scheduleListen(err === 'no-speech' ? 80 : 350);
        }
      };

      recognition.onend = () => {
        listening = false;
        if (alwaysOn && !muted && !speaking) scheduleListen(80);
      };
      return recognition;
    }

    async function startListening(silent) {
      if (!alwaysOn || muted) return;
      if (busy && speaking) return;
      await ensureMicPermission(); // soft — never throws / never shows help

      // Desktop WebView: browser speech often missing — use native Python mic
      if (window.OMDesktop && window.OMDesktop.nativeMic) {
        try {
          window.OMDesktop.startNativeMic && window.OMDesktop.startNativeMic();
        } catch (_) {}
        if (!silent) setState('LISTENING');
        return;
      }
      if (window.pywebview && window.pywebview.api && window.pywebview.api.start_native_mic) {
        try { window.pywebview.api.start_native_mic(); } catch (_) {}
        if (!silent) setState('LISTENING');
        // still try browser recognition if present
      }

      const rec = ensureRecognition();
      if (!rec) {
        setState('LISTENING');
        return;
      }
      try {
        if (!listening) rec.start();
        if (!silent) setState('LISTENING');
      } catch (err) {
        try {
          recognition = null;
          listening = false;
          const rec2 = ensureRecognition();
          if (rec2) rec2.start();
        } catch (_) {
          scheduleListen(600);
        }
      }
    }

    // Native desktop mic → same turn path as speech recognition
    window.OMNativeOnFinal = function (text) {
      const cleaned = String(text || '').trim();
      if (!cleaned || muted) return;
      if (speaking) {
        stopSpeakingLocal();
        api('/interrupt', { method: 'POST', body: '{}' }).catch(() => {});
      }
      els.heard.textContent = cleaned;
      if (!busy) handleTurn(cleaned);
      else if (turnQueue.length < 3) turnQueue.push(cleaned);
    };

    function stopListening() {
      if (restartTimer) clearTimeout(restartTimer);
      if (recognition) {
        try { recognition.onend = null; recognition.stop(); } catch (_) {}
        recognition = null;
      }
      listening = false;
    }

    async function enableAlwaysOn() {
      alwaysOn = true;
      try {
        if (els.btnEnable) els.btnEnable.classList.add('hidden');
        if (els.privacyHint) els.privacyHint.textContent = '';
        hideMicHelp();
        await ensureMicPermission();
        try {
          if (bargeCtx && bargeCtx.state === 'suspended') await bargeCtx.resume();
          const unlock = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=');
          unlock.volume = 0.01;
          await unlock.play().catch(() => {});
        } catch (_) {}
        if (pendingGreeting) {
          const g = pendingGreeting;
          pendingGreeting = null;
          busy = true;
          await speak(g);
          busy = false;
        }
        speaking = false;
        setState('LISTENING');
        await startListening(true);
        if (els.activity) els.activity.textContent = '';
      } catch (_) {
        alwaysOn = true;
        setState('LISTENING');
        await startListening(true);
      }
    }

    async function micAlreadyGranted() {
      try {
        if (!navigator.permissions?.query) return false;
        const st = await navigator.permissions.query({ name: 'microphone' });
        return st.state === 'granted';
      } catch (_) {
        return false;
      }
    }

    document.getElementById('btnEnable').onclick = () => enableAlwaysOn();

    document.getElementById('btnYes').onclick = async () => {
      if (!pendingPermissionId) return;
      const data = await api('/permissions/' + pendingPermissionId + '/approve', { method: 'POST', body: '{}' });
      els.permBox.classList.remove('show');
      els.reply.textContent = data.answer || 'Done.';
      await speak(data.answer || 'Done.');
    };
    document.getElementById('btnNo').onclick = async () => {
      if (!pendingPermissionId) return;
      const data = await api('/permissions/' + pendingPermissionId + '/deny', { method: 'POST', body: '{}' });
      els.permBox.classList.remove('show');
      els.reply.textContent = data.answer || 'Cancelled.';
      await speak(data.answer || 'Cancelled.');
    };

    // Boot: auto-connect — no tap, no help text
    startSession()
      .then(async () => {
        if (els.btnEnable) els.btnEnable.classList.add('hidden');
        hideMicHelp();
        if (els.reply && /tap below|talk to me|microphone/i.test(els.reply.textContent || '')) {
          els.reply.textContent = '';
        }
        await enableAlwaysOn();
      })
      .catch(() => {
        setState('READY');
        if (els.reply) els.reply.textContent = '';
        setTimeout(() => {
          startSession().then(() => enableAlwaysOn()).catch(() => {});
        }, 800);
      });
  </script>
</body>
</html>
