<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="OM AI">
  <!-- Operating Mind mark: honeycomb node cluster — ChatGPT-like, no text -->
  <rect width="64" height="64" rx="14" fill="#111827"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="2.35" stroke-linejoin="round"
     transform="translate(32 32)">
    <!-- regular hex helper: flat-top, radius r -->
    <!-- center solid hex -->
    <path fill="#FFFFFF" stroke="none"
          d="M0-6.2 L5.37-3.1 L5.37 3.1 L0 6.2 L-5.37 3.1 L-5.37-3.1 Z"/>
    <!-- six surrounding hex rings (centers at distance 2*r*cos(30°) ≈ 10.74) -->
    <g id="ring">
      <path d="M0-6.2 L5.37-3.1 L5.37 3.1 L0 6.2 L-5.37 3.1 L-5.37-3.1 Z"
            transform="translate(0 -12.4)"/>
    </g>
    <use href="#ring" transform="rotate(60)"/>
    <use href="#ring" transform="rotate(120)"/>
    <use href="#ring" transform="rotate(180)"/>
    <use href="#ring" transform="rotate(240)"/>
    <use href="#ring" transform="rotate(300)"/>
  </g>
</svg>
